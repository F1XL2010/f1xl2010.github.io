<script>
window.F1XLTeamPrincipalHub=(function(){
  const state={season:'',data:null,team:'',tab:'overview',race:'',library:null,libraryLoading:false,libraryIssue:'',circuit:'',libraryRequest:0,busy:false,ticketBusy:false,inboxRequest:0,inboxChecked:false,inboxIssue:'',overviewLoaded:false,overviewLoading:false,marketLoaded:false,marketLoading:false,ticketsLoaded:false,ticketsLoading:false,ticketIssue:'',ticketPanel:'tickets',licenceDivision:'',licencesLoading:false,licenceRequest:0,licenceIssue:'',licencesChecked:false,overviewIssue:'',marketIssue:''};
  const contributionCache=new Map(),contributionOpen=new Set();let contributionEpoch=0;
  const el=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function num(value){const n=Number(value);return Number.isFinite(n)?String(Math.round(n)):esc(value||'0');}
  function date(value){const text=String(value==null?'':value).trim(),match=text.match(/^(\d{4})-(\d{2})-(\d{2})/);if(match)return match[3]+'/'+match[2]+'/'+match[1];const uk=text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return uk?uk[1].padStart(2,'0')+'/'+uk[2].padStart(2,'0')+'/'+uk[3]:esc(text);}
  function accent(team){const key=String(team||'').toLowerCase(),found=[['red bull','#3671c6'],['ferrari','#e80020'],['mclaren','#ff8000'],['mercedes','#27f4d2'],['aston martin','#229971'],['alpine','#ff87bc'],['williams','#64c4ff'],['haas','#b6babd'],['racing bulls','#6692ff'],['sauber','#52e252']].find(x=>key.includes(x[0]));if(found)return found[1];let hash=0;for(let i=0;i<key.length;i++)hash=(hash*31+key.charCodeAt(i))>>>0;return ['#e4b24c','#a98cff','#62c4df','#e27b8f','#78c893'][hash%5];}
  function teamGraphic(team){
    const key=String(team||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    const names={mclaren:'mclaren',ferrari:'ferrari',mercedes:'mercedes',redbull:'redbull',redbullracing:'redbull',racingbulls:'racingbull',racingbull:'racingbull',rb:'rb',astonmartin:'astonmartin',alpine:'alpine',williams:'williams',haas:'haas',sauber:'sauber',kicksauber:'kicksauber',audi:'audi',cadillac:'cadillac'};
    return names[key]?'https://f1xl.co.uk/images/teamlogos/thinlogo_'+names[key]+'.webp':'';
  }
  function table(rows,heads,row){
    const body=rows.map(item=>{let column=0;return row(item).replace(/<td>/g,()=>'<td role="cell"><span class="tph-cell-label" aria-hidden="true">'+esc(heads[column++])+'</span>');}).join('');
    return '<div class="table-scroll"><table class="tph-table" role="table"><thead role="rowgroup"><tr role="row">'+heads.map(h=>'<th scope="col" role="columnheader">'+esc(h)+'</th>').join('')+'</tr></thead><tbody role="rowgroup">'+(rows.length?body.replace(/<tr>/g,'<tr role="row">'):'<tr role="row"><td colspan="'+heads.length+'" class="secondary-line" role="cell">Nothing to show yet.</td></tr>')+'</tbody></table></div>';
  }
  function overview(data){
    const next=data.nextRound,points=data.standings.reduce((total,d)=>total+Number((d.team&&d.team.points)||0),0);
    const hero='<div class="tph-next-race"><div><span class="tph-next-label">Next race</span><strong>'+esc(next?'R'+next.round+' · '+next.track:'No upcoming race')+'</strong></div><p>'+(next?date(next.date)+' · '+esc(next.format):'No upcoming round is scheduled.')+'</p>'+(next?'<button type="button" class="button" data-tph-open-circuit="'+esc(next.track)+'">Circuit guide ↗</button>':'')+'</div>';
    const stats='<div class="stats"><div class="stat"><span>Team points</span><strong>'+esc(state.overviewLoaded?num(points):'—')+'</strong><small>Across all divisions</small></div><div class="stat"><span>Current drivers</span><strong>'+data.roster.length+'</strong><small>On your roster</small></div>'+licenceSummaryButton()+'</div>';    const cards=state.overviewIssue?'<div class="notice" role="status">'+esc(state.overviewIssue)+' Use Refresh to retry.</div>':state.overviewLoading?'<div class="notice" role="status">Loading division standings…</div>':state.overviewLoaded?'<div class="tph-cards">'+data.standings.map(d=>'<article class="panel tph-card"><div class="tph-card-head"><span>DIVISION '+esc(d.division)+'</span><b>'+esc(d.team?'P'+d.team.position+' constructors':'Not entered')+'</b></div><div class="tph-standing-total"><strong>'+esc(d.team?num(d.team.points):'—')+'</strong><span>team points</span></div>'+(d.issue?'<p role="status" class="secondary-line">'+esc(d.issue)+'</p>':'')+'<h3 class="tph-current-heading">Current drivers</h3><ul class="tph-current-drivers">'+d.drivers.map(x=>'<li class="tph-current-driver"><span class="tph-driver-position">'+(x.position?'P'+esc(x.position):'—')+'</span><span class="tph-driver-name">'+esc(x.driver)+'<small>'+esc(x.tier||'')+(x.hasResult===false?' · No results yet':'')+'</small></span><b>'+num(x.points)+'<small>driver pts</small></b></li>').join('')+'</ul><details class="tph-contributions" data-tph-contributions="'+d.division+'"'+(contributionOpen.has(d.division)?' open':'')+'><summary>Points earned for '+esc(data.selectedTeam.team)+'</summary><div data-tph-contribution-body="'+d.division+'" aria-live="polite">'+contributionBody(d.division)+'</div></details></article>').join('')+'</div>':'<div class="notice">Open Overview to load current division standings.</div>';
    return hero+stats+'<div class="tph-section-heading"><h2>Your divisions</h2><span>Drivers & constructors</span></div>'+cards;
  }
  function contributionKey(division){return state.season+'|'+state.team+'|'+division;}
  function contributionBody(division){
    const entry=contributionCache.get(contributionKey(division));
    if(!entry||entry.loading)return '<p class="secondary-line">Loading team contributions…</p>';
    if(entry.error)return '<p role="status">'+esc(entry.error)+'</p><button type="button" class="button" data-tph-contribution-retry="'+division+'">Retry breakdown</button>';
    const data=entry.data;
    return '<ul class="tph-contribution-drivers">'+data.drivers.map(d=>'<li><span>'+esc(d.driver)+'<small>'+esc(d.current?'Current driver':'Former driver')+'</small></span><b>'+num(d.points)+' pts</b></li>').join('')+'</ul><p class="tph-contribution-total"><span>Earned for team</span><strong>'+num(data.total)+' pts</strong></p>'+(data.issue?'<p role="status" class="secondary-line">'+esc(data.issue)+'</p>':'')+'<p class="secondary-line">Includes sprint and feature points. Points stay with the team after a driver leaves.</p>';
  }
  function paintContributions(division){const body=document.querySelector('#tph-overview [data-tph-contribution-body="'+division+'"]');if(body)body.innerHTML=contributionBody(division);}
  function loadContributions(division,force){
    if(!state.data)return;const key=contributionKey(division),old=contributionCache.get(key);
    if(old&&(old.loading||!force)){paintContributions(division);return;}
    const epoch=contributionEpoch,season=state.season,team=state.team,entry={loading:true};contributionCache.set(key,entry);paintContributions(division);
    google.script.run.withSuccessHandler(data=>{
      if(epoch!==contributionEpoch||contributionCache.get(key)!==entry||data.season!==season||data.team!==team||Number(data.division)!==division)return;
      entry.loading=false;entry.data=data;paintContributions(division);
    }).withFailureHandler(error=>{
      if(epoch!==contributionEpoch||contributionCache.get(key)!==entry)return;
      entry.loading=false;entry.error=(error&&error.message)||'The team contribution breakdown could not load.';paintContributions(division);
    }).getTeamPrincipalHubContributions({season:season,team:team,division:division});
  }

  function ticketGroups(rows){const groups={};rows.forEach(row=>{const key='R'+row.round+' · '+row.track;(groups[key]||(groups[key]=[])).push(row);});return Object.keys(groups).sort((a,b)=>Number(b.match(/\d+/)[0])-Number(a.match(/\d+/)[0])).map(key=>'<details class="panel tph-panel"><summary class="tph-ticket-summary"><span>'+esc(key)+'</span><strong>'+groups[key].length+' ticket'+(groups[key].length===1?'':'s')+'</strong></summary>'+table(groups[key],['Division','Ticket','Submitted by','Against','Status'],x=>'<tr><td>D'+esc(x.division)+'</td><td><button type="button" class="button" data-tph-read-ticket="'+rows.indexOf(x)+'" aria-label="Read ticket '+esc(x.ticketNumber)+'">#'+esc(x.ticketNumber)+' · View</button></td><td>'+esc(x.submitter)+'</td><td>'+esc(x.offender)+'</td><td>'+esc(x.state)+'</td></tr>')+'</details>').join('')||'<p class="secondary-line">No processed tickets involving your team yet.</p>';}
  const marketSelection={query:'',division:'',tier:'',kind:'',sort:'division'};let marketFiltersOpen=null;
  function captureMarketFilters(){for(const key of Object.keys(marketSelection)){const field=el('tph-market-'+(key==='query'?'search':key));if(field)marketSelection[key]=field.value;}const details=el('tph-market-filter-details');if(details)marketFiltersOpen=details.open;}
  function restoreMarketFilters(){for(const key of Object.keys(marketSelection)){const field=el('tph-market-'+(key==='query'?'search':key));if(field)field.value=marketSelection[key];}}
  function filteredMarket(){const query=(el('tph-market-search')?.value||'').trim().toLowerCase();const all=state.data.market||[],division=el('tph-market-division')?.value||'',tier=el('tph-market-tier')?.value||'',kind=el('tph-market-kind')?.value||'',sort=el('tph-market-sort')?.value||'division';return all.filter(x=>(!query||[x.name,x.discord].join(' ').toLowerCase().includes(query))&&(!division||String(x.division)===division)&&(!tier||x.tier===tier)&&(!kind||x.availability===kind)).sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='tier'?a.tier.localeCompare(b.tier)||a.division-b.division:a.division-b.division||a.tier.localeCompare(b.tier)||a.name.localeCompare(b.name));}
  function renderMarketRows(){captureMarketFilters();const summary=el('tph-market-filter-summary'),count=['division','tier','kind'].filter(k=>marketSelection[k]).length;if(summary)summary.textContent='Filters & sort'+(count?' ('+count+')':'');const mount=el('tph-market-rows');if(mount)mount.innerHTML=table(filteredMarket(),['Driver','Discord','Division','Tier','Availability'],x=>'<tr><td><button type="button" class="tph-driver-link" data-tph-driver="'+state.data.market.indexOf(x)+'" aria-label="Season stats for '+esc(x.name)+'">'+esc(x.name)+'</button></td><td>'+esc(x.discord||'—')+'</td><td>D'+esc(x.division)+'</td><td>'+esc(x.tier)+'</td><td>'+esc(x.availability||'Not recorded')+'</td></tr>');}
  function evidenceLinks(links){return (links||[]).filter(Boolean).map((value,i)=>{const url=String(value).trim();return /^https?:\/\/[^\s]+$/i.test(url)?'<a class="button" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Evidence '+(i+1)+' ↗</a>':'<span class="secondary-line">'+esc(url)+'</span>';}).join(' ');}
  function ticketSection(title,text,links){return '<section class="tph-read-section"><h3>'+esc(title)+'</h3><p class="tph-read-copy">'+esc(text||'No written statement supplied.')+'</p><div class="tph-evidence-links">'+(evidenceLinks(links)||'<span class="secondary-line">No evidence links supplied.</span>')+'</div></section>';}
  function readTicket(index,pending){const ticket=(pending?state.data.pendingTickets:state.data.tickets)[index];if(!ticket)return;
    el('tph-read-title').textContent=pending?(ticket.type||'Submission')+' · awaiting processing':'Ticket #'+ticket.ticketNumber;
    el('tph-read-meta').textContent=(pending?'Received '+date(ticket.received):'R'+ticket.round+' · '+ticket.track)+' · Division '+ticket.division+(ticket.session?' · '+ticket.session:'');
    el('tph-read-body').innerHTML='<p><strong>'+esc(ticket.submitter)+'</strong> → <strong>'+esc(ticket.offender)+'</strong></p>'+ticketSection(pending?(ticket.type||'Submission'):'Original submission',ticket.description,ticket.evidence)+(!pending&&(ticket.defenceComments||(ticket.defenceEvidence||[]).some(Boolean))?ticketSection('Defence',ticket.defenceComments,ticket.defenceEvidence):'')+(!pending&&(String(ticket.appealed).toLowerCase()==='yes'||ticket.appealDescription||(ticket.appealEvidence||[]).some(Boolean))?ticketSection('Appeal',ticket.appealDescription,ticket.appealEvidence):'');
    el('tph-read-dialog').showModal();
  }
  let statsRequest=0;const statsCache=new Map();
  function statsValue(value){if(value===undefined||value===null||value==='')return '—';const text=String(value).trim(),percent=text.endsWith('%'),number=Number(percent?text.slice(0,-1):text);return Number.isFinite(number)?number.toLocaleString('en-GB',{maximumFractionDigits:2})+(percent?'%':''):esc(value);}
  function renderDriverStats(data){el('tph-driver-body').innerHTML=(data.issues||[]).map(t=>'<p role="status">'+esc(t)+'</p>').join('')+(data.divisions.length?data.divisions.map(d=>'<section class="tph-read-section"><h3>Division '+esc(d.division)+'</h3><div class="tph-driver-stats">'+[['Position',d.position?'P'+d.position:'—'],['Points',d.points],['Wins',d.wins],['Podiums',d.podiums],['Poles',d.poles],['Sprint wins',d.sprintWins],['Race starts',d.started],['Finishes',d.finished],['DNFs',d.dnf],['DNS',d.dns],['Disqualifications',d.dsq],['Average finish',d.averageFinish],['Average grid',d.averageGrid],['Average points',d.averagePoints],['Finish rate',d.reliability]].map(([label,value])=>'<div><span>'+esc(label)+'</span><strong>'+statsValue(value)+'</strong></div>').join('')+'</div></section>').join(''):'<p>No season statistics recorded yet.</p>')+'<p class="secondary-line">Wins, podiums and poles are feature-race statistics. Race starts and finishes include sprints. Each division keeps its own championship points.</p>';}
  function openDriverStats(index){const driver=state.data.market[index];if(!driver)return;const dialog=el('tph-driver-dialog'),request=++statsRequest,key=[state.season,state.team,driver.driverId,driver.division].join('|');
    el('tph-driver-title').textContent=driver.name;el('tph-driver-meta').textContent='Season '+state.season+' · D'+driver.division+' · '+driver.tier+' · '+driver.availability;el('tph-driver-body').textContent='Loading season statistics…';if(!dialog.open)dialog.showModal();
    if(!driver.driverId){el('tph-driver-body').textContent='This driver needs a Season Entrants profile link before statistics can be shown.';return;}
    const cached=statsCache.get(key);if(cached&&Date.now()-cached.at<60000){renderDriverStats(cached.data);return;}
    google.script.run.withSuccessHandler(data=>{if(request!==statsRequest||!dialog.open)return;if(!data.issues.length)statsCache.set(key,{at:Date.now(),data:data});renderDriverStats(data);}).withFailureHandler(error=>{if(request!==statsRequest||!dialog.open)return;el('tph-driver-body').innerHTML='<p role="status">'+esc(error&&error.message||'Statistics could not load.')+'</p><button type="button" class="button" data-tph-driver="'+index+'">Retry</button>';}).getTeamPrincipalHubDriverStats({season:state.season,team:state.team,driverId:driver.driverId,division:driver.division});
  }
  function referenceParagraph(text){return '<p class="tph-reference-copy">'+esc(text)+'</p>';}
  function referenceEdit(kind,entry){return state.library.canEdit?'<button class="button" type="button" data-tph-edit-reference="'+kind+'" data-reference-id="'+esc(entry.id)+'">Edit '+(kind==='circuits'?'circuit guide':'guide')+'</button>':'';}
  function renderCircuit(){
    const mount=el('tph-circuit-detail');if(!mount||!state.library)return;
    const entry=state.library.circuits.find(e=>e.id===state.circuitId)||state.library.circuits.find(e=>e.fields[0]===state.circuit)||state.library.circuits[0];if(!entry){mount.innerHTML='<p>No circuit guides have been added.</p>';return;}
    state.circuit=entry.fields[0];const f=entry.fields,file=f[3],validFile=/^[a-z0-9 _-]+\.(?:png|webp|svg)$/i.test(file||''),source=/^https:\/\/[^\s]+$/i.test(f[7]||'');
    mount.innerHTML='<article class="tph-circuit-card"><div>'+(validFile?'<img class="tph-circuit-map" src="https://f1xl.co.uk/images/tracks/'+encodeURIComponent(file)+'" alt="'+esc(f[0])+' circuit layout">':'')+'<p class="tph-reference-meta">'+esc(f[2])+'</p><h2>'+esc(f[1])+'</h2>'+referenceParagraph(f[4]||'Circuit information has not been added yet.')+'</div><div><h3>Driving focus</h3>'+referenceParagraph(f[5]||'Track-specific driving notes have not been added yet.')+'<h3>Team preparation</h3>'+referenceParagraph(f[6]||'Compare qualifying pace and race consistency; practise pit entry and exit, and agree a backup strategy.')+'<p class="tph-reference-meta">Preparation notes are advice; league rules and the in-game event settings take precedence.</p><div class="tph-reference-actions">'+(source?'<a class="button" href="'+esc(f[7])+'" target="_blank" rel="noopener noreferrer">Circuit source ↗</a>':'')+'<button class="button" type="button" data-league-rules>League rules</button>'+referenceEdit('circuits',entry)+'</div>'+(f[8]?'<p class="tph-reference-meta">Updated '+esc(f[8])+'</p>':'')+'</div></article>';
  }
  function renderLibrary(){
    const message=state.libraryLoading?'Loading reference library…':state.libraryIssue||'Open a reference tab to load the library.';
    if(!state.library){['circuits','handbook'].forEach(k=>el('tph-'+k).innerHTML='<div class="panel tph-panel" role="status">'+esc(message)+(state.libraryIssue?'<p><button type="button" class="button" data-tph-library-retry>Retry library</button></p>':'')+'</div>');return;}
    const entries=state.library.circuits.slice().sort((a,b)=>a.fields[0].localeCompare(b.fields[0])||a.fields[1].localeCompare(b.fields[1]));
    if(!entries.some(e=>e.fields[0]===state.circuit))state.circuit=(entries.find(e=>e.fields[0]===state.data.nextRound?.track)||entries[0])?.fields[0]||'';
    // Use permanent IDs to distinguish historical circuits sharing a location.
    if(!state.circuitId||!entries.some(e=>e.id===state.circuitId&&e.fields[0]===state.circuit))state.circuitId=entries.find(e=>e.fields[0]===state.circuit)?.id||'';
    el('tph-circuits').innerHTML='<div class="panel tph-panel"><div class="field tph-reference-selector"><label for="tph-circuit-select">Choose a circuit</label><select id="tph-circuit-select">'+entries.map(e=>'<option value="'+esc(e.id)+'"'+(e.id===state.circuitId?' selected':'')+'>'+esc(e.fields[0])+' · '+esc(e.fields[1])+'</option>').join('')+'</select></div><div id="tph-circuit-detail"></div></div>';renderCircuit();
    const opened=new Set(Array.from(document.querySelectorAll('[data-tph-handbook-entry][open]')).map(e=>e.dataset.tphHandbookEntry));
    el('tph-handbook').innerHTML='<div class="tph-section-heading"><h2>TP handbook</h2></div>'+state.library.handbook.map(e=>'<details class="panel tph-panel tph-handbook-entry" data-tph-handbook-entry="'+esc(e.id)+'"'+(opened.has(e.id)?' open':' ')+'><summary>'+esc(e.fields[0])+'</summary>'+referenceParagraph(e.fields[1])+'<div class="tph-reference-actions">'+(e.fields[2]==='rules'?'<button class="button" type="button" data-league-rules>League rules</button>':['tickets','market','overview','circuits'].includes(e.fields[2])?'<button class="button" type="button" data-tph-guide-area="'+esc(e.fields[2])+'">Open '+({tickets:'Tickets & licence',market:'Driver market',overview:'Overview',circuits:'Circuit guide'}[e.fields[2]])+'</button>':'')+referenceEdit('handbook',e)+'</div></details>').join('');
  }
  function loadLibrary(){
    if(state.library||state.libraryLoading||!state.data)return;state.libraryLoading=true;state.libraryIssue='';const request=++state.libraryRequest;renderLibrary();
    google.script.run.withSuccessHandler(data=>{if(request!==state.libraryRequest)return;state.libraryLoading=false;state.library=data;renderLibrary();}).withFailureHandler(e=>{if(request!==state.libraryRequest)return;state.libraryLoading=false;state.libraryIssue=e?.message||'The reference library could not load.';renderLibrary();}).getTeamPrincipalHubLibrary({season:state.season,team:state.team});
  }
  let libraryEdit=null;
  function openReferenceEditor(kind,id){
    if(!state.library?.canEdit)return;const entry=state.library[kind].find(e=>e.id===id);if(!entry)return;
    libraryEdit={kind,entry};let dialog=el('tph-library-edit-dialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='tph-library-edit-dialog';dialog.setAttribute('aria-labelledby','tph-library-edit-title');document.body.append(dialog);}
    const labels=kind==='circuits'?['Location','Circuit','Country','Layout filename','Circuit overview','Driving focus','Team preparation','Source URL']:['Title','Guide','Related area (overview, market, tickets, circuits or rules)'];
    dialog.innerHTML='<form id="tph-library-edit-form"><div class="toolbar"><h2 id="tph-library-edit-title">Edit '+esc(entry.fields[0])+'</h2><button class="button" type="button" data-tph-edit-close>Close</button></div>'+labels.map((label,i)=>'<label>'+esc(label)+((kind==='circuits'&&[4,5,6].includes(i))||(kind==='handbook'&&i===1)?'<textarea data-tph-reference-field="'+i+'" maxlength="5000">'+esc(entry.fields[i])+'</textarea>':'<input data-tph-reference-field="'+i+'" maxlength="5000" value="'+esc(entry.fields[i])+'">')+'</label>').join('')+'<p id="tph-library-edit-status" role="status"></p><button class="button" type="submit">Save guide</button></form>';dialog.showModal();
    dialog.querySelector('form').addEventListener('submit',event=>{
      event.preventDefault();const fields=entry.fields.slice();dialog.querySelectorAll('[data-tph-reference-field]').forEach(node=>fields[Number(node.dataset.tphReferenceField)]=node.value);const button=dialog.querySelector('[type=submit]');button.disabled=true;dialog.querySelector('[data-tph-edit-close]').disabled=true;el('tph-library-edit-status').textContent='Saving guide…';
      google.script.run.withSuccessHandler(result=>{state.library[kind]=state.library[kind].map(e=>e.id===result.entry.id?result.entry:e);libraryEdit=null;dialog.close();renderLibrary();}).withFailureHandler(e=>{button.disabled=false;dialog.querySelector('[data-tph-edit-close]').disabled=false;el('tph-library-edit-status').textContent=e?.message||'The guide could not be saved.';}).saveTeamPrincipalHubLibraryEntry({kind,id:entry.id,revision:entry.revision,fields});
    });
    dialog.oncancel=event=>{if(dialog.querySelector('[type=submit]').disabled)event.preventDefault();};
  }
  document.addEventListener('input',event=>{if(event.target.id==='tph-market-search')renderMarketRows();});
  document.addEventListener('click',event=>{
    if(event.target.closest('[data-tph-library-retry]'))loadLibrary();
    const edit=event.target.closest('[data-tph-edit-reference]');if(edit)openReferenceEditor(edit.dataset.tphEditReference,edit.dataset.referenceId);
    if(event.target.closest('[data-tph-edit-close]')){el('tph-library-edit-dialog').close();libraryEdit=null;}
    const area=event.target.closest('[data-tph-guide-area]');if(area)document.querySelector('[data-tph-tab="'+area.dataset.tphGuideArea+'"]').click();
  });

  function submitTicket(event){event.preventDefault();const button=el('tph-ticket-submit');button.disabled=true;el('tph-ticket-message').textContent='Submitting…';google.script.run.withSuccessHandler(result=>{button.disabled=false;el('tph-ticket-message').textContent=result.message;setTimeout(()=>el('tph-ticket-dialog').close(),500);refreshTickets(true);}).withFailureHandler(error=>{button.disabled=false;el('tph-ticket-message').textContent=(error&&error.message)||'Ticket could not be submitted.';}).submitTeamPrincipalHubTicket({season:state.season,team:state.team,division:Number(el('tph-ticket-division').value),fromDriver:el('tph-ticket-from').value,againstDriver:el('tph-ticket-against').value,description:el('tph-ticket-description').value,evidence1:el('tph-ticket-evidence-1').value,evidence2:el('tph-ticket-evidence-2').value,evidence3:el('tph-ticket-evidence-3').value,evidence4:el('tph-ticket-evidence-4').value});}
  function resetDeferred(){state.inboxRequest++;state.ticketBusy=false;state.inboxChecked=false;state.inboxIssue='';state.licenceRequest++;state.licencesLoading=false;state.licenceIssue='';state.licenceDivision='';state.libraryRequest++;state.library=null;state.libraryLoading=false;state.libraryIssue='';contributionEpoch++;contributionCache.clear();contributionOpen.clear();statsCache.clear();statsRequest++;['tph-driver-dialog','tph-read-dialog'].forEach(id=>{if(el(id).open)el(id).close();});state.overviewLoaded=false;state.overviewLoading=false;state.marketLoaded=false;state.marketLoading=false;state.ticketsLoaded=false;state.ticketsLoading=false;state.ticketIssue='';state.licencesChecked=false;state.overviewIssue='';state.marketIssue='';}
  function load(force){if(state.busy)return;state.busy=true;el('tph-status').textContent='Loading team information…';const run=google.script.run.withSuccessHandler(data=>{state.busy=false;state.data=data;state.season=data.season;state.team=data.selectedTeam.team;resetDeferred();el('tph-status').textContent='';render();if(state.tab==='overview'){loadOverview(false);loadLicences();}if(state.tab==='tickets'){loadLicences();if(state.ticketPanel==='tickets'){refreshTickets(true);loadWeeklyTickets(false);}}if(state.tab==='market')loadMarket(false);if(['circuits','handbook'].includes(state.tab))loadLibrary();}).withFailureHandler(error=>{state.busy=false;el('tph-status').textContent=(error&&error.message)||'Team Principal Hub could not load.';});if(state.season)run.getTeamPrincipalHub({season:state.season,team:state.team,force:!!force});else run.getTeamPrincipalHubInitial();}

  function licenceNumber(value){return value===null||value===undefined||value===''?'—':Number.isFinite(Number(value))?Number(value).toLocaleString('en-GB',{maximumFractionDigits:2}):'Unavailable';}
  function licenceSummaryButton(){return '<button type="button" class="stat tph-licence-link" data-tph-open-licences><span>Outstanding bans</span><strong>'+esc(state.licencesChecked?num(state.data.bans.length):'—')+'</strong><small>'+(state.licenceIssue?'Could not check · Open to retry':state.licencesChecked?'Current drivers · View licences & bans':'Checking current drivers…')+'</small></button>';}
  function banCard(b){return '<article class="tph-action-card"><div class="tph-action-heading"><strong>'+esc(b.driver)+'</strong><span>D'+esc(b.division)+'</span></div><h4>'+esc(b.type)+'</h4><p class="tph-ban-restriction">'+esc(b.restriction)+'</p><dl><dt>When</dt><dd>'+esc(b.scheduled||(b.kind==='season'?'Rest of this season':'Round not assigned — ask an admin to confirm'))+'</dd><dt>Status</dt><dd>Outstanding · not marked served</dd>'+(b.incurred?'<dt>Issued</dt><dd>'+esc(b.incurred)+'</dd>':'')+'</dl>'+(b.reason?'<p>'+esc(b.reason)+'</p>':'')+'</article>';}

  function renderLicencePanel(){

    const data=state.data,bans=data.bans||[],carry=data.carryovers||[],licences=(data.licences||[]).filter(d=>!state.licenceDivision||String(d.division)===state.licenceDivision),divisions=Array.from(new Set(data.licences.map(d=>d.division))).sort((a,b)=>a-b);

    const carrySection='<section class="panel tph-panel"><div class="tph-section-heading"><h2>Carried time penalties</h2><span>'+carry.length+' pending</span></div>'+(carry.length?'<div class="tph-action-grid">'+carry.map(carryCard).join('')+'</div>':'<p>No carried time penalties awaiting application.</p>')+'</section>';
    const cards=licences.map(d=>'<article class="panel tph-licence-driver"><header><div><span class="tph-reference-meta">DIVISION '+esc(d.division)+' · '+esc(d.tier)+'</span><h3>'+esc(d.driver)+'</h3></div><div class="tph-licence-points"><strong>'+licenceNumber(d.points)+'</strong><span>licence points</span></div></header>'+(d.ready?'':'<p role="status">Current licence record needs an admin check.</p>')+'<p class="tph-reference-meta">'+bans.filter(b=>b.driver===d.driver).length+' outstanding bans · '+carry.filter(r=>r.driver===d.driver).length+' carried penalties</p><details class="tph-licence-history" data-tph-licence-history="'+esc(d.division+'|'+d.driver)+'"><summary>Licence record & served bans</summary><p>Recorded time penalties in D'+esc(d.division)+': '+licenceNumber(d.seconds)+' seconds total.</p><p class="tph-reference-meta">This recorded total is separate from time penalties still waiting to be applied.</p>'+(d.previousDivisions.length?'<h4>Earlier division records</h4>'+d.previousDivisions.map(r=>'<p>D'+esc(r.division)+' · '+licenceNumber(r.points)+' licence points · '+licenceNumber(r.seconds)+' seconds recorded</p>').join(''):'')+(d.servedBans.length?'<h4>Served bans</h4>'+d.servedBans.map(b=>'<p>'+esc(b.type)+' · '+esc(b.scheduled||'Round not recorded')+' · Served</p>').join(''):'<p>No served bans recorded.</p>')+'</details></article>').join('');

  function paintLicenceState(){const box=document.querySelector('[data-tph-open-licences]');if(box)box.outerHTML=licenceSummaryButton();renderLicencePanel();}
  function loadLicences(force){

    google.script.run.withSuccessHandler(data=>{if(request!==state.licenceRequest||season!==state.season||team!==state.team)return;state.licencesLoading=false;state.licencesChecked=true;state.data.licences=data.licences||[];state.data.bans=data.bans||[];state.data.carryovers=data.carryovers||[];state.data.reviews=data.reviews||[];paintLicenceState();}).withFailureHandler(error=>{if(request!==state.licenceRequest)return;state.licencesLoading=false;state.licenceIssue=error?.message||'Licence information could not be checked.';paintLicenceState();}).getTeamPrincipalHubLicences({season,team});

  function renderTicketPanels(){

  function loadWeeklyTickets(force){if(!state.data||state.ticketsLoading||(state.ticketsLoaded&&!force))return;state.ticketsLoading=true;render();google.script.run.withSuccessHandler(data=>{if(!state.data||data.season!==state.season||data.team!==state.team)return;state.ticketsLoading=false;state.ticketsLoaded=true;state.ticketIssue=data.issue||'';state.data.tickets=data.tickets||[];if(state.tab==='tickets'&&state.ticketPanel==='tickets')render();}).withFailureHandler(error=>{state.ticketsLoading=false;state.ticketsLoaded=true;state.ticketIssue=(error&&error.message)||'Weekly ticket view could not load.';if(state.tab==='tickets'&&state.ticketPanel==='tickets')render();}).getTeamPrincipalHubWeeklyTickets({season:state.season,team:state.team,force:!!force});}
  function ticketPollingActive(){return !!(state.data&&state.tab==='tickets'&&state.ticketPanel==='tickets'&&!document.hidden&&!el('view-team-principal-hub').hidden&&!el('tph-team-content').hidden);}
  function renderTicketInbox(){
    const mount=el('tph-ticket-inbox'),pending=(state.data&&state.data.pendingTickets)||[];if(!mount)return;
    const signature=JSON.stringify([pending,state.inboxChecked,state.inboxIssue,state.ticketBusy]);if(mount.dataset.signature===signature)return;mount.dataset.signature=signature;

    const rows=pending.length?'<div class="notice"><strong>'+pending.length+' new submission'+(pending.length===1?'':'s')+'</strong> involving this team '+(pending.length===1?'is':'are')+' awaiting steward processing.</div>'+table(pending,['Division','Type','Submitted by','Against','Details'],x=>'<tr><td>D'+esc(x.division)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.submitter)+'</td><td>'+esc(x.offender)+'</td><td><button type="button" class="button" data-tph-read-pending="'+pending.indexOf(x)+'">View submission</button></td></tr>'):state.inboxChecked&&!state.inboxIssue?'<p class="secondary-line">No new submissions awaiting processing for this team.</p>':'';

  function refreshTickets(force){
    if(state.ticketBusy||!state.data||!ticketPollingActive()&&!force)return;state.ticketBusy=true;const request=++state.inboxRequest,season=state.season,team=state.team;renderTicketInbox();

  function open(season){window.F1XLPrincipalArea?.select('teams',false);state.season=String(season||'');state.team='';state.race='';resetDeferred();window.F1XLNavigate('team-principal-hub');load(false);}

  document.addEventListener('toggle',event=>{const details=event.target;if(!details.matches?.('details[data-tph-contributions]')||!details.isConnected)return;const division=Number(details.dataset.tphContributions);if(details.open){contributionOpen.add(division);loadContributions(division,false);}else contributionOpen.delete(division);},true);
  document.addEventListener('click',event=>{const retry=event.target.closest('[data-tph-contribution-retry]');if(retry)loadContributions(Number(retry.dataset.tphContributionRetry),true);});
  const tabs=Array.from(tabList.querySelectorAll('[data-tph-tab]'));tabs.forEach(button=>{const name=button.dataset.tphTab;button.id='tph-tab-'+name;button.setAttribute('role','tab');button.setAttribute('aria-controls','tph-'+name);const panel=el('tph-'+name);panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby',button.id);});
