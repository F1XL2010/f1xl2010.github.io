<script>
window.F1XLPreseasonHub=(function() {
  if(window.F1XLNavigation)window.F1XLNavigation.register('preseason-hub',()=>false,()=> ({season:state.selected}));
  const state={hubs:[],selected:'',loading:false,generation:0,expanded:{}};
  const stages=[['Season dates','Race dates, application deadlines, draft and social Sundays.','Dates saved'],['Applications & tracker','Import the previous roster, track replies, then process applications into time trials.','Available'],['Time trials','Book processed applicants, save results and mark completed trials.','Available'],['Track draw','Prepare the eligible pool, random track order and sprint rounds privately.','Available'],['Team principals','Accept candidates for voting, save votes, then appoint principals to teams.','Available'],['Placement','Use the meeting to agree divisions, tiers and reserves, then Confirm placements.','Available'],['Draft','Use Live draft for principal picks. Before finishing each division, place every unpicked driver into a free-agent team or reserves, then select Finish division.','Available'],['Create division workbooks','For every finished division: create its workbook, check the copied roster, then approve both Google Sheets connections. This prepares the division; it does not publish the season.','Available'],['Season launch','When every division is prepared, check readiness, launch to the website and open the active-season hub.','Available']];
  function el(id){return document.getElementById(id);}
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function label(season){const hub=state.hubs.find(function(h){return h.season===season;});return 'S'+season+(hub&&hub.active?' Active season':' Pre-season');}
  function current(){return state.hubs.find(function(hub){return hub.season===state.selected;});}
  function date(value){return new Date(value+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});}
  function longDate(value){return new Date(value+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});}
  function datesText(hub){
    const p=hub.plan,d=p.dates||{},times=p.times||{};
    const events=[['Applications open',p.opens,''],['Track & Team Principal announcement',d.announce,times.announce],['Applications close',d.apps,times.apps],['Time trials close',d.tt,times.tt],['Draft',d.draft,times.draft]];
    (p.socials||[]).forEach(value=>events.push(['Social race',value,'']));
    const rows=events.filter(e=>e[1]&&e[1]<=p.start).sort((a,b)=>a[1].localeCompare(b[1])||String(a[2]||'').localeCompare(String(b[2]||'')));
    rows.push(['Season Opening Race',p.start,'']);
    return rows.map(e=>e[0]+', '+longDate(e[1])).join('\n');
  }
  function openDatesDialog(){const hub=current();if(!hub||hub.active)return;el('preseason-dates-dialog-title').textContent='S'+hub.season+' season dates';el('preseason-dates-text').value=datesText(hub);el('preseason-dates-copy-status').textContent='';el('preseason-dates-dialog').showModal();}
  const preLinks=[['dates','Season dates','season-planning'],['intake','Applications & tracker','preseason-intake'],['tt','Time trials','preseason-time-trials'],['social-races','Social races','preseason-social-races'],['track-draw','Track draw','preseason-track-draw'],['principals','Team principals','preseason-principals'],['placement','Placement','preseason-placement'],['draft','Draft order','preseason-draft'],['live-draft','Live draft','preseason-live-draft'],['allocations','Roster corrections','preseason-allocations'],['preparation','Create division workbooks','preseason-preparation'],['launch','Season launch','season-launch']];
  const activeLinks=[['results','Results','results-entry'],['intake','Applications & tracker','preseason-intake'],['trials','Time trials','preseason-time-trials'],['placement','Driver placement & movements','active-operations'],['calendar','Race calendar','active-operations'],['tickets','Tickets','ticket-processing'],['licences','Licences & bans','licence'],['asr','All Star Race','active-asr']];
  function renderMenu(){
    const nav=el('preseason-nav');nav.hidden=!state.hubs.length;
    nav.innerHTML=state.hubs.map(function(hub){
      const season=esc(hub.season),id='season-links-'+season.replace('.','-'),expanded=state.expanded[hub.season]??hub.season===state.selected;
      const heading=hub.active?'data-test-season-open':'data-preseason-open';
      const links=(hub.active?activeLinks:preLinks).map(function(link){const action=hub.active?'data-season-area="'+link[0]+'" data-season="'+season+'"':'data-preseason-'+link[0]+'="'+season+'"';return '<button class="nav-button" type="button" '+action+' data-sidebar-season="'+season+'" data-sidebar-view="'+link[2]+'"'+(link[2]==='active-operations'?' data-sidebar-area="'+link[0]+'"':'')+'>'+esc(link[1])+'</button>';}).join('');
      return '<div class="preseason-nav-group"><div class="preseason-nav-head"><button class="nav-button" type="button" '+heading+'="'+season+'" data-sidebar-season="'+season+'" data-sidebar-view="'+(hub.active?'season-launch':'preseason-hub')+'">'+esc(label(hub.season))+'</button><button class="preseason-nav-toggle" type="button" data-preseason-toggle="'+id+'" data-toggle-season="'+season+'" aria-controls="'+id+'" aria-expanded="'+expanded+'" aria-label="Toggle areas for '+esc(label(hub.season))+'">▾</button></div><div class="preseason-nav-links" id="'+id+'"'+(expanded?'':' hidden')+'>'+links+'</div></div>';
    }).join('');window.F1XLNavigation?.paint();paintAttention();
  }
  function renderHub(){
    const hub=current();el('preseason-hub-content').hidden=!hub;el('preseason-hub-master').hidden=!hub;el('preseason-hub-dates').disabled=!hub||!!(hub&&hub.active);el('preseason-hub-title').textContent=hub?label(hub.season):'Pre-season';
    if(!hub||hub.active){el('preseason-hub-status').textContent='No active preseason selected. Use Start new season, or choose a preseason from the menu.';return;}
    el('preseason-hub-master').href=hub.url;el('preseason-hub-status').textContent='';
    const p=hub.plan,facts=[['Opening race',date(p.start)],['Rounds',p.count],['Applications open',date(p.opens)],['Draft',date(p.dates.draft)]];el('preseason-hub-summary').innerHTML=facts.map(function(fact){return '<div><dt>'+esc(fact[0])+'</dt><dd>'+esc(fact[1])+'</dd></div>';}).join('');
    const actions=['dates','intake','tt','track-draw','principals','placement','draft','preparation','launch'];el('preseason-hub-stages').innerHTML=stages.map(function(stage,i){const action=actions[i],extra=action==='draft'?' <button class="button" type="button" data-preseason-live-draft="'+esc(hub.season)+'">Open live draft</button> <button class="button secondary" type="button" data-preseason-allocations="'+esc(hub.season)+'">Roster corrections</button>':action==='preparation'?' <button class="button secondary" type="button" data-preseason-allocations="'+esc(hub.season)+'">Correct a roster</button>':'';return '<article class="panel preseason-card portal-stage-card portal-stage-'+esc(action)+'"><span class="secondary-line">Stage '+(i+1)+'</span><h2>'+esc(stage[0])+'</h2><span class="status '+(i===0?'complete':'')+'">'+esc(stage[2])+'</span><p class="secondary-line">'+esc(stage[1])+'</p>'+(action?'<button class="button" type="button" data-preseason-'+action+'="'+esc(hub.season)+'">Open '+esc(stage[0].toLowerCase())+'</button>':'')+extra+'</article>';}).join('');
    const socials=(p.socials||[]);el('preseason-hub-extras').innerHTML=socials.length?'<article class="panel preseason-card portal-stage-card portal-stage-social-races"><span class="secondary-line">Optional pre-season event</span><h2>Social races</h2><span class="status">'+socials.length+' planned</span><p class="secondary-line">Paste Discord entrants, draw lobbies and save results for the placement meeting.</p><button class="button" type="button" data-preseason-social-races="'+esc(hub.season)+'">Open social races</button></article>':'';
  }
  function open(season){if(!state.hubs.some(function(hub){return hub.season===season;})){load();return;}state.selected=season;state.expanded[season]=true;renderMenu();if(state.hubs.some(function(h){return h.season===season&&h.active;})){window.F1XLSeasonLaunch.open(season);return;}window.F1XLNavigate('preseason-hub');renderMenu();renderHub();window.F1XLStaffAttention?.paint();window.F1XLStaffAttention?.refresh();}
  function finish(){state.loading=false;['preseason-menu-refresh','preseason-hub-refresh'].forEach(function(id){el(id).disabled=false;});}
  function load(force){
    if(state.loading||!window.google||!google.script||!google.script.run)return;state.loading=true;const generation=++state.generation;el('preseason-menu-status').textContent='Checking for started seasons…';['preseason-menu-refresh','preseason-hub-refresh'].forEach(function(id){el(id).disabled=true;});
    google.script.run.withSuccessHandler(function(response){if(generation!==state.generation)return;finish();state.hubs=response.hubs||[];if(window.F1XLPostseason)window.F1XLPostseason.setHubs(response.postseasonHubs||[]);if(!current())state.selected='';renderMenu();renderHub();checkAttention();const warning=(response.unavailable||[]).length?' Could not check Season '+response.unavailable.join(', ')+'. Check its connection and refresh.':'';el('preseason-menu-status').textContent=(state.hubs.length?'Started seasons are available in the menu.':'No season has been started.')+warning;if(warning)el('preseason-hub-status').textContent+=warning;window.F1XLNavigation?.startup(state.hubs,response.unavailable||[],false,response.postseasonHubs||[]);}).withFailureHandler(function(error){if(generation!==state.generation)return;finish();const message='Preseason menu could not be refreshed. '+(error.message||'Try again.');el('preseason-menu-status').textContent=message;el('preseason-hub-status').textContent=message;window.F1XLNavigation?.startup([],[],true);}).getPreseasonHubs({navigationOnly:true,forceRefresh:force===true});
  }
  function saved(response){state.generation++;finish();const hub={season:response.plan.season,url:response.url,plan:response.plan};state.hubs=state.hubs.filter(function(item){return item.season!==hub.season;});state.hubs.push(hub);state.hubs.sort(function(a,b){return Number(b.season)-Number(a.season);});state.selected=hub.season;renderMenu();renderHub();el('preseason-menu-status').textContent='Started seasons are available in the menu.';}
  document.addEventListener('click',function(event){
    const hub=event.target.closest('[data-preseason-open]'),dates=event.target.closest('[data-preseason-dates]'),toggle=event.target.closest('[data-preseason-toggle]');const nav=event.target.closest('[data-nav-to]');if(nav)window.F1XLNavigate(nav.dataset.navTo);
    const area=event.target.closest('[data-season-area]');if(area){state.selected=area.dataset.season;window.F1XLSeasonLaunch.openArea(area.dataset.season,area.dataset.seasonArea);}const launch=event.target.closest('[data-preseason-launch],[data-test-season-open]');if(launch){state.selected=launch.dataset.preseasonLaunch||launch.dataset.testSeasonOpen;window.F1XLSeasonLaunch.open(state.selected);}const preparation=event.target.closest('[data-preseason-preparation]');if(preparation)window.F1XLPreseasonPreparation.open(preparation.dataset.preseasonPreparation);const allocations=event.target.closest('[data-preseason-allocations]');if(allocations)window.F1XLPreseasonAllocations.open(allocations.dataset.preseasonAllocations);const liveDraft=event.target.closest('[data-preseason-live-draft]');if(liveDraft)window.F1XLPreseasonLiveDraft.open(liveDraft.dataset.preseasonLiveDraft);const draft=event.target.closest('[data-preseason-draft]');if(draft)window.F1XLPreseasonDraft.open(draft.dataset.preseasonDraft);const placement=event.target.closest('[data-preseason-placement]');if(placement)window.F1XLPreseasonPlacement.open(placement.dataset.preseasonPlacement);const tracks=event.target.closest('[data-preseason-track-draw]');if(tracks)window.F1XLPreseasonTrackDraw.open(tracks.dataset.preseasonTrackDraw);const principals=event.target.closest('[data-preseason-principals]');if(principals)window.F1XLPreseasonPrincipals.open(principals.dataset.preseasonPrincipals);const tt=event.target.closest('[data-preseason-tt]');if(tt)window.F1XLPreseasonTimeTrials.open(tt.dataset.preseasonTt);const social=event.target.closest('[data-preseason-social-races]');if(social)window.F1XLPreseasonSocialRaces.open(social.dataset.preseasonSocialRaces);const intake=event.target.closest('[data-preseason-intake]');if(intake)window.F1XLPreseasonIntake.open(intake.dataset.preseasonIntake);if(hub)open(hub.dataset.preseasonOpen);else if(dates)window.F1XLSeasonPlanning.openSeason(dates.dataset.preseasonDates);else if(toggle){const links=el(toggle.dataset.preseasonToggle);links.hidden=!links.hidden;state.expanded[toggle.dataset.toggleSeason]=!links.hidden;toggle.setAttribute('aria-expanded',String(!links.hidden));}
  });
  el('sidebar-retry').addEventListener('click',()=>load(true));el('preseason-menu-refresh').addEventListener('click',()=>load(true));el('preseason-hub-refresh').addEventListener('click',()=>load(true));
  el('preseason-hub-dates').addEventListener('click',openDatesDialog);el('preseason-dates-close').addEventListener('click',function(){el('preseason-dates-dialog').close();});
  el('preseason-dates-copy').addEventListener('click',async function(){const text=el('preseason-dates-text').value;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{el('preseason-dates-text').select();if(!document.execCommand('copy'))throw new Error('Copy failed');}el('preseason-dates-copy-status').textContent='Copied.';}catch(error){el('preseason-dates-copy-status').textContent='Select the text and copy it manually.';}});
  let attentionBusy=false,attention={},attentionAgain=false,attentionAt=0,attentionSignature='';
  function paintAttention(){document.querySelectorAll('[data-preseason-intake],[data-preseason-open],[data-test-season-open],[data-active-area="intake"],[data-season-area="intake"]').forEach(function(b){const season=b.dataset.season||b.dataset.preseasonIntake||b.dataset.preseasonOpen||b.dataset.testSeasonOpen||el('view-season-launch').dataset.season,item=attention[season];let badge=b.querySelector('.application-attention');if(!item){if(badge)badge.remove();return;}if(!badge){badge=document.createElement('span');badge.className='application-attention';b.appendChild(badge);}badge.textContent=item.available?(item.count?' · '+item.count+' new':''):' · unavailable';badge.setAttribute('aria-label',item.available?item.count+' unprocessed applications':'Application count unavailable');badge.title=item.available?'':(item.error||'Open Applications & tracker to check the source.');badge.hidden=item.available&&!item.count;});}
  function checkAttention(force){force=force===true;if(document.hidden||!state.hubs.length||!window.google||(window.F1XLAccess&&!window.F1XLAccess.can('applications')))return;
    const seasons=state.hubs.map(h=>h.season),signature=seasons.join(',');if(attentionBusy){attentionAgain=attentionAgain||force||signature!==attentionSignature;return;}
    if(!force&&signature===attentionSignature&&Date.now()-attentionAt<40000)return;
    attentionBusy=true;attentionAt=Date.now();attentionSignature=signature;
    const run=()=>{if(document.hidden||!window.F1XLAccess?.can('applications'))return Promise.resolve();return new Promise(resolve=>{
      google.script.run.withSuccessHandler(r=>{if(attentionSignature===signature){attention=r;paintAttention();}resolve();}).withFailureHandler(error=>{if(attentionSignature===signature){seasons.forEach(season=>attention[season]={available:false,error:error.message});paintAttention();}resolve();}).getApplicationAttention(seasons,force);
    });};
    const request=window.F1XLBackground?window.F1XLBackground.request('driver-attention',run):run();request.finally(()=>{attentionBusy=false;if(attentionAgain){attentionAgain=false;checkAttention(true);}});
  }
  setInterval(checkAttention,45000);document.addEventListener('visibilitychange',function(){if(!document.hidden)checkAttention();});load();return {open:open,saved:saved,load:load,checkAttention:()=>checkAttention(true),paintAttention:paintAttention};
})();
</script>
