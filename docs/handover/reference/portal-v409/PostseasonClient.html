<script>
window.F1XLPostseason=(function(){
  const state={hubs:[],season:'',data:null,busy:false,saving:false};
  const el=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rpc=(name,input)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](input));
  if(window.F1XLNavigation)window.F1XLNavigation.register('postseason',()=>state.saving,()=>({season:state.season}));
  function setHubs(hubs){state.hubs=hubs||[];const nav=el('postseason-nav');nav.hidden=!state.hubs.length;nav.innerHTML=state.hubs.map(h=>'<button class="nav-button" type="button" data-postseason-open="'+esc(h.season)+'" data-sidebar-view="postseason" data-sidebar-season="'+esc(h.season)+'">S'+esc(h.season)+' Post-season</button>').join('');window.F1XLNavigation?.paint();}
  function status(s){el('postseason-status').textContent=s;}
  function render(){const d=state.data;el('postseason-content').hidden=!d;if(!d)return;const active=d.stage==='Active';el('postseason-title').textContent='S'+d.season+(active?' End season':' Post-season');el('postseason-pill').textContent=active?'END SEASON':'POST-SEASON';el('postseason-master').href=d.url;el('postseason-open-active').hidden=!active;el('postseason-website').href=d.snapshot.website;el('postseason-website').hidden=!d.snapshot.website;status(d.message);
    el('postseason-summary').innerHTML=[['Rounds',d.resultsReady?'Final':'Still to finish'],['Website Config',d.websiteConfig.archived?'Past season':d.websiteConfig.ok?'Ready to archive':'Needs attention'],['Career Stats',d.career.ok?'Committed & verified':'Needs attention'],['Accolades',d.accolades.alreadyFinalised?'Finalised':'Needs finalising']].map(x=>'<div><dt>'+x[0]+'</dt><dd>'+x[1]+'</dd></div>').join('');
    el('postseason-rounds').innerHTML=d.rounds.map(r=>'<tr><td>R'+r.round+'</td><td>'+esc(r.track||'—')+'</td><td>'+esc(r.status)+'</td><td>'+r.progress.map((p,i)=>'D'+(i+1)+' '+esc(p)).join(' · ')+'</td><td>'+ (r.final?'Ready':'Needs attention')+'</td></tr>').join('');
    el('postseason-career').textContent=d.career.message||'';el('postseason-prepare-career').hidden=!active;el('postseason-career-link').hidden=!d.career.importUrl;el('postseason-career-link').href=d.career.importUrl||'#';
    el('postseason-website-config').textContent=d.websiteConfig.message||'';el('postseason-config-link').hidden=!d.websiteConfig.url;el('postseason-config-link').href=d.websiteConfig.url||'#';
    el('postseason-accolades').textContent=d.accolades.message||'';el('postseason-finalise-accolades').hidden=!active||d.accolades.alreadyFinalised;el('postseason-close-panel').hidden=!active;
    if(!active)el('postseason-close-summary').textContent='Closed '+new Date(d.closure.closedAt).toLocaleString('en-GB')+'. Operational writes are now blocked in the FAP. The public website was deliberately left unchanged.';
  }
  function renderRehearsal(r){const panel=el('postseason-rehearsal-report');panel.hidden=false;el('postseason-rehearsal-status').textContent=r.message;const career=r.career?('Career Stats: '+r.career.matched+' linked, '+r.career.unmatched+' unresolved.'):'Career Stats preview could not run.';const accolades=r.accolades?('Accolades: '+r.accolades.records+' record(s) proposed.'+(r.accolades.warnings.length?' '+r.accolades.warnings.length+' warning(s).':'')):'Accolades preview could not run.';el('postseason-rehearsal-checks').innerHTML=[['Results',r.results.ready?'All scheduled rounds final':'Still in progress'],['Career Stats',career],['Accolades',accolades],['Website transition',r.website&&r.website.ready?'Ready to simulate':'Needs attention']].map(x=>'<li><strong>'+esc(x[0])+':</strong> '+esc(x[1])+'</li>').join('');el('postseason-rehearsal-changes').innerHTML=r.proposedChanges.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td></tr>').join('');el('postseason-rehearsal-issues').innerHTML=r.issues.length?'<h3>Things to resolve before a real closure</h3><ul>'+r.issues.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p>No automatic blockers were found. The manual ticket, licence and final-site checks would still remain.</p>';}
  async function open(season){if(state.busy)return;state.season=String(season);window.F1XLNavigate('postseason');state.busy=true;status('Checking end-of-season status…');try{state.data=await rpc('getPostseasonOverview',{season:state.season});state.busy=false;render();}catch(e){state.busy=false;status(e.message||String(e));}}
  function openEnd(season){open(season);}
  async function prepareCareer(){if(!state.data)return;state.busy=true;state.saving=true;status('Committing final Career Stats to the permanent driver database…');try{const r=await rpc('preparePostseasonCareerStats',{season:state.season});state.busy=false;state.saving=false;if(r.importUrl){el('postseason-career-link').href=r.importUrl;el('postseason-career-link').hidden=false;}await open(state.season);}catch(e){state.busy=false;state.saving=false;status(e.message||String(e));}}
  async function finalise(){if(!state.data)return;const phrase='FINALISE SEASON '+state.season+' ACCOLADES';if(window.prompt('Type '+phrase+' to finalise permanent accolades.')!==phrase)return;state.busy=true;state.saving=true;status('Finalising accolades…');try{await rpc('finalisePostseasonAccolades',{season:state.season,revision:state.data.accolades.revision,confirmation:phrase});state.busy=false;state.saving=false;await open(state.season);}catch(e){state.busy=false;state.saving=false;status(e.message||String(e));}}
  async function rehearse(){if(!state.data||state.busy)return;state.busy=true;status('Running a read-only closure rehearsal…');try{const r=await rpc('getPostseasonClosureRehearsal',{season:state.season});state.busy=false;renderRehearsal(r);status(r.message);}catch(e){state.busy=false;status(e.message||String(e));}}
  async function close(){if(!state.data)return;const phrase='CLOSE SEASON '+state.season;state.busy=true;state.saving=true;status('Closing the season…');try{state.data=await rpc('closeTestSeason',{season:state.season,revision:state.data.revision,ticketsChecked:el('postseason-tickets').checked,licencesChecked:el('postseason-licences').checked,snapshotChecked:el('postseason-snapshot').checked,confirmation:el('postseason-confirm').value});state.busy=false;state.saving=false;setHubs(state.hubs.concat([{season:state.season,url:state.data.url,closedAt:state.data.closure.closedAt}]));render();window.F1XLPreseasonHub.load();}catch(e){state.busy=false;state.saving=false;status(e.message||String(e));}}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-postseason-open]');if(b)open(b.dataset.postseasonOpen);});
  el('postseason-refresh').addEventListener('click',()=>open(state.season));el('postseason-open-active').addEventListener('click',()=>window.F1XLSeasonLaunch.open(state.season));el('postseason-rehearse').addEventListener('click',rehearse);el('postseason-prepare-career').addEventListener('click',prepareCareer);el('postseason-finalise-accolades').addEventListener('click',finalise);el('postseason-close').addEventListener('click',close);
  return {setHubs:setHubs,open:open,openEnd:openEnd};
})();
</script>
