<script>
window.F1XLPreseasonSocialRaces=(function(){
  if(window.F1XLNavigation)window.F1XLNavigation.register('preseason-social-races',()=>false,()=>({season:state.season}));
  const state={season:'',data:null,eventId:'',busy:false};
  const el=id=>document.getElementById(id);
  const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const date=value=>new Date(value+'T00:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
  function current(){return state.data&&state.data.events.find(event=>event.id===state.eventId);}
  function status(message,error){el('social-status').textContent=message;el('social-status').classList.toggle('error',!!error);}
  function busy(value){state.busy=value;el('social-fields').disabled=value;['social-back','social-refresh'].forEach(id=>el(id).disabled=value);}
  function rpc(name,input){if(state.busy)return;busy(true);status(/^(get)/.test(name)?'Loading social races…':'Saving social races…');google.script.run.withSuccessHandler(data=>{state.data=data;state.eventId=data.events.some(event=>event.id===state.eventId)?state.eventId:(data.events[0]||{}).id||'';busy(false);render();status(data.message||'Social races ready.');}).withFailureHandler(error=>{busy(false);status(error.message||'Unable to update social races.',true);})[name](input);}
  function open(season){if(state.busy)return;state.season=String(season);state.data=null;state.eventId='';window.F1XLNavigate('preseason-social-races');el('social-title').textContent='S'+season+' Social races';rpc('getPreseasonSocialRaces',state.season);}
  function render(){const data=state.data,event=current();el('social-master').href=data.url;el('social-master').hidden=!data.url;el('social-events').innerHTML=data.events.map(item=>'<button class="button'+(item.id===state.eventId?' active':'')+'" type="button" data-social-event="'+esc(item.id)+'">'+esc(date(item.date))+' <span class="count-pill">'+item.entrants.length+'</span></button>').join('')||'<p class="secondary-line">No social-race dates are currently set in Season dates.</p>';el('social-empty').hidden=!!event;el('social-content').hidden=!event;if(!event)return;
    el('social-date').textContent=date(event.date);el('social-title-input').value=event.title;el('social-notes').value=event.notes;el('social-count').textContent=event.entrants.length+' entrant'+(event.entrants.length===1?'':'s')+' · '+event.lobbies.length+' lobb'+(event.lobbies.length===1?'y':'ies')+' · '+event.status;
    const unallocated=event.entrants.filter(entry=>!entry.lobby);el('social-paste').value=event.entrants.length?event.entrants.map(entry=>entry.entrant).join('\n'):'';pastePreview();
    el('social-shuffle-panel').hidden=!event.entrants.length;el('social-lobby-panel').hidden=!event.lobbies.length;el('social-results-panel').hidden=!event.lobbies.length;
    el('social-lobby-count').max=Math.max(1,event.entrants.length);if(Number(el('social-lobby-count').value)>event.entrants.length||!el('social-lobby-count').value)el('social-lobby-count').value=String(Math.min(2,Math.max(1,event.entrants.length)));
    renderLobbyAssignments(event);renderResults(event);el('social-shuffle-note').textContent=unallocated.length?unallocated.length+' entrant'+(unallocated.length===1?' is':'s are')+' waiting for a lobby.':'Shuffling again replaces the current lobby allocation and clears saved results.';
  }
  function pastePreview(){const lines=el('social-paste').value.replace(/\r/g,'').split('\n').map(line=>line.trim().replace(/^(?:[•*\-]|\d+[.)])\s*/, '')).filter(Boolean),seen=new Set(),duplicates=[];lines.forEach(name=>{const key=name.toLowerCase();if(seen.has(key))duplicates.push(name);else seen.add(key);});el('social-paste-preview').textContent=lines.length?seen.size+' entrant'+(seen.size===1?'':'s')+(duplicates.length?' · '+duplicates.length+' duplicate line'+(duplicates.length===1?'':'s')+' will be ignored':''):'Paste one entrant per line.';}
  function renderLobbyAssignments(event){if(!event.lobbies.length){el('social-lobby-rows').innerHTML='';return;}const options=['<option value="">Choose lobby</option>'].concat(event.lobbies.map(lobby=>'<option value="'+lobby+'">Lobby '+lobby+'</option>')).join('');el('social-lobby-rows').innerHTML=event.entrants.slice().sort((a,b)=>(a.lobby-b.lobby)||(a.grid-b.grid)||a.entrant.localeCompare(b.entrant)).map(entry=>'<tr><td>'+esc(entry.entrant)+'</td><td><select data-social-lobby="'+esc(entry.entrant)+'">'+options.replace('value="'+entry.lobby+'"','value="'+entry.lobby+'" selected')+'</select></td><td>'+esc(entry.grid||'—')+'</td></tr>').join('');}
  function renderResults(event){const selected=String(el('social-result-lobby').value||event.lobbies[0]||'');el('social-result-lobby').innerHTML=event.lobbies.map(lobby=>'<option value="'+lobby+'">Lobby '+lobby+'</option>').join('');el('social-result-lobby').value=event.lobbies.map(String).includes(selected)?selected:String(event.lobbies[0]||'');const lobby=Number(el('social-result-lobby').value),rows=event.entrants.filter(entry=>entry.lobby===lobby).sort((a,b)=>a.grid-b.grid);el('social-result-rows').innerHTML=rows.map(entry=>'<tr><td>'+esc(entry.grid)+'. '+esc(entry.entrant)+'</td><td><select data-social-result-status="'+esc(entry.entrant)+'">'+['Pending','Finished','DNF','DNS'].map(status=>'<option'+(status===entry.status?' selected':'')+'>'+status+'</option>').join('')+'</select></td><td><input type="number" min="1" max="'+rows.length+'" inputmode="numeric" data-social-result-finish="'+esc(entry.entrant)+'" value="'+esc(entry.finish)+'" '+(entry.status==='Finished'?'':'disabled')+'></td><td><input maxlength="5000" data-social-result-notes="'+esc(entry.entrant)+'" value="'+esc(entry.notes)+'"></td></tr>').join('');}
  el('social-events').addEventListener('click',event=>{const button=event.target.closest('[data-social-event]');if(!button||state.busy)return;state.eventId=button.dataset.socialEvent;render();});
  el('social-paste').addEventListener('input',pastePreview);
  el('social-save-details').addEventListener('click',()=>rpc('savePreseasonSocialRaceDetails',{season:state.season,revision:state.data.revision,eventId:state.eventId,title:el('social-title-input').value,notes:el('social-notes').value}));
  el('social-import').addEventListener('click',()=>{const event=current();if(event.entrants.length&&!window.confirm('Replace the current entrant list? This clears lobbies and saved results for this social race.'))return;rpc('importPreseasonSocialRaceEntrants',{season:state.season,revision:state.data.revision,eventId:state.eventId,entrants:el('social-paste').value});});
  el('social-shuffle').addEventListener('click',()=>{const event=current();if(event.lobbies.length&&!window.confirm('Shuffle again? This replaces the current lobby allocation and clears saved results.'))return;rpc('shufflePreseasonSocialRaceLobbies',{season:state.season,revision:state.data.revision,eventId:state.eventId,lobbyCount:Number(el('social-lobby-count').value)});});
  el('social-save-lobbies').addEventListener('click',()=>rpc('savePreseasonSocialRaceLobbies',{season:state.season,revision:state.data.revision,eventId:state.eventId,assignments:Array.from(document.querySelectorAll('[data-social-lobby]')).map(select=>({entrant:select.dataset.socialLobby,lobby:Number(select.value)}))}));
  el('social-result-lobby').addEventListener('change',()=>renderResults(current()));
  el('social-result-rows').addEventListener('change',event=>{const status=event.target.closest('[data-social-result-status]');if(status){const finish=document.querySelector('[data-social-result-finish="'+CSS.escape(status.dataset.socialResultStatus)+'"]');finish.disabled=status.value!=='Finished';if(finish.disabled)finish.value='';}});
  el('social-save-results').addEventListener('click',()=>rpc('savePreseasonSocialRaceResults',{season:state.season,revision:state.data.revision,eventId:state.eventId,lobby:Number(el('social-result-lobby').value),results:Array.from(document.querySelectorAll('[data-social-result-status]')).map(select=>{const entrant=select.dataset.socialResultStatus;return {entrant:entrant,status:select.value,finish:document.querySelector('[data-social-result-finish="'+CSS.escape(entrant)+'"]').value,notes:document.querySelector('[data-social-result-notes="'+CSS.escape(entrant)+'"]').value};})}));
  el('social-refresh').addEventListener('click',()=>rpc('getPreseasonSocialRaces',state.season));el('social-back').addEventListener('click',()=>{if(!state.busy)window.F1XLPreseasonHub.open(state.season);});
  return {open:open};
})();
</script>
