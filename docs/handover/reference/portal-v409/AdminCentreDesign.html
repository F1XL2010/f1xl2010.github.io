/* Black TP canvas, shaded team-colour cards and a faded full-width banner. */
#view-team-principal-hub .tph-team-heading { display:flex; position:relative; min-height:180px; gap:20px; padding:28px; margin-bottom:18px; border:1px solid var(--line); border-left:5px solid var(--tph-accent); border-radius:6px; overflow:hidden; isolation:isolate; }

.tph-next-race strong { display:block; font-size:17px; margin-top:3px; }
.tph-next-race p { margin:0; color:var(--muted); font-size:12px; }
.tph-next-race .button { margin-left:auto; }
#view-team-principal-hub .button { background:var(--panel2); color:var(--text); }
#view-team-principal-hub :is(input,select),#tph-ticket-dialog :is(input,select,textarea) { background:#fff; color:#202b22; border-color:#cbd5c6; }

#tph-ticket-dialog .dialog-head { background:#fff; }
#tph-ticket-dialog .close { color:#243021; background:#edf2e7; }

  --panel:color-mix(in srgb,var(--tph-accent,var(--tph-page-accent,#ff8000)) 42%,#101412); --panel2:color-mix(in srgb,var(--tph-accent,var(--tph-page-accent,#ff8000)) 24%,#101412); --line:color-mix(in srgb,var(--tph-accent,var(--tph-page-accent,#ff8000)) 55%,#303831); --text:#ffffff; --muted:#e0e5e1;

/* Main Admin Portal shell.  The Team Principal Hub deliberately keeps the
   team-specific treatment above; the remaining operational areas share a
   calmer light workspace and dark-green work cards. */
body:not(.admin-team-view) {
  --bg:#edf3ef; --side:#f8faf7; --panel2:#f7faf8; --line:#cbd8d0;
  --text:#192a21; --muted:#577065; --green:#168b61; --green2:#d9f0e4;
  color-scheme:light; background:radial-gradient(circle at 92% -10%,#d5f0df 0,transparent 35rem),linear-gradient(135deg,#f8fbf9,#edf3ef); color:var(--text);
}
body:not(.admin-team-view) main { padding:32px clamp(22px,3.3vw,52px) 52px; }
body:not(.admin-team-view) main > section { max-width:1560px; margin:0 auto; }
body:not(.admin-team-view) .topbar { position:relative; margin-bottom:22px; }
body:not(.admin-team-view) .topbar h1 { font-size:clamp(31px,3.7vw,54px); font-weight:850; letter-spacing:-1.7px; }
body:not(.admin-team-view) .topbar .subtitle { max-width:700px; line-height:1.55; }
body:not(.admin-team-view) .eyebrow { color:#177852; letter-spacing:1.65px; font-size:10px; }
body:not(.admin-team-view) .pill { color:#155a40; background:#dff4e7; border-color:#b9dfca; border-radius:4px; letter-spacing:.8px; }
body:not(.admin-team-view) :is(.panel,.notice,.stat) {
  --panel:#1b3027; --panel2:#284237; --line:#3c594b; --text:#f5faf7; --muted:#bfd0c7; --green:#7ae0b4; --green2:#214d3b;
  color:var(--text); background:linear-gradient(145deg,#213a2f,#182a22 78%); border-color:var(--line); border-radius:7px; box-shadow:0 12px 28px #10221812;
}
body:not(.admin-team-view) .notice { border-left:4px solid #69c79c; }

body:not(.admin-team-view) .panel :is(input,select,textarea),body:not(.admin-team-view) dialog :is(input,select,textarea) { color:#f4faf6; background:#13251d; border-color:#496456; }

<script>
(function(){
  const sidebar=document.getElementById('admin-sidebar'),toggle=document.getElementById('admin-menu-toggle'),small=matchMedia('(max-width:850px)');
  if(!sidebar||!toggle)return;
  function closeMenu(restore){sidebar.classList.remove('admin-menu-open');toggle.setAttribute('aria-expanded','false');if(restore)toggle.focus();}
  toggle.addEventListener('click',()=>{const open=sidebar.classList.toggle('admin-menu-open');toggle.setAttribute('aria-expanded',String(open));});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sidebar.classList.contains('admin-menu-open')){closeMenu(true);}});
  document.addEventListener('click',e=>{if(small.matches&&!sidebar.contains(e.target))closeMenu(false);});
  small.addEventListener('change',()=>closeMenu(false));
  function paint(){
    const view=document.getElementById('view-team-principal-hub');
    document.body.classList.toggle('admin-team-view',!!view&&!view.hidden);
  }
  window.addEventListener('f1xl-view-change',()=>{
    const menuHadFocus=sidebar.classList.contains('admin-menu-open')&&sidebar.contains(document.activeElement);
    paint();closeMenu(false);
    if(small.matches&&menuHadFocus){const heading=document.querySelector('main > section:not([hidden]) h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}}
  });
  paint();
})();
</script>
