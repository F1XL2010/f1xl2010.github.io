<style>
#portal-progress{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:99999;pointer-events:none;display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:12px;border:1px solid #78976e;background:#15241af2;color:#edf4e9;box-shadow:0 8px 35px #0008;font-size:14px}
#portal-progress[hidden]{display:none}#portal-progress-ring{display:block;flex:none;width:32px;height:32px;animation:portal-progress-spin 1.2s linear infinite}#portal-progress-ring svg{display:block;width:100%;height:100%}
@keyframes portal-progress-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#portal-progress-ring{animation:none}}
</style>
<script>
window.F1XLProgress=(function(){
  const active=new Map();let next=0,timer=null,lastGesture=-Infinity;
  const box=document.createElement('div');box.id='portal-progress';box.hidden=true;box.setAttribute('role','status');box.setAttribute('aria-live','polite');
  box.innerHTML='<span id="portal-progress-ring" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="16" fill="#111813" stroke="#78976e" stroke-width="2"/><circle cx="20" cy="20" r="13.5" stroke="#6d776f" stroke-width="2" stroke-dasharray="2 4"/><circle cx="20" cy="20" r="10" fill="#24332a" stroke="#d6e4ce" stroke-width="1.5"/><path d="M20 20V10M20 20L29.51 16.91M20 20L25.88 28.09M20 20L14.12 28.09M20 20L10.49 16.91" stroke="#d6e4ce" stroke-width="2.5"/><circle cx="20" cy="20" r="3" fill="#a8d38a"/><path d="M18 4h4" stroke="#dbef83" stroke-width="2"/></svg></span><span id="portal-progress-text"></span>';document.body.appendChild(box);
  document.addEventListener('click',()=>lastGesture=Date.now(),true);
  function paint(){
    if(!active.size){clearTimeout(timer);timer=null;box.hidden=true;return;}
    const parent=document.querySelector('dialog[open]')||document.body;if(box.parentNode!==parent)parent.appendChild(box);
    box.querySelector('#portal-progress-text').textContent=Array.from(active.values()).at(-1);box.hidden=false;
  }
  function begin(name){
    // These autosaves already report Saving/Saved/errors beside the edited rows.
    if(['saveTicketReviews','saveTicketOutcome','saveMyStewardReviews','processTicketWebsiteUpdates'].includes(name))return ()=>{};
    // These read-only hubs already show loading, retry and error states in the relevant panel.
    if(/^get(?:TeamPrincipalHub|FreeAgentHub)/.test(name))return ()=>{};
    const writing=!/^(get|preview|check|verify)/.test(name);
    // Background counts/polling do not interrupt the screen with a spinner.
    if(!writing&&Date.now()-lastGesture>120)return ()=>{};
    const id=++next,label=/^(import|process)/.test(name)?'Processing…':writing?'Saving…':'Loading…';active.set(id,label);
    if(!timer)timer=setTimeout(()=>{timer=null;paint();},180);
    return ()=>{active.delete(id);paint();};
  }
  return {begin:begin};
})();
</script>
