<script>
(function(){
  if(window.F1XLNavigation)window.F1XLNavigation.register('ticket-processing',()=>tp.busy||boardPending()||outcomePending()||noteDirty(),()=> ({season:tp.season}));

  'use strict';
  const tp={season:'',setup:null,overview:null,publicFeed:null,key:'',race:null,submissions:[],outcomes:null,exportData:null,view:'inbox',loaded:false,loading:false,busy:false,edit:null,incoming:null,outcome:null,published:null,caseTab:'evidence'};
  const el=id=>document.getElementById(id),byId=el,esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rpc=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(data=>{resolve(data);if(data&&data.publicationPending&&data.season)queueWebsiteUpdate(data.season);}).withFailureHandler(reject)[name](...args));
  const websiteUpdates=new Map();
  function queueWebsiteUpdate(season){
    season=String(season);if(websiteUpdates.has(season)){websiteUpdates.get(season).again=true;return;}
    const job={again:false,attempt:0};websiteUpdates.set(season,job);
    const run=async()=>{
      job.again=false;job.attempt++;
      try{
        const data=await rpc('processTicketWebsiteUpdates',{season});
        if(String(tp.season)===season&&data.feed){tp.publicFeed=data.feed;renderTicketPublicConnection();if(penalties&&String(penalties.season)===season){penalties.feed=data.feed;if(!tp.busy&&!activeTicketDialog())el('ticket-penalty-status').textContent=data.message;}}
        if((data.busy||job.again)&&job.attempt<4){setTimeout(run,5000);return;}
      }catch(error){/* The durable server queue retries even if this tab closes. */}
      websiteUpdates.delete(season);
    };
    setTimeout(run,100);
  }
  const options=(values,selected,blank)=>(blank?[''].concat(values||[]):values||[]).map(v=>'<option value="'+esc(v)+'"'+(String(v)===String(selected||'')?' selected':'')+'>'+esc(v||'—')+'</option>').join('');
  const textField=(label,id,v,wide)=>'<label class="'+(wide?'wide':'')+'">'+esc(label)+'<input id="'+id+'" value="'+esc(v)+'"></label>';
  const areaField=(label,id,v)=>'<label class="wide">'+esc(label)+'<textarea id="'+id+'">'+esc(v)+'</textarea></label>';
  const baseline=new Map(),revisions=new Map();
  const inboxPoll={request:0,flight:0};
  function formValues(id){return Array.from(el(id).querySelectorAll('input,textarea,select')).filter(e=>e.id!=='ticket-reviewers-scope').map(e=>[e.id,e.type==='checkbox'?e.checked:e.value]);}
  function mark(id){baseline.set(id,JSON.stringify(formValues(id)));}
  function dirty(id){return baseline.has(id)&&baseline.get(id)!==JSON.stringify(formValues(id));}
  const ticketDialogs=['carry-dialog','ticket-incoming-dialog','ticket-race-dialog','ticket-outcome-dialog','ticket-export-dialog','ticket-reviewers-dialog','ticket-conflicts-dialog','ticket-threshold-ban-dialog','ticket-admin-note-dialog'];
  function activeTicketDialog(){return ticketDialogs.map(el).find(d=>d&&d.open);}
  function dialogFeedback(dialog,message,kind){
    if(!dialog)return;
    let notice=dialog.querySelector('[data-ticket-save-feedback]');
    if(!notice){
      const head=dialog.querySelector('.dialog-head');if(!head)return;
      let container=head.firstElementChild;
      if(container.tagName!=='DIV'){const wrap=document.createElement('div');head.insertBefore(wrap,container);wrap.appendChild(container);container=wrap;}
      container.style.minWidth='0';container.style.flex='1';head.style.zIndex='2';
      notice=document.createElement('div');notice.dataset.ticketSaveFeedback='';notice.setAttribute('aria-live','polite');
      notice.style.cssText='margin-top:4px;font-size:13px;line-height:1.4;overflow-wrap:anywhere;';container.appendChild(notice);
    }
    notice.textContent=message||'';notice.hidden=!message;notice.dataset.kind=kind||'';
    notice.className='ticket-save-feedback';notice.style.color=kind==='error'?'var(--red)':kind==='success'?'var(--green)':'var(--muted)';notice.setAttribute('role',kind==='error'?'alert':'status');
  }
  function clearDialogFeedback(id){dialogFeedback(el(id),'','');}
  function status(message,error){el('ticket-processing-status').textContent=message||'';el('ticket-processing-status').classList.toggle('error',!!error);dialogFeedback(activeTicketDialog(),message,error?'error':'success');}
  async function work(action){
    if(tp.busy)return;tp.busy=true;
    // Discard any inbox read started before processing or editing a submission.
    inboxPoll.request++;
    const dialog=activeTicketDialog(),button=dialog&&document.activeElement?.closest('button'),label=button?.textContent,saving=!!button&&/^save\b/i.test(label);
    // Keep the current operation stable without freezing filters, the sidebar or
    // the rest of the portal. Navigation is separately guarded while tp.busy.
    const active=dialog||el('ticket-processing-'+tp.view)||el('view-ticket-processing');
    // Refresh would discard or replace the active response, so it is one of the
    // few page-level actions that must wait with the active work.
    const roots=[active,el('ticket-round-select'),el('ticket-processing-subnav'),el('refresh-ticket-processing')].filter(Boolean);
    const controlSelector='button,input,select,textarea';
    const controls=Array.from(new Set(roots.flatMap(root=>[
      ...(root.matches(controlSelector)?[root]:[]),...root.querySelectorAll(controlSelector)
    ])));
    const disabled=controls.map(e=>e.disabled);controls.forEach(e=>e.disabled=true);
    dialogFeedback(dialog,saving?'Saving…':'Working…','busy');if(saving)button.textContent='Saving…';
    try{await boardFlush();await outcomeFlush();await action();}
    catch(e){status((saving?'Save not confirmed: ':'')+(e.message||String(e)),true);if(dialog?.id==='ticket-race-dialog'&&caseDirty())el('ticket-discard-changes').hidden=false;}
    finally{
      controls.forEach((e,i)=>{if(e.isConnected)e.disabled=disabled[i];});
      if(saving&&button.isConnected&&button.textContent==='Saving…')button.textContent=label;
      const notice=dialog?.querySelector('[data-ticket-save-feedback]');if(notice?.dataset.kind==='busy')dialogFeedback(dialog,'','');
      tp.busy=false;if(el('ticket-round-select'))el('ticket-round-select').value=tp.key;
      if(el('ticket-incoming-dialog').open)previewTarget();
    }
  }
  function links(values){return (values||[]).filter(Boolean).map((v,i)=>{let ok=false;try{ok=['https:','http:'].includes(new URL(v).protocol);}catch(e){}return ok?'<a class="button" href="'+esc(v)+'" target="_blank" rel="noopener noreferrer">Evidence '+(i+1)+' ↗</a>':'<span>'+esc(v)+'</span>';}).join(' ');}
  function prose(value){const text=String(value||'');let result='',last=0;for(const match of text.matchAll(/https?:\/\/[^\s<>"']+/g)){result+=esc(text.slice(last,match.index))+'<a href="'+esc(match[0])+'" target="_blank" rel="noopener noreferrer">'+esc(match[0])+'</a>';last=match.index+match[0].length;}return result+esc(text.slice(last));}
  function evidence(t){return '<p><strong>'+esc(t.submitter||t.fromDriver)+' · '+esc(t.submitterTeam||t.fromTeam)+' → '+esc(t.offender||t.againstDriver)+' · '+esc(t.offenderTeam||t.againstTeam)+'</strong></p><p style="white-space:pre-wrap">'+prose(t.description)+'</p><div class="toolbar">'+links(t.evidence)+'</div>'+(t.defenceComments||(t.defenceEvidence||[]).some(Boolean)?'<h3>Defence</h3><p style="white-space:pre-wrap">'+prose(t.defenceComments)+'</p><div class="toolbar">'+links(t.defenceEvidence)+'</div>':'<p class="secondary-line">No defence attached.</p>');}
  function appealEvidence(t){return '<p style="white-space:pre-wrap">'+prose(t.appealDescription||'No appeal attached.')+'</p><div class="toolbar">'+links(t.appealEvidence)+'</div>';}
  function noteDirty(){return !!el('ticket-admin-note-dialog')?.open&&dirty('ticket-admin-note-form');}
  function rememberRound(){try{if(tp.key)localStorage.setItem('f1xl-ticket-round:'+tp.season,tp.key);}catch(e){}destination();}
  function rememberedRound(){try{return localStorage.getItem('f1xl-ticket-round:'+tp.season)||'';}catch(e){return '';}}
  function destination(){
    const r=currentRound(),selected=intakeRound(el('ticket-batch-round').value),label=selected?'R'+selected.round+' · '+selected.track:'';
    el('ticket-process-selected').textContent=label?'Process selected into '+label:'Choose a destination round';
    el('ticket-edit-note').hidden=!r;el('ticket-edit-note').textContent=r?.notes?'Head Steward Note · saved':'Head Steward Note';
  }
  function intakeRound(key){return (tp.setup?.rounds||[]).find(r=>'r:'+r.round===key&&r.state!=='Cancelled');}
  function intakeRoundOptions(){return '<option value="">Choose destination round…</option>'+(tp.setup?.rounds||[]).filter(r=>r.state!=='Cancelled').map(r=>'<option value="r:'+r.round+'">R'+r.round+' · '+esc(r.track)+(r.publishedAt||r.state==='Published'?' · Already published':'')+'</option>').join('');}
  function intakeRoundWarning(r){return r&&(r.publishedAt||r.state==='Published')?'This round already has published decisions. Only choose it for a late ticket belonging to that round.':'';}
  function currentRound(){return tp.setup&&(tp.setup.rounds||[]).find(r=>'r:'+r.round===tp.key);}
  function roundName(){const r=currentRound();return r?'S'+tp.season+' · R'+r.round+' · '+r.track:tp.key.slice(2)||'Choose a round';}
  function blankRace(){const overview=tp.overview||{};return {sheetName:'',round:currentRound(),tickets:[],stewardReviewers:overview.stewardReviewers||[],appealReviewers:overview.appealReviewers||[],options:{penalties:[],timePenalties:[]}};}
  function selections(){const linked=(tp.setup?.rounds||[]).find(r=>r.sheetName&&'s:'+r.sheetName===tp.key);if(linked)tp.key='r:'+linked.round;const select=el('ticket-round-select'),registered=new Set((tp.setup?.rounds||[]).map(r=>r.sheetName));select.innerHTML='<option value="">Choose a round…</option>'+(tp.setup?.rounds||[]).map(r=>'<option value="r:'+r.round+'">R'+r.round+' · '+esc(r.track)+(r.state==='Cancelled'?' · Cancelled':'')+'</option>').join('')+'<optgroup label="Other race sheets">'+(tp.overview?.races||[]).filter(r=>!registered.has(r.name)).map(r=>'<option value="s:'+esc(r.name)+'">'+esc(r.name)+'</option>').join('')+'</optgroup>';if(!Array.from(select.options).some(o=>o.value===tp.key))tp.key='';select.value=tp.key;}
  async function load(force){
    if(tp.loading||tp.busy||tp.loaded&&!force)return;
    tp.loading=true;
    await work(async()=>{
      status('Opening ticket workspace…');
      const d=await rpc('getTicketProcessingInitial',{season:tp.season,forceRefresh:!!force,navigationOnly:true});
      tp.season=d.season;tp.setup=d.setup;tp.overview=d.overview;tp.publicFeed=d.publicFeed||{};tp.loaded=true;
      if(tp.publicFeed.pending)queueWebsiteUpdate(tp.season);
      el('ticket-page-title').textContent=tp.season?'S'+tp.season+' Tickets':'Tickets';
      el('ticket-processing-source').textContent=d.overview.sourceName;
      el('ticket-workbook-link').href=tp.setup?tp.setup.url:'https://docs.google.com/spreadsheets/d/1xW2UqxG2joO1gpsUZobMM2qkTFDPLsZZQ78TvsmnlbI/edit';
      if(!tp.key)tp.key=rememberedRound();
      selections();
      el('ticket-batch-round').innerHTML=intakeRoundOptions();el('ticket-batch-round').value='';
      // With no remembered round, ask the admin instead of silently assuming R1.
      rememberRound();
      el('ticket-round-select').value=tp.key;
      if(force){invalidateCompletion();tp.outcomes=null;tp.exportData=null;tp.penaltyOptions=[];}
      tp.race=blankRace();renderTicketPublicConnection();renderRace();renderDivisionFilter();renderInbox();
      if(tp.view!=='inbox')await view(tp.view);
      status(tp.view==='inbox'?'Checking for new submissions…':'Ready · '+roundName());
    });
    tp.loading=false;
    // The inbox is independent of the selected race. Do not block the page on a
    // full 85-column race-tab read before the admin chooses to review it.
    inbox(!!force).then(()=>{if(tp.view==='inbox'&&!activeTicketDialog())status(tp.key?'Ready · '+roundName():'Choose the destination round before processing submissions.');}).catch(e=>{if(!activeTicketDialog())status(e.message||String(e),true);});
  }
  async function loadRace(force){const r=currentRound(),name=r?r.sheetName:tp.key.startsWith('s:')?tp.key.slice(2):'';if(!force&&name&&tp.race?.sheetName===name)return tp.race;tp.race=name?await rpc('getTicketRaceWorkspace',name,!!force):blankRace();renderRace();return tp.race;}
  async function selectRound(key,force){completion=null;el('ticket-completion').hidden=true;tp.key=key;rememberRound();tp.outcomes=null;tp.exportData=null;tp.penaltyOptions=[];tp.race=blankRace();if(tp.view!=='inbox')await loadRace(force);await view(tp.view);}
  async function ensureRace(){
    if(tp.race?.sheetName)return;
    const r=currentRound();if(!r)throw Error('Choose a season round first.');
    if(r.sheetName){await loadRace(false);return;}
    const created=await rpc('createTicketRoundWorkspace',{season:tp.season,round:r.round});r.sheetName=created.sheetName;await loadRace(true);
  }
  async function view(name){
    tp.view=name;
    if(name!=='inbox'&&!tp.race?.sheetName&&tp.key)await loadRace(false);
    if(name==='penalties')await loadPenalties();
    ['inbox','race','outcomes','appeals','penalties'].forEach(k=>el('ticket-processing-'+k).hidden=k!==name);document.querySelectorAll('[data-ticket-processing-view]').forEach(b=>b.classList.toggle('active',b.dataset.ticketProcessingView===name));
    // Imports, case edits and outcome preparation maintain numbering. Tab navigation only reads.
    if(name==='race')renderRace();
    if(name==='outcomes'){await exports(false);if(!publishedRows().length)await outcomes(false);else renderOutcomes();if(publishedRows().length&&window.F1XLAccess?.can('licences',1))await loadCompletion();}
    if(name==='appeals'){await exports(false);renderAppeals();}
    if(!activeTicketDialog())status(tp.key?'Ready · '+roundName():'Choose a round to continue.');
  }
  function inboxPollingActive(){return tp.loaded&&tp.view==='inbox'&&!document.hidden&&!el('view-ticket-processing').hidden&&!tp.loading&&!tp.busy&&!activeTicketDialog()&&!boardPending()&&!outcomePending();}
  async function inbox(force,background){
    const request=++inboxPoll.request,season=tp.season;inboxPoll.flight++;
    try{
      const d=await rpc('getTicketSubmissions',!!force);
      if(request!==inboxPoll.request||season!==tp.season||background&&!inboxPollingActive())return;
      const submissions=d.submissions||[];
      if(background&&JSON.stringify(submissions)===JSON.stringify(tp.submissions))return;
      const selected=new Set(Array.from(el('ticket-incoming-rows').querySelectorAll('[data-ticket-select]:checked')).map(e=>e.dataset.ticketSelect));
      tp.submissions=submissions;renderDivisionFilter();renderInbox();
      el('ticket-incoming-rows').querySelectorAll('[data-ticket-select]').forEach(e=>{e.checked=selected.has(e.dataset.ticketSelect);});
    }finally{inboxPoll.flight--;}
  }
  function pollInbox(){
    if(inboxPoll.flight||!inboxPollingActive())return;
    // Bypass the two-minute source cache; no page reload, spinner or form render.
    inbox(true,true).catch(()=>{});
  }
  setInterval(pollInbox,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollInbox();});
  function renderInbox(){const visible=filtered(tp.submissions,true).filter(t=>!el('ticket-inbox-type').value||typeOf(t)===el('ticket-inbox-type').value);el('ticket-inbox-count').textContent=tp.submissions.length?'('+tp.submissions.length+')':'';el('ticket-incoming-rows').innerHTML=visible.map(t=>'<tr><td>'+(typeOf(t)==='ticket'?'<input type="checkbox" aria-label="Select submission from '+esc(t.fromDriver)+'" data-ticket-select="'+esc(t.submissionRevision)+'">':'')+'</td><td>'+esc(t.received)+'</td><td>'+esc(t.type)+(t.session?'<small style="display:block">'+esc(t.session)+'</small>':'')+'</td><td>'+esc(t.division)+'</td><td>'+esc(t.fromDriver)+'</td><td>'+esc(t.againstDriver)+'</td><td>'+esc(relatedLabel(t))+'</td><td><button class="button" type="button" data-ticket-incoming="'+esc(t.id)+'">Review</button></td></tr>').join('');el('ticket-incoming-empty').hidden=!!visible.length;el('ticket-incoming-empty').textContent=tp.submissions.length?'No submissions match these filters.':'No unprocessed submissions.';}
  function typeOf(t){return /appeal/i.test(t.type)?'appeal':/defen[cs]e/i.test(t.type)?'defence':'ticket';}
  const normal=v=>String(v||'').trim().toLowerCase().replace(/\s+/g,' ');
  function divisionOf(t){return String(t.division||'').trim();}
  function matching(a,b){
    if(divisionOf(a)!==divisionOf(b))return false;
    const names=t=>[normal(t.fromDriver||t.submitter),normal(t.againstDriver||t.offender)].sort();
    const x=names(a),y=names(b);return x.every(Boolean)&&x[0]===y[0]&&x[1]===y[1];
  }
  function relatedLabel(t){
    if(typeOf(t)==='ticket'){const count=tp.submissions.filter(d=>typeOf(d)==='defence'&&matching(d,t)).length;return count?count+' possible defence'+(count===1?'':'s'):'';}
    const count=(tp.race?.tickets||[]).filter(c=>matching(t,c)).length+tp.submissions.filter(c=>typeOf(c)==='ticket'&&matching(t,c)).length;
    return count?count+' possible match'+(count===1?'':'es'):'Choose case';
  }
  function renderDivisionFilter(){const select=el('ticket-division-filter'),old=select.value;const values=Array.from(new Set(tp.submissions.concat(tp.race?.tickets||[]).map(divisionOf).filter(Boolean))).sort((a,b)=>Number(a)-Number(b));select.innerHTML='<option value="">All divisions</option>'+options(values,old);select.value=values.includes(old)?old:'';}
  function filtered(items,incoming){
    const div=el('ticket-division-filter').value,q=normal(el('ticket-list-search').value),order=el('ticket-list-order').value;
    return items.filter(t=>(!div||divisionOf(t)===div)&&(!q||normal([t.fromDriver||t.submitter,t.againstDriver||t.offender,t.fromTeam||t.submitterTeam,t.againstTeam||t.offenderTeam,t.description,t.defenceComments,t.appealDescription,t.ticketNumber].join(' ')).includes(q))).slice().sort((a,b)=>{
      if(order==='division')return Number(a.division)-Number(b.division)||(incoming?a.sourceRow-b.sourceRow:Number(a.ticketNumber)-Number(b.ticketNumber));
      if(order==='from'||order==='against'){const value=t=>order==='from'?(t.fromDriver||t.submitter):(t.againstDriver||t.offender);return String(value(a)||'').localeCompare(String(value(b)||''),undefined,{numeric:true,sensitivity:'base'});}
      const value=t=>incoming?t.sourceRow:Number(t.ticketNumber)||t.sheetRow;return (order==='oldest'?1:-1)*(value(a)-value(b));
    });
  }
  function caseList(){return filtered(tp.race?.tickets||[],false).filter(t=>{const filter=el('ticket-review-filter').value,done=t.stewardVotes.every(v=>tp.race.round?['Submitted','Recused'].includes(v.state):v.penalty||v.comments);return !filter||filter==='no-defence'&&!t.defenceComments&&!t.defenceEvidence.some(Boolean)||filter==='complete'&&done||filter==='pending'&&!done;});}
  function refreshLists(){renderPenalties();renderInbox();renderRace();renderOutcomes();renderExport();}
  function invalidateRoundViews(){invalidateCompletion();tp.outcomes=null;tp.exportStale=true;tp.penaltyOptions=[];}
  function targetCandidates(){return (tp.race?.tickets||[]).filter(t=>divisionOf(t)===divisionOf(tp.incoming)).map(t=>({key:String(t.sheetRow),ticket:t,pending:false})).concat((tp.race?.sheetName&&!tp.race.round?[]:tp.submissions).filter(t=>typeOf(t)==='ticket'&&divisionOf(t)===divisionOf(tp.incoming)).map(t=>({key:'inbox:'+t.id,ticket:t,pending:true})));}
  function updateImportControls(){
    el('ticket-import-message').textContent='';
    const mode=el('ticket-import-mode').value,isTicket=mode==='ticket';el('ticket-import-target-field').hidden=isTicket;
    const candidates=targetCandidates().sort((a,b)=>Number(matching(tp.incoming,b.ticket))-Number(matching(tp.incoming,a.ticket)));
    el('ticket-import-target').innerHTML='<option value="">Choose the matching ticket…</option>'+candidates.map(c=>'<option value="'+esc(c.key)+'">'+(matching(tp.incoming,c.ticket)?'Suggested · ':'')+(c.pending?'Inbox · ':('#'+esc(c.ticket.ticketNumber)+' · '+esc(c.ticket.session||'')+' · '))+esc(c.ticket.fromDriver||c.ticket.submitter)+' v '+esc(c.ticket.againstDriver||c.ticket.offender)+'</option>').join('');
    const likely=candidates.filter(c=>matching(tp.incoming,c.ticket));if(likely.length===1)el('ticket-import-target').value=likely[0].key;
    el('ticket-match-hint').textContent=isTicket?relatedLabel(tp.incoming)+(relatedLabel(tp.incoming)?'. Process this ticket, then review and attach the defence.':''):'Check the round, drivers and incident below before attaching. A suggestion is not an automatic match.';
    previewTarget();
  }
  function previewTarget(){
    const isTicket=el('ticket-import-mode').value==='ticket',candidate=targetCandidates().find(c=>c.key===el('ticket-import-target').value);
    const needsRound=isTicket||candidate?.pending,chosen=intakeRound(el('ticket-import-round').value),label=chosen?'S'+tp.season+' · R'+chosen.round+' · '+chosen.track:'';
    el('ticket-import-round-field').hidden=!needsRound;el('ticket-import-round-warning').textContent=needsRound?intakeRoundWarning(chosen):'';
    el('ticket-match-preview').innerHTML=!isTicket&&candidate?'<h3>'+(candidate.pending?'Original ticket still in inbox':'Selected ticket')+'</h3>'+evidence(candidate.ticket):'';
    el('ticket-import-session').disabled=!!tp.incoming?.session||!isTicket&&!!candidate&&!candidate.pending;
    if(tp.incoming?.session)el('ticket-import-session').value=tp.incoming.session;
    else if(candidate&&!candidate.pending)el('ticket-import-session').value=candidate.ticket.session||'Race';
    el('import-ticket-submission').disabled=!!needsRound&&!chosen;
    el('import-ticket-submission').textContent=needsRound?(!chosen?'Choose destination round':isTicket?'Process into '+label:'Process ticket into '+label+' and attach '+el('ticket-import-mode').value):'Attach '+el('ticket-import-mode').value+' to '+roundName();
  }
  async function importIncoming(){
    el('ticket-import-message').textContent='Processing…';
    const item=tp.incoming,mode=el('ticket-import-mode').value,session=el('ticket-import-session').value,candidate=targetCandidates().find(c=>c.key===el('ticket-import-target').value);
    const needsRound=mode==='ticket'||candidate?.pending,chosen=intakeRound(el('ticket-import-round').value);
    if(needsRound&&!chosen)throw Error('Choose the destination round for this new ticket.');
    if(needsRound&&intakeRoundWarning(chosen)&&!confirm('Add a late ticket to S'+tp.season+' · R'+chosen.round+' · '+chosen.track+'? This round already has published decisions.')){el('ticket-import-message').textContent='Nothing processed. Choose the correct destination round.';return;}
    try{
      if(needsRound&&tp.key!=='r:'+chosen.round)await selectRound('r:'+chosen.round);
      let row=Number(el('ticket-import-target').value);
      if(mode!=='ticket'&&candidate?.pending){await process(candidate.ticket,'ticket',candidate.ticket.session||session,0);const created=tp.race.tickets.filter(t=>t.sourceSubmissionId===candidate.ticket.submissionRevision);if(created.length!==1)throw Error('The original ticket was processed. Refresh and select its case before attaching the remaining material.');row=created[0].sheetRow;}
      await process(item,mode,session,row);el('ticket-incoming-dialog').close();await inbox();status('Submission processed into '+roundName()+' and archived.');
    }catch(e){try{await inbox();if(tp.race?.sheetName){tp.race=await rpc('getTicketRaceWorkspace',tp.race.sheetName,true);invalidateRoundViews();renderRace();}updateImportControls();}finally{el('ticket-import-message').textContent=e.message+' Any completed import is retained. Check the selected case and retry the remaining submission.';}throw e;}
  }

  // Shared review workflow; each board owns its drafts, reviewer selection and vote columns.
  function createTicketReviewBoard(type){
  const isAppeal=type==='appeal',votesKey=isAppeal?'appealVotes':'stewardVotes',namesKey=isAppeal?'appealReviewers':'stewardReviewers';
  const ids={'ticket-review-filter':'ticket-appeal-filter','ticket-race-rows':'ticket-appeal-rows','ticket-race-head':'ticket-appeal-head','ticket-race-panel':'ticket-appeal-panel','ticket-race-empty':'ticket-appeal-empty'};
  const el=id=>document.getElementById(isAppeal?(ids[id]||id.replace(/^ticket-board-/,'ticket-appeal-board-')):id);
  // Drafts belong to a case and reviewer, never to a rendered row or current filter.
  const board={mode:'head',reviewer:0,selected:0,side:isAppeal?'appeal':'incident',entries:new Map(),timer:0,flight:null};
  const boardValue=v=>({penalty:v.penalty||'',timePenalty:v.timePenalty||'',atFault:v.atFault||'',comments:v.comments||'',state:v.state||'Draft'});
  const boardEqual=(a,b)=>JSON.stringify(boardValue(a))===JSON.stringify(boardValue(b));

        reviewerIndex:i,reviewerName:tp.race[namesKey][i].name,revision:vote.revision,
        base:boardValue(vote),value:boardValue(vote),dirty:false,saving:false,error:'',version:0};
      board.entries.set(key,entry);
    }

  }

  function boardValid(v){
    if(v.state==='Submitted'&&(!v.penalty||!v.comments.trim()))return 'Choose a penalty and add reasoning, or keep this as Draft.';
    if(v.state==='Recused'&&(!v.comments.trim()||v.penalty||v.timePenalty||v.atFault))return 'Recused needs a reason and no penalty, time penalty or at-fault driver. Use Manage recusals for own-team tickets.';

  function boardNotice(){
    const entries=Array.from(board.entries.values()),pending=entries.filter(e=>e.dirty),errors=pending.filter(e=>e.error);

    el('ticket-board-save-state').textContent=board.flight?'Saving…':errors.length?errors.length+' review(s) need attention — changes kept here':pending.length?'Changes waiting to save…':'Changes saved automatically';
    el('ticket-board-save-state').classList.toggle('error',!!errors.length);
    el('ticket-board-find-unsaved').hidden=!errors.length;
    for(const row of el('ticket-race-rows').querySelectorAll('[data-board-row]')){
      const t=tp.race?.tickets.find(t=>t.sheetRow===Number(row.dataset.boardRow));if(!t)continue;
      const entry=board.entries.get(boardKey(t,board.reviewer)),notice=row.querySelector('[data-board-status]');

    const valid=candidates.filter(e=>!e.error);if(!valid.length){boardNotice();return;}

    batch.forEach(e=>e.saving=true);
    board.flight=(async()=>{
      try{
        const data=await rpc('saveTicketReviews',{sheetName:sheet,responseMode:'changed',reviews:snapshots.map(({entry:e,review})=>({
          sheetName:sheet,sheetRow:e.sheetRow,caseId:e.caseId,recordRevision:e.recordRevision,reviewType:type,
          reviewerIndex:e.reviewerIndex,reviewerName:e.reviewerName,revision:e.revision,review
