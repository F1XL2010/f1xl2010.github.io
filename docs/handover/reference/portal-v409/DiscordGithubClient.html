<script>
window.F1XLDiscordControl=(function(){
 const el=id=>document.getElementById('dcg-'+id),rpc=(name,...args)=>new Promise((resolve,reject)=>window.F1XLRpc.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
 let data=null,busy=false,loading=false,timer=null,generation=0,pendingKey='',pendingSince=0,appData=null,appBusy=false,appLoaded=false;
 const when=v=>v?new Date(v).toLocaleString('en-GB',{timeZone:'Europe/London'}):'Not received yet';
 function message(text,error=false){el('message').textContent=text;el('message').style.color=error?'var(--red)':'';}
 function controls(){const active=data?.job&&!['Finished'].includes(data.job.label)&&Date.parse(data.job.expires)>Date.now();el('start').disabled=busy||!data?.connected||!data?.canDraft||!!active;document.querySelectorAll('[data-dcg-board]').forEach(b=>b.disabled=busy||!data?.connected||!data?.canBoards||!!active);el('refresh').disabled=loading||busy;const canJob=['draft','practice'].includes(data?.job?.kind)?data?.canDraft:data?.canBoards;el('pause').disabled=busy||!active||!canJob||data?.job?.command!=='run';el('resume').disabled=busy||!active||!canJob||data?.job?.command!=='pause';el('finish').disabled=busy||!active||!canJob||data?.job?.command==='stop';el('connect').disabled=busy||!data?.owner;el('season').disabled=busy;el('mode').disabled=busy;}
 function render(){el('setup').hidden=!data.owner;el('connection').textContent=data.connected?'GitHub is connected. The token is stored privately and is never displayed.':'GitHub needs connecting once by the F1XL owner.';
  el('applications').hidden=!data.owner;
  el('draft-card').hidden=!data.canDraft;el('boards-card').hidden=!data.canBoards;
  if(!data.canDraft&&data.canBoards){el('draft-card').hidden=false;}el('draft-card').querySelector('h2').textContent=data.canDraft?'Draft announcements':'Season for updates';el('draft-card').querySelector('.dc-description').hidden=!data.canDraft;el('mode').parentElement.hidden=!data.canDraft;el('start').hidden=!data.canDraft;el('draft-help').hidden=!data.canDraft;el('catchup-label').hidden=!data.canDraft||el('mode').value!=='draft';
  el('schedules').textContent='Standings: '+data.existingSchedules.standings+'. Team lists: '+data.existingSchedules.teams+'. Calendar: '+data.existingSchedules.calendar+'.';
  const j=data.job;el('job').hidden=!j;if(j){const draft=['draft','practice'].includes(j.kind);el('pause').hidden=!draft;el('resume').hidden=!draft;el('finish').textContent=draft?'Finish announcements':'Stop update';el('job-heading').textContent=(j.kind==='practice'?'Practice draft':j.kind==='draft'?'Draft announcements':j.kind[0].toUpperCase()+j.kind.slice(1))+' · S'+j.season;el('state').textContent=j.label;el('job-detail').textContent=j.detail;el('heartbeat').textContent='Last runner check: '+when(j.at)+' · Ends by '+when(j.expires);el('channel').href=j.channelUrl;el('run').hidden=!j.runUrl;if(j.runUrl)el('run').href=j.runUrl;else el('run').removeAttribute('href');const unchanged=j.history.filter(r=>r.state==='Unchanged').length;el('history-title').textContent='Delivery history · '+j.delivered+' sent or updated'+(unchanged?' · '+unchanged+' unchanged':'');el('history').replaceChildren();for(const r of j.history){const li=document.createElement('li');li.textContent=when(r.at)+' · '+r.label+' · '+r.state;if(r.messageId){const link=document.createElement('a');link.href=j.channelUrl+'/'+r.messageId;link.target='_blank';link.rel='noopener noreferrer';link.textContent=' View in Discord ↗';li.append(link);}el('history').append(li);}if(!j.history.length){const li=document.createElement('li');li.textContent='No confirmed deliveries yet.';el('history').append(li);}}
  controls();
 }
 function schedule(){clearTimeout(timer);if(data?.job&&!['Finished','Needs attention'].includes(data.job.label)){const pending=['Start requested','Pausing','Resuming','Finishing'].includes(data.job.label);let delay=30000;if(pending){const key=data.job.id+':'+data.job.revision+':'+data.job.command;if(key!==pendingKey){pendingKey=key;pendingSince=Date.now();}const elapsed=Date.now()-pendingSince;delay=elapsed<60000?5000:elapsed<180000?15000:30000;}else pendingKey='';timer=setTimeout(()=>{if(!document.getElementById('view-discord-control').hidden)load();},delay);}}
 async function load(){if(loading||busy)return;const request=++generation;loading=true;controls();try{const reply=await rpc('getDiscordGithubControls');if(request!==generation)return;data=reply;render();message(data.warning||(!data.connected?'The owner needs to complete the one-time connection below.':'Choose an update or check the current job.'),!!data.warning);}catch(e){if(request===generation)message(e.message,true);}finally{loading=false;controls();schedule();}}
 async function work(name,input){if(busy)return;++generation;busy=true;clearTimeout(timer);controls();message(name==='startDiscordGithub'?'Requesting a start…':name==='commandDiscordGithub'?({pause:'Requesting pause…',run:'Requesting resume…',stop:'Requesting finish…'}[input.command]||'Saving command…'):'Saving connection…');try{data=await rpc(name,input);render();message(data.warning||'Request recorded. Waiting for the runner acknowledgement where needed.',!!data.warning);}catch(e){message(e.message,true);}finally{busy=false;controls();schedule();}}
 function start(kind){const season=el('season').value.trim();if(!/^\d{1,4}(?:\.5)?$/.test(season)){message('Enter the season number first.',true);el('season').focus();return;}work('startDiscordGithub',{kind,season,includeExisting:kind==='draft'&&el('catchup').checked});}
 el('refresh').addEventListener('click',load);el('start').addEventListener('click',()=>start(el('mode').value));document.querySelectorAll('[data-dcg-board]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.dcgBoard)));
 el('mode').addEventListener('change',()=>{const real=el('mode').value==='draft';el('catchup-label').hidden=!real;el('start').textContent=real?'Start announcements':'Start practice';el('draft-help').textContent=real?'Confirmed picks are checked every five minutes. Pause, resume and finish show as pending until the runner acknowledges them. The job ends after four hours.':'Practice lasts up to 20 minutes and sends an example once a minute. You can pause or finish at any time.';});
 for(const [id,command] of [['pause','pause'],['resume','run'],['finish','stop']])el(id).addEventListener('click',()=>{if(data?.job)work('commandDiscordGithub',{id:data.job.id,revision:data.job.revision,command});});
 el('connect').addEventListener('click',async()=>{if(busy)return;const token=el('token').value;el('token').value='';await work('connectDiscordGithub',{token});});
 function applicationControls(){el('app-toggle').disabled=appBusy||!appData;el('app-refresh').disabled=appBusy;el('app-test').disabled=appBusy||!data?.connected;el('app-retry').disabled=appBusy;el('app-channel').disabled=appBusy;}
 function renderApplications(){
  const a=appData;el('app-state').textContent=(a.enabled?'On':'Off')+' · '+(a.issue||a.setupIssue||(a.enabled?'New applications will be announced in Discord.':'No application messages are being sent.'));el('app-state').style.color=a.issue?'var(--red)':'';
  el('app-recipient').textContent=a.recipient?'Discord tag: '+a.recipient.name+' · Head of Allocations':'Set the Head of Allocations and their numeric Discord user ID in Staff access.';
  if(document.activeElement!==el('app-channel'))el('app-channel').value=a.channelUrl||'';el('app-toggle').textContent=a.enabled?'Pause Discord messages':'Enable Discord messages';el('app-retry').hidden=!(a.inFlight&&a.issue);
  const test=a.privateTest;el('app-history').textContent='Last background check: '+when(a.lastCheck)+' · Last delivery: '+when(a.lastDelivery)+(a.inFlight?' · One message batch waiting for delivery.':'')+(a.pending?' · '+a.pending+' new arrivals queued.':'')+(test?' · Private example: '+(test.phase||'start requested')+'.':'');applicationControls();
 }
 async function applicationWork(name,input){if(appBusy)return;appBusy=true;applicationControls();el('app-state').textContent=name==='testDiscordApplicationAlert'?'Starting a private Discord example…':'Checking application messages…';try{appData=await rpc(name,...(input===undefined?[]:[input]));renderApplications();}catch(e){el('app-state').textContent=e.message;el('app-state').style.color='var(--red)';}finally{appBusy=false;applicationControls();}}
 function loadApplications(){return applicationWork('getDiscordApplicationAlerts');}
 el('applications').addEventListener('toggle',()=>{if(el('applications').open&&!appLoaded){appLoaded=true;loadApplications();}});
 el('app-refresh').addEventListener('click',loadApplications);el('app-toggle').addEventListener('click',()=>applicationWork('saveDiscordApplicationAlerts',{revision:appData?.revision||'',enabled:!appData?.enabled,channelId:el('app-channel').value.trim()}));el('app-test').addEventListener('click',()=>applicationWork('testDiscordApplicationAlert'));el('app-retry').addEventListener('click',()=>applicationWork('retryDiscordApplicationAlert'));
 window.F1XLNavigation?.register('discord-control',()=>busy||!!el('token').value);
 return {load};
})();
</script>
