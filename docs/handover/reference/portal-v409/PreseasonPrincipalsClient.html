<script>
window.F1XLPreseasonPrincipals=(function(){
  if(window.F1XLNavigation)window.F1XLNavigation.register('preseason-principals',()=>state.dirty||hasVotes(),()=> ({season:state.season}));

  const state={season:'',data:null,selection:null,apps:null,busy:false,dirty:false,count:0,teams:[],changes:{},tab:'applications',review:null};
  function el(id){return document.getElementById(id);}
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function status(text){el('ppt-status').textContent=text;}
  function hasVotes(){return Object.keys(state.changes).length>0;}
  function canLeave(){return !state.dirty&&!hasVotes()||window.confirm('Discard unsaved team principal or vote changes?');}
  function requireSaved(){if(state.dirty||hasVotes()){status('Save your team or vote changes first, or Refresh to discard them.');return false;}return true;}
  function busy(value){state.busy=value;el('ppt-fields').disabled=value||!state.data||!state.selection;el('ppt-refresh').disabled=value;el('ppt-back').disabled=value;document.querySelectorAll('#ppt-app-dialog button,#ppt-voters-dialog button').forEach(function(b){b.disabled=value;});}
  function rpc(name,input){return new Promise(function(resolve,reject){
    const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    if(typeof runner[name]!=='function'){
      const file=['getPreseasonPrincipals','savePreseasonPrincipals'].includes(name)?'PreseasonPrincipalsService.gs':'PreseasonPrincipalSelectionService.gs';
      reject(new Error('The deployed app is missing '+name+'. Check that '+file+' is saved as a Script file in this Apps Script project, then deploy a New version and reload the app.'));return;
    }
    runner[name](input);
  });}
  function applyTeams(data){state.data=data;state.count=data.count;state.teams=data.teams.map(function(t){return Object.assign({},t);});state.dirty=false;}
  async function load(){if(state.busy)return;busy(true);status('Loading team principal selection…');try{const data=await rpc('getPreseasonPrincipals',state.season),selection=await rpc('getPreseasonPrincipalSelection',state.season);applyTeams(data);state.selection=selection;state.changes={};render();status('Ready. Start by reviewing applications.');}catch(e){status(e.message||'Unable to load this section.');}finally{busy(false);}if(state.selection)loadApplications(false);}
  function open(season){if(state.busy)return;if(state.season!==season){if(!canLeave())return;state.season=season;state.data=null;state.selection=null;state.apps=null;state.dirty=false;state.changes={};state.tab='applications';el('ppt-content').hidden=true;el('ppt-master').hidden=true;}window.F1XLNavigate('preseason-principals');el('ppt-title').textContent='S'+season+' Team principals';el('ppt-back').textContent='← S'+season+' Pre-season';if(!state.data||!state.selection)load();}
  function options(list,value,placeholder){const values=list.slice();if(value&&!values.includes(value))values.unshift(value);return '<option value="">'+esc(placeholder)+'</option>'+values.map(function(v){return '<option value="'+esc(v)+'"'+(v===value?' selected':'')+'>'+esc(v)+'</option>';}).join('');}
  function showTab(tab){state.tab=tab;['applications','voting','confirmed'].forEach(function(name){el('ppt-'+name).hidden=name!==tab;el('ppt-tab-'+name).setAttribute('aria-selected',String(name===tab));});}
  function render(){const data=state.data;el('ppt-content').hidden=false;el('ppt-master').hidden=false;el('ppt-master').href=data.url;el('ppt-date').textContent='Planned announcement: '+data.announcementDate+(data.announcementTime?' at '+data.announcementTime+' UK':'')+'. Edit this in Season dates.';el('ppt-count').innerHTML='<option value="0">Undecided</option>'+Array.from({length:data.maxTeams},function(_,i){return '<option value="'+(i+1)+'">'+(i+1)+'</option>';}).join('');el('ppt-count').value=String(state.count);renderTeams();renderVotes();renderApps();showTab(state.tab);}
  function renderTeams(){const accepted=state.selection.candidates.map(function(a){return a.gamertag;});el('ppt-teams').innerHTML=state.teams.slice(0,state.count).map(function(t,i){const app=state.selection.candidates.find(function(a){return a.gamertag===t.principal;});return '<div class="ppt-team"><span class="secondary-line">Team '+(i+1)+'</span><label>Team<select data-ppt-team="'+i+'" data-field="team">'+options(state.data.options.teams,t.team,'Choose team')+'</select></label><label>Winning principal<select data-ppt-team="'+i+'" data-field="principal">'+options(accepted,t.principal,'Choose accepted candidate')+'</select><small>'+esc(app?'Preferences: '+app.preferences.filter(Boolean).join(' → '):t.principal?'Existing saved assignment':'')+'</small></label><label>Team type<select data-ppt-team="'+i+'" data-field="type">'+options(['Full team','Free agent team'],t.type,'To be confirmed')+'</select></label></div>';}).join('')||'<p class="secondary-line">Choose the number of teams when you are ready.</p>';el('ppt-team-note').textContent=state.dirty?'Unsaved team changes.':state.data.ready?'Saved team assignments are complete.':state.data.missing.join(' ');}
  function renderApps(){if(!state.apps)return;const filter=el('ppt-app-filter').value,search=el('ppt-app-search').value.trim().toLowerCase(),apps=state.apps.applications.filter(function(a){return (filter==='All'||a.decision===filter)&&a.gamertag.toLowerCase().includes(search);});el('ppt-tab-applications').textContent='Applications ('+state.apps.applications.filter(function(a){return a.decision==='Pending'||a.changed;}).length+')';el('ppt-app-rows').innerHTML=apps.map(function(a){return '<tr><td>'+esc(a.received)+'</td><td><button class="name-button" type="button" data-ppt-review="'+esc(a.key)+'">'+esc(a.gamertag)+'</button>'+(a.changed?'<small> · Response changed since review</small>':'')+(a.sourceMissing?'<small> · Saved copy</small>':'')+'</td><td><span'+(a.decision==='Accepted'?' class="ppt-accepted"':'')+'>'+esc(a.decision)+'</span></td><td>'+esc(a.preferences[0]||'—')+'</td></tr>';}).join('');el('ppt-app-empty').hidden=apps.length!==0;}
  async function loadApplications(refresh){if(state.busy)return;if(refresh&&!requireSaved())return;busy(true);el('ppt-app-source').textContent='Loading staff applications…';try{const data=await rpc('getPreseasonPrincipalApplications',{season:state.season,refresh:refresh});state.apps=data;state.selection=data.selection;renderTeams();renderVotes();el('ppt-app-source').textContent='Source: '+data.sourceName+'. Decisions are saved separately for S'+state.season+'.';renderApps();}catch(e){el('ppt-app-source').textContent=(e.message||'Unable to load applications.')+' Use Refresh applications to retry.';}finally{busy(false);}}
  function openReview(key){if(state.busy)return;const app=(state.apps&&state.apps.applications||[]).find(function(a){return a.key===key;})||state.selection.applications.find(function(a){return a.key===key;});if(!app)return;state.review=app;el('ppt-app-title').textContent=app.gamertag;el('ppt-app-meta').textContent=app.received+' · '+app.decision+' for S'+state.season;el('ppt-app-details').innerHTML=app.answers.map(function(a){return '<dt>'+esc(a.question)+'</dt><dd>'+esc(a.answer)+'</dd>';}).join('')||'<p>No answers recorded.</p>';el('ppt-app-dialog-status').textContent=app.changed?'The source response changed since the previous review. Accept again to update the saved candidate details.':'';document.querySelectorAll('[data-ppt-decision]').forEach(function(b){b.hidden=b.dataset.pptDecision===app.decision&&!app.changed;});el('ppt-app-dialog').showModal();}
  async function review(decision){if(state.busy||!state.review)return;if(!requireSaved()){el('ppt-app-dialog-status').textContent='Save your outstanding votes or team changes before changing candidate decisions.';return;}busy(true);el('ppt-app-dialog-status').textContent='Saving decision…';try{const app=state.review,result=await rpc('reviewPreseasonPrincipalApplication',{season:state.season,revision:state.selection.revision,key:app.key,sourceRevision:app.sourceRevision,decision:decision});state.selection=result;if(state.apps){const local=state.apps.applications.find(function(a){return a.key===app.key;});if(local){local.decision=decision;local.changed=false;}}render();el('ppt-app-dialog').close();status(result.message);window.F1XLStaffAttention?.refresh();}catch(e){el('ppt-app-dialog-status').textContent=e.message||'Unable to save decision.';}finally{busy(false);}}
  function voteValue(app,voter){const key=JSON.stringify([app.key,voter]);return state.changes[key]?state.changes[key].vote:app.votes[voter]||'';}
  function totals(app){let score=0,answered=0;state.selection.voters.forEach(function(v){const vote=voteValue(app,v);if(vote){answered++;score+=vote==='Yes'?1:vote==='Maybe'?0.5:0;}});return {score:score,answered:answered};}
  function renderVotes(){const data=state.selection;el('ppt-vote-head').innerHTML='<tr><th>Candidate / team preferences</th>'+data.voters.map(function(v){return '<th>'+esc(v)+'</th>';}).join('')+'<th>Total</th><th>Votes entered</th></tr>';el('ppt-vote-rows').innerHTML=data.candidates.map(function(app){const t=totals(app);return '<tr><td><button type="button" class="name-button" data-ppt-review="'+esc(app.key)+'">'+esc(app.gamertag)+'</button><small style="display:block">'+app.preferences.map(function(p,i){return esc((i+1)+'. '+(p||'—'));}).join('<br>')+'</small></td>'+data.voters.map(function(v){const value=voteValue(app,v);return '<td><select aria-label="'+esc(v+' vote for '+app.gamertag)+'" data-ppt-vote="'+esc(app.key)+'" data-voter="'+esc(v)+'">'+options(['Yes','Maybe','No'],value,'Not voted')+'</select></td>';}).join('')+'<td data-ppt-total="'+esc(app.key)+'">'+t.score+'</td><td data-ppt-answered="'+esc(app.key)+'">'+t.answered+' / '+data.voters.length+'</td></tr>';}).join('');el('ppt-vote-summary').textContent=!data.candidates.length?'Accept applications for consideration to add candidates here.':!data.voters.length?'Set the voter columns to begin.':data.candidates.length+' candidates · '+data.voters.length+' named voters. Winners and team assignments are confirmed separately.';el('ppt-votes-save').disabled=!hasVotes();}
  async function saveVotes(){if(state.busy||!hasVotes())return;busy(true);status('Saving votes…');try{state.selection=await rpc('savePreseasonPrincipalVotes',{season:state.season,revision:state.selection.revision,changes:Object.values(state.changes)});state.changes={};renderVotes();status(state.selection.message);}catch(e){status(e.message||'Unable to save votes.');}finally{busy(false);}}
  async function saveVoters(){if(state.busy)return;busy(true);el('ppt-voters-status').textContent='Saving voter columns…';try{state.selection=await rpc('savePreseasonPrincipalVoters',{season:state.season,revision:state.selection.revision,voters:el('ppt-voters-input').value.split('\n').map(function(v){return v.trim();}).filter(Boolean)});renderVotes();el('ppt-voters-dialog').close();status(state.selection.message);}catch(e){el('ppt-voters-status').textContent=e.message||'Unable to save columns.';}finally{busy(false);}}
  async function saveTeams(){if(state.busy)return;if(hasVotes()){status('Save your votes before confirming team assignments.');return;}busy(true);status('Saving teams to Season Master…');try{applyTeams(await rpc('savePreseasonPrincipals',{season:state.season,revision:state.data.revision,selectionRevision:state.selection.revision,count:state.count,teams:state.teams}));renderTeams();status(state.data.message);}catch(e){status(e.message||'Unable to save teams.');}finally{busy(false);}}
  el('ppt-tabs').addEventListener('click',function(e){const b=e.target.closest('[data-ppt-tab]');if(b)showTab(b.dataset.pptTab);});
  el('ppt-count').addEventListener('change',function(){const count=Number(this.value);if(count<state.count&&state.teams.slice(count).some(function(t){return t.team||t.principal||t.type;})){this.value=String(state.count);status('Clear and save unused team slots before reducing the count.');return;}state.count=count;state.dirty=true;renderTeams();});
  el('ppt-teams').addEventListener('change',function(e){const t=e.target;if(!t.matches('[data-ppt-team]'))return;state.teams[Number(t.dataset.pptTeam)][t.dataset.field]=t.value;state.dirty=true;renderTeams();status('Unsaved team changes.');});
  el('ppt-vote-rows').addEventListener('change',function(e){const target=e.target;if(!target.matches('[data-ppt-vote]'))return;const app=state.selection.candidates.find(function(a){return a.key===target.dataset.pptVote;}),voter=target.dataset.voter,key=JSON.stringify([app.key,voter]);if(target.value===(app.votes[voter]||''))delete state.changes[key];else state.changes[key]={key:app.key,voter:voter,vote:target.value};const t=totals(app),row=target.closest('tr');row.querySelector('[data-ppt-total]').textContent=t.score;row.querySelector('[data-ppt-answered]').textContent=t.answered+' / '+state.selection.voters.length;el('ppt-votes-save').disabled=!hasVotes();status(hasVotes()?'Unsaved votes. Totals shown include your edits.':'No unsaved vote changes.');});
  ['ppt-app-rows','ppt-vote-rows'].forEach(function(id){el(id).addEventListener('click',function(e){const b=e.target.closest('[data-ppt-review]');if(b)openReview(b.dataset.pptReview);});});
  el('ppt-app-dialog').addEventListener('click',function(e){const b=e.target.closest('[data-ppt-decision]');if(b)review(b.dataset.pptDecision);});
  el('ppt-app-close').addEventListener('click',function(){el('ppt-app-dialog').close();});
  el('ppt-app-search').addEventListener('input',renderApps);el('ppt-app-filter').addEventListener('change',renderApps);el('ppt-app-refresh').addEventListener('click',function(){loadApplications(true);});
  el('ppt-voters-edit').addEventListener('click',function(){if(!requireSaved())return;el('ppt-voters-input').value=state.selection.voters.join('\n');el('ppt-voters-status').textContent='';el('ppt-voters-dialog').showModal();});
  el('ppt-voters-close').addEventListener('click',function(){el('ppt-voters-dialog').close();});el('ppt-voters-save').addEventListener('click',saveVoters);el('ppt-votes-save').addEventListener('click',saveVotes);el('ppt-save').addEventListener('click',saveTeams);
  el('ppt-refresh').addEventListener('click',function(){if(canLeave())load();});el('ppt-back').addEventListener('click',function(){window.F1XLPreseasonHub.open(state.season);});
  ['ppt-app-dialog','ppt-voters-dialog'].forEach(function(id){el(id).addEventListener('cancel',function(e){if(state.busy)e.preventDefault();});});
  return {open:open};
})();
</script>
