<script>
window.F1XLPreseasonPlacement=(function(){
  if(window.F1XLNavigation)window.F1XLNavigation.register('preseason-placement',()=>state.dirty,()=> ({season:state.season}));

  const state={season:'',data:null,drivers:[],divisions:[],selected:'',busy:false,dirty:false,undo:[],tab:'board'};
  const el=id=>document.getElementById(id),clone=v=>JSON.parse(JSON.stringify(v));
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function status(v){el('ppl-status').textContent=v;}
  function driver(id){return state.drivers.find(d=>d.driverId===id);}
  function commitment(d){return d.placement.commitmentOverride||d.sourceCommitment;}
  function badge(d){const c=commitment(d);return '<span class="ppl-badge '+(c==='No'?'ppl-pt':c==='Maybe'?'ppl-maybe':'')+'">'+(c==='No'?'PT':c==='Maybe'?'Maybe':c==='Yes'?'FT':'?')+'</span>';}
  function number(n){return n==null?'—':Number(n).toFixed(3);}
  function changed(){state.dirty=true;status('Unsaved placement changes');el('ppl-state').textContent='Draft · unsaved';el('ppl-undo').disabled=!state.undo.length;}
  function remember(){state.undo.push({drivers:clone(state.drivers),divisions:clone(state.divisions)});if(state.undo.length>30)state.undo.shift();}
  function canLeave(){return !state.dirty||window.confirm('Discard unsaved placement changes?');}
  function busy(v){closeMenu();state.busy=v;el('ppl-fields').disabled=v||!state.data;['ppl-save','ppl-confirm','ppl-refresh','ppl-back'].forEach(id=>{el(id).disabled=v||(!state.data&&id!=='ppl-refresh'&&id!=='ppl-back');});}
  function rpc(name,input){if(state.busy)return;busy(true);status(name==='getPreseasonPlacement'?'Loading TT results and placement decisions…':'Saving placement decisions…');google.script.run.withSuccessHandler(data=>{state.data=data;state.drivers=clone(data.drivers);state.divisions=clone(data.divisions);state.undo=[];state.dirty=false;busy(false);render();renderDetails();status(data.message||'Click or right-click a name for actions. Choose an empty slot or a reserve tier; dragging works too.');}).withFailureHandler(error=>{busy(false);status(error.message||'Unable to load or save placements.');})[name](input);}
  function open(season){if(state.busy)return;closeMenu();if(state.season!==season){if(!canLeave())return;state.season=season;setTab('board');el('ppl-tt-search').value='';state.data=null;state.selected='';state.dirty=false;el('ppl-content').hidden=true;el('ppl-master').hidden=true;}window.F1XLNavigate('preseason-placement');el('ppl-title').textContent='S'+season+' Placement';el('ppl-back').textContent='← S'+season+' Pre-season';if(!state.data)rpc('getPreseasonPlacement',season);}
  function render(){if(!state.data)return;el('ppl-content').hidden=false;el('ppl-master').hidden=false;el('ppl-master').href=state.data.url;el('ppl-state').textContent=state.dirty?'Draft · unsaved':state.data.state;el('ppl-source-notices').textContent=state.data.warnings.join(' ');el('ppl-review-notice').hidden=state.data.state!=='Review needed';el('ppl-undo').disabled=!state.undo.length;renderRoster();renderBoard();renderTrials();counts();}
  function counts(){const count=decision=>state.drivers.filter(d=>d.placement.decision===decision).length;el('ppl-counts').textContent=state.drivers.length+' drivers · '+count('Placed')+' placed · '+count('Unassigned')+' unassigned · '+count('Reserve')+' reserves ('+state.drivers.filter(d=>d.placement.decision==='Reserve'&&!d.placement.division).length+' need division/tier) · '+count('Not selected')+' not selected';}
  function renderRoster(){el('ppl-track-one-head').textContent=state.data.tracks[0]||'Track 1';el('ppl-track-two-head').textContent=state.data.tracks[1]||'Track 2';const query=el('ppl-search').value.trim().toLowerCase(),filter=el('ppl-filter').value;const rows=state.drivers.filter(d=>(d.gamertag+' '+d.driverId).toLowerCase().includes(query)&&(filter==='all'||filter==='PT'&&commitment(d)==='No'||filter==='Maybe'&&commitment(d)==='Maybe'||filter==='review'&&!(d.trial&&d.trial.rank)||d.placement.decision===filter));
    el('ppl-roster-count').textContent=rows.length+' shown';el('ppl-roster').innerHTML=rows.map(d=>{const t=d.trial,p=d.placement;return '<tr class="'+(commitment(d)==='No'?'ppl-part-time ':'')+(d.driverId===state.selected?'ppl-selected-row':'')+'"><td>'+esc(t&&t.rank||'—')+'</td><td><button type="button" draggable="true" class="name-button" data-ppl-driver="'+esc(d.driverId)+'">'+esc(d.gamertag)+'</button> '+badge(d)+'<span class="secondary-line">'+(p.decision==='Placed'?'D'+p.division+' · T'+p.tier+' · '+p.slot:p.decision==='Reserve'?(p.division?'D'+p.division+' · T'+p.tier+' · Reserve':'Reserve · needs division/tier'):esc(p.decision))+'</span></td><td>'+number(t&&t.averageOne)+'</td><td>'+number(t&&t.averageTwo)+'</td><td><strong>'+number(t&&t.overall)+'</strong>'+(!(t&&t.rank)?'<span class="secondary-line">'+(t&&t.overall!=null?'Partial':'No TT')+'</span>':'')+'</td></tr>';}).join('')||'<tr><td colspan="5">'+(state.drivers.length?'No matching drivers.':'Drivers appear automatically from the season tracker and time-trial queue.')+'</td></tr>';}
  function setTab(tab){
    state.tab=tab;closeMenu();el('ppl-driver-details').hidden=true;
    ['board','trials'].forEach(key=>{const active=key===tab;el('ppl-panel-'+key).hidden=!active;el('ppl-tab-'+key).setAttribute('aria-selected',String(active));el('ppl-tab-'+key).tabIndex=active?0:-1;});
    if(tab==='trials'&&state.data)renderTrials();
  }
  el('ppl-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-ppl-tab]');if(b)setTab(b.dataset.pplTab);});
  el('ppl-tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const tab=e.key==='Home'?'board':e.key==='End'?'trials':state.tab==='board'?'trials':'board';setTab(tab);el('ppl-tab-'+tab).focus();});
  function hasTime(value){return value!==null&&value!==undefined&&value!==''&&Number.isFinite(Number(value));}
  function trialTime(value){return hasTime(value)?Number(value).toFixed(3):'—';}
  function trialScore(d){return hasTime(d.trial.overall)?Math.round(Number(d.trial.overall)*1000000)/1000000:Infinity;}
  function trialDate(value){if(!value)return '—';const date=new Date(value);return Number.isNaN(date.getTime())?String(value):date.toLocaleString('en-GB',{timeZone:'Europe/London'});}
  function renderTrials(){
    if(!state.data)return;
    const trackNames=state.data.tracks.map((v,i)=>v||'Track '+(i+1));
    const fixed=['Driver','Status','Overall avg','Completed rank','Gap'];
    const detail=['Booking (UK)','Admin','Completed (UK)','Platform / controller','TT notes'];
    el('ppl-tt-head').innerHTML='<tr>'+fixed.map((v,i)=>'<th scope="col" rowspan="2"'+(!i?' class="ppl-tt-name"':'')+'>'+v+'</th>').join('')+trackNames.map(v=>'<th scope="colgroup" colspan="6">'+esc(v)+'</th>').join('')+detail.map(v=>'<th scope="col" rowspan="2">'+v+'</th>').join('')+'</tr><tr>'+[1,2].map(()=>[1,2,3,4,5].map(l=>'<th scope="col">Lap '+l+(l===1?' *':'')+'</th>').join('')+'<th scope="col">Average</th>').join('')+'</tr>';
    const query=el('ppl-tt-search').value.trim().toLowerCase(),all=state.drivers.filter(d=>d.trial);
    const rows=all.filter(d=>(d.gamertag+' '+d.driverId).toLowerCase().includes(query)).sort((a,b)=>trialScore(a)-trialScore(b)||a.gamertag.localeCompare(b.gamertag));
    el('ppl-tt-count').textContent=rows.length+' of '+all.length+' time trials';
    el('ppl-tt-rows').innerHTML=rows.map(d=>{
      const t=d.trial;
      const lapCells=(laps,average,track)=>{const values=laps.filter(hasTime).map(Number),best=values.length?Math.min(...values):null;return Array.from({length:5},(_,i)=>{const value=laps[i],fastest=hasTime(value)&&Number(value)===best;return '<td'+(fastest?' class="ppl-best-lap" title="'+esc(track)+': this driver’s fastest lap" aria-label="Lap '+(i+1)+', '+trialTime(value)+', fastest for this driver at '+esc(track)+'"':'')+'>'+trialTime(value)+'</td>';}).join('')+'<td><strong>'+trialTime(average)+'</strong></td>';};
      return '<tr data-ppl-trial="'+esc(d.driverId)+'" class="'+(commitment(d)==='No'?'ppl-part-time ':'')+(state.selected===d.driverId?'ppl-selected-row':'')+'"><td class="ppl-tt-name"><button type="button" class="name-button" data-ppl-driver="'+esc(d.driverId)+'">'+esc(d.gamertag)+'</button> '+badge(d)+'</td><td class="ppl-tt-text">'+esc(t.status)+'</td><td><strong>'+trialTime(t.overall)+'</strong>'+(hasTime(t.overall)&&!(t.complete&&t.ready)?'<span class="secondary-line">Provisional</span>':'')+'</td><td>'+esc(t.rank||'—')+'</td><td>'+trialTime(t.gap)+'</td>'+lapCells(t.one,t.averageOne,trackNames[0])+lapCells(t.two,t.averageTwo,trackNames[1])+'<td class="ppl-tt-text">'+esc([t.date,t.time].filter(Boolean).join(' ')||'—')+'</td><td class="ppl-tt-text">'+esc(t.admin||'—')+'</td><td class="ppl-tt-text">'+esc(trialDate(t.completedAt))+'</td><td class="ppl-tt-text">'+esc([d.application.platform,d.application.controller].filter(Boolean).join(' / ')||'—')+'</td><td class="ppl-tt-text ppl-tt-notes">'+esc(t.notes||'—')+'</td></tr>';
    }).join('')||'<tr><td colspan="22">'+(all.length?'No matching drivers.':'Time trials appear after applications are processed into the queue.')+'</td></tr>';
  }
  el('ppl-tt-search').addEventListener('input',renderTrials);
  el('ppl-tt-rows').addEventListener('click',e=>{const b=e.target.closest('[data-ppl-driver]');if(b)openMenu(b.dataset.pplDriver,e);});
  function renderBoard(){el('ppl-board').innerHTML=state.divisions.map((d,i)=>{const placed=state.drivers.filter(p=>p.placement.decision==='Placed'&&p.placement.division===d.number);return '<section class="ppl-division" style="--division-accent:'+['#e2ba69','#b7a4df','#83bcdd','#e49696','#81c6a6','#a8c67f','#d9a3ce','#83c9c9'][i]+'"><header><h2>Division '+d.number+'</h2><span>'+placed.length+' / '+(d.tierOne+d.tierTwo)+'</span></header><div class="ppl-tiers">'+[1,2].map(t=>{const capacity=t===1?d.tierOne:d.tierTwo,used=placed.filter(p=>p.placement.tier===t).length;return '<div><label class="ppl-tier-title">Tier '+t+' · '+used+'/'+capacity+'<input type="number" min="0" max="'+state.data.maxTierSlots+'" value="'+capacity+'" data-ppl-capacity="'+d.number+'" data-tier="'+t+'" aria-label="Division '+d.number+' tier '+t+' slots"></label>'+Array.from({length:capacity},(_,s)=>{const occupant=placed.find(p=>p.placement.tier===t&&p.placement.slot===s+1);return '<button type="button" class="ppl-slot '+(occupant&&commitment(occupant)==='No'?'ppl-part-time ':'')+(occupant&&occupant.driverId===state.selected?'ppl-selected-row':'')+'" data-ppl-slot="'+d.number+'/'+t+'/'+(s+1)+'"'+(occupant?' draggable="true" data-ppl-drag="'+esc(occupant.driverId)+'"':'')+' aria-label="Division '+d.number+', tier '+t+', slot '+(s+1)+(occupant?', '+esc(occupant.gamertag):', empty')+'"><span class="ppl-slot-number">'+(s+1)+'</span>'+(occupant?'<span>'+esc(occupant.gamertag)+' '+badge(occupant)+'<small>'+number(occupant.trial&&occupant.trial.overall)+'</small></span>':'<span class="secondary-line">Empty slot</span>')+'</button>';}).join('')+'</div>';}).join('')+'</div>'+renderReserves(d)+'</section>';}).join('')||'<div class="notice">Add your first proposed division. You can adjust the number of divisions and tier sizes during the meeting.</div>';el('ppl-add-division').disabled=state.divisions.length>=state.data.maxDivisions;el('ppl-remove-division').disabled=!state.divisions.length;}
  function renderReserves(division){
    const reserves=state.drivers.filter(d=>d.placement.decision==='Reserve'&&d.placement.division===division.number);
    return '<section class="ppl-reserves"><h3>Reserves · '+reserves.length+'</h3><p class="secondary-line">Additional to the main grid</p><div class="ppl-tiers">'+[1,2].map(t=>'<div><h4>Tier '+t+'</h4>'+reserves.filter(d=>d.placement.tier===t).map(d=>'<button type="button" draggable="true" class="ppl-slot '+(commitment(d)==='No'?'ppl-part-time ':'')+(d.driverId===state.selected?'ppl-selected-row':'')+'" data-ppl-driver="'+esc(d.driverId)+'">'+esc(d.gamertag)+' '+badge(d)+'</button>').join('')+'<button type="button" class="ppl-slot ppl-reserve-target" data-ppl-reserve-target="'+division.number+'/'+t+'" aria-label="Add selected driver to Division '+division.number+' tier '+t+' reserves">+ Add reserve</button></div>').join('')+'</div></section>';
  }
  function reserve(id,key){
    if(state.busy)return;const d=driver(id),[division,tier]=key.split('/').map(Number);
    if(!d||!state.divisions.some(v=>v.number===division)||![1,2].includes(tier))return;
    closeMenu();remember();Object.assign(d.placement,{decision:'Reserve',division,tier,slot:0});state.selected='';changed();render();renderDetails();status('Assigned to Division '+division+', Tier '+tier+' reserves.');
  }
  function closeMenu(){el('ppl-driver-menu').hidden=true;}
  function openMenu(id,event){
    if(state.busy)return;select(id);const d=driver(id),menu=el('ppl-driver-menu');if(!d)return;
    el('ppl-menu-name').textContent=d.gamertag;el('ppl-menu-division').innerHTML=state.divisions.map(v=>'<option value="'+v.number+'">Division '+v.number+'</option>').join('');
    if(d.placement.division)el('ppl-menu-division').value=String(d.placement.division);
    el('ppl-menu-tier').value=String(d.placement.tier||1);
    ['ppl-menu-place','ppl-menu-reserve'].forEach(id=>el(id).disabled=!state.divisions.length);
    menu.hidden=false;const x=event&&event.clientX||20,y=event&&event.clientY||100;
    menu.style.left=Math.max(8,Math.min(x,window.innerWidth-menu.offsetWidth-8))+'px';menu.style.top=Math.max(8,Math.min(y,window.innerHeight-menu.offsetHeight-8))+'px';el('ppl-menu-close').focus();
  }
  el('ppl-menu-close').addEventListener('click',()=>{closeMenu();const b=Array.from(el(state.tab==='trials'?'ppl-tt-rows':'ppl-roster').querySelectorAll('[data-ppl-driver]')).find(b=>b.dataset.pplDriver===state.selected);if(b)b.focus();});
  el('ppl-menu-details').addEventListener('click',()=>{closeMenu();el('ppl-driver-details').hidden=false;renderDetails();el('ppl-close-details').focus();});
  el('ppl-menu-reserve').addEventListener('click',()=>reserve(state.selected,el('ppl-menu-division').value+'/'+el('ppl-menu-tier').value));
  el('ppl-menu-place').addEventListener('click',()=>{
    const division=Number(el('ppl-menu-division').value),tier=Number(el('ppl-menu-tier').value),d=state.divisions.find(v=>v.number===division);if(!d)return;
    const capacity=tier===1?d.tierOne:d.tierTwo;
    const slot=Array.from({length:capacity},(_,i)=>i+1).find(s=>!state.drivers.some(v=>v.placement.decision==='Placed'&&v.placement.division===division&&v.placement.tier===tier&&v.placement.slot===s));
    if(!slot){status('That tier is full. Choose another tier, adjust its capacity, or drag onto an occupied slot to swap.');return;}
    move(state.selected,division+'/'+tier+'/'+slot);
  });
  el('ppl-menu-unassign').addEventListener('click',()=>setDecision('Unassigned'));el('ppl-menu-not-selected').addEventListener('click',()=>setDecision('Not selected'));
  document.addEventListener('click',e=>{if(!e.target.closest('#ppl-driver-menu,[data-ppl-driver],[data-ppl-drag]'))closeMenu();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!el('ppl-driver-menu').hidden){e.preventDefault();el('ppl-menu-close').click();}});
  el('ppl-fields').addEventListener('contextmenu',e=>{const b=e.target.closest('[data-ppl-driver],[data-ppl-drag]');if(b){e.preventDefault();openMenu(b.dataset.pplDriver||b.dataset.pplDrag,e);}});
  function select(id){state.selected=id;renderRoster();renderBoard();renderTrials();counts();if(!el('ppl-driver-details').hidden)renderDetails();}
  function move(id,key){if(state.busy)return;closeMenu();const d=driver(id);if(!d)return;const [division,tier,slot]=key.split('/').map(Number),target=state.divisions.find(v=>v.number===division);if(!target||slot<1||slot>(tier===1?target.tierOne:target.tierTwo))return;const other=state.drivers.find(p=>p.placement.decision==='Placed'&&p.placement.division===division&&p.placement.tier===tier&&p.placement.slot===slot);if(other===d){select(id);return;}remember();const previous={decision:d.placement.decision,division:d.placement.division,tier:d.placement.tier,slot:d.placement.slot};if(other)Object.assign(other.placement,previous.decision==='Placed'?previous:{decision:'Unassigned',division:0,tier:0,slot:0});Object.assign(d.placement,{decision:'Placed',division,tier,slot});state.selected='';changed();render();renderDetails();status(other?(previous.decision==='Placed'?'Drivers swapped.':'Driver placed; previous occupant returned to Unassigned.'):'Driver placed.');}
  function setDecision(decision){const d=driver(state.selected);if(!d||state.busy)return;closeMenu();remember();Object.assign(d.placement,{decision,division:0,tier:0,slot:0});changed();render();renderDetails();}
  function renderDetails(){const d=driver(state.selected);if(!d){el('ppl-driver-details').hidden=true;return;}if(el('ppl-driver-details').hidden)return;const t=d.trial;el('ppl-driver-heading').innerHTML=esc(d.gamertag)+' '+badge(d);el('ppl-driver-facts').textContent=d.driverId+' · '+(d.sourcePresent?'':'Source missing · ')+(d.previousSeason?'Previous: S'+d.previousSeason+' D'+(d.previousDivision||'?')+' · ':'')+(t?'TT: '+t.status+' · '+number(t.averageOne)+' / '+number(t.averageTwo)+' · Overall '+number(t.overall):'No TT entry yet');el('ppl-application').textContent='Application commitment: '+(d.application.commitment||'Unknown')+'\nReason: '+(d.application.reason||'—')+'\nSunday start: '+(d.application.sunday||'Unknown')+'\nPlatform / controller: '+(d.application.platform||'—')+' / '+(d.application.controller||'—')+'\nTracker notes: '+(d.trackerNotes||'—')+'\nTT notes: '+(t&&t.notes||'—')+'\n'+state.data.tracks[0]+' laps: '+(t?t.one.map(v=>v===''?'—':v).join(', '):'—')+'\n'+state.data.tracks[1]+' laps: '+(t?t.two.map(v=>v===''?'—':v).join(', '):'—');el('ppl-social-notes').value=d.placement.socialNotes;el('ppl-placement-notes').value=d.placement.notes;el('ppl-commitment').value=d.placement.commitmentOverride;}
  el('ppl-roster').addEventListener('click',e=>{const b=e.target.closest('[data-ppl-driver]');if(b)openMenu(b.dataset.pplDriver,e);});
  el('ppl-board').addEventListener('click',e=>{const name=e.target.closest('[data-ppl-driver],[data-ppl-drag]');if(name){openMenu(name.dataset.pplDriver||name.dataset.pplDrag,e);return;}const r=e.target.closest('[data-ppl-reserve-target]');if(r){if(state.selected)reserve(state.selected,r.dataset.pplReserveTarget);else status('Select a driver first.');return;}const b=e.target.closest('[data-ppl-slot]');if(b&&state.selected)move(state.selected,b.dataset.pplSlot);});
  el('ppl-fields').addEventListener('dragstart',e=>{const b=e.target.closest('[data-ppl-driver],[data-ppl-drag]');if(b){closeMenu();e.dataTransfer.setData('text/plain',b.dataset.pplDriver||b.dataset.pplDrag);e.dataTransfer.effectAllowed='move';}});
  el('ppl-board').addEventListener('dragover',e=>{if(e.target.closest('[data-ppl-slot],[data-ppl-reserve-target]'))e.preventDefault();});
  el('ppl-board').addEventListener('drop',e=>{const b=e.target.closest('[data-ppl-slot],[data-ppl-reserve-target]');if(b){e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(b.dataset.pplReserveTarget)reserve(id,b.dataset.pplReserveTarget);else move(id,b.dataset.pplSlot);}});
  el('ppl-board').addEventListener('change',e=>{const b=e.target;if(b.matches('[data-ppl-capacity]')){const d=state.divisions.find(d=>d.number===Number(b.dataset.pplCapacity)),tier=Number(b.dataset.tier),n=Number(b.value);if(!Number.isInteger(n)||n<0||n>state.data.maxTierSlots||!n&&!(tier===1?d.tierTwo:d.tierOne)||state.drivers.some(p=>p.placement.decision==='Placed'&&p.placement.division===d.number&&p.placement.tier===tier&&p.placement.slot>n)){status('Move drivers out of affected slots first. Each division needs at least one slot.');renderBoard();return;}remember();d[tier===1?'tierOne':'tierTwo']=n;changed();renderBoard();}});
  el('ppl-fields').addEventListener('focusin',e=>{if(e.target.matches('#ppl-social-notes,#ppl-placement-notes,#ppl-commitment'))remember();});
  el('ppl-add-division').addEventListener('click',()=>{remember();const slots=Math.max(1,Math.min(state.data.maxTierSlots,state.data.defaultTierSlots));state.divisions.push({number:state.divisions.length+1,tierOne:slots,tierTwo:slots,host:'',rc:''});changed();renderBoard();});
  el('ppl-remove-division').addEventListener('click',()=>{const d=state.divisions[state.divisions.length-1];if(!d)return;if(state.drivers.some(p=>p.placement.division===d.number)){status('Move all main-grid drivers and reserves before removing the last division.');return;}remember();state.divisions.pop();changed();renderBoard();});
  el('ppl-undo').addEventListener('click',()=>{const previous=state.undo.pop();if(!previous)return;state.drivers=previous.drivers;state.divisions=previous.divisions;changed();render();renderDetails();});
  ['ppl-search','ppl-filter'].forEach(id=>el(id).addEventListener('input',renderRoster));
  el('ppl-close-details').addEventListener('click',()=>{el('ppl-driver-details').hidden=true;});
  [['ppl-social-notes','socialNotes'],['ppl-placement-notes','notes'],['ppl-commitment','commitmentOverride']].forEach(([id,key])=>el(id).addEventListener('input',()=>{const d=driver(state.selected);if(!d)return;d.placement[key]=el(id).value;changed();if(key==='commitmentOverride'){renderRoster();renderBoard();renderTrials();counts();el('ppl-driver-heading').innerHTML=esc(d.gamertag)+' '+badge(d);}}));
  function save(confirm){rpc('savePreseasonPlacement',{season:state.season,revision:state.data.revision,divisions:state.divisions,drivers:state.drivers.map(d=>({driverId:d.driverId,placement:d.placement})),confirm});}
  el('ppl-save').addEventListener('click',()=>save(false));el('ppl-confirm').addEventListener('click',()=>save(true));el('ppl-refresh').addEventListener('click',()=>{if(canLeave())rpc('getPreseasonPlacement',state.season);});el('ppl-back').addEventListener('click',()=>{closeMenu();el('view-preseason-placement').classList.remove('meeting-mode');el('ppl-meeting').textContent='Wide meeting view';window.F1XLPreseasonHub.open(state.season);});
  el('ppl-meeting').addEventListener('click',()=>{const wide=el('view-preseason-placement').classList.toggle('meeting-mode');el('ppl-meeting').textContent=wide?'Exit meeting view':'Wide meeting view';});
  return {open};
})();
</script>
