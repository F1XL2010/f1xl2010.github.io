<style>
#tph-free-agents{--fah-accent:#a5dba7}.tph-area-switch{margin-bottom:18px}.tph-area-switch [aria-pressed=true]{border-color:#a5dba7;background:#2b4930}.fah-heading{position:relative;overflow:hidden;min-height:112px;padding:28px;border:1px solid #36523d;border-radius:12px;background:linear-gradient(110deg,#1a3022,#14221a)}.fah-heading h1{position:relative;z-index:1}.fah-heading .eyebrow{color:#b4d79a}.fah-brand{position:absolute;right:3%;top:-8%;width:360px;height:116%;object-fit:contain;opacity:.09;pointer-events:none}.fah-tabs{margin:18px 0}.fah-tabs [aria-pressed=true]{background:#2b4930;border-color:#a5dba7}.fah-summary{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.fah-summary>div{padding:16px 22px;background:var(--panel);border:1px solid var(--line);border-radius:9px;min-width:140px}.fah-summary strong{font-size:28px;display:block}.fah-summary span,.fah-muted{color:var(--muted)}.fah-filters{display:grid;grid-template-columns:2fr repeat(3,minmax(120px,1fr));gap:12px;padding:18px}.fah-filters label{display:grid;gap:6px;font-size:12px}.fah-filters input,.fah-filters select{width:100%;box-sizing:border-box;min-height:42px}.fah-list{padding:0 18px 18px}.fah-table{width:100%;border-collapse:collapse}.fah-table th,.fah-table td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.fah-table th{color:var(--muted);font-size:11px;text-transform:uppercase}.fah-driver{background:none;border:0;padding:5px 0;color:var(--text);font:inherit;font-weight:750;text-align:left;text-decoration:underline;text-underline-offset:4px;cursor:pointer}.fah-divider{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:26px 0 14px}.fah-divider h2{font-size:22px;margin:0}.fah-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}.fah-card{padding:18px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.fah-card h3{font-size:20px;margin:6px 0 12px}.fah-card p{line-height:1.55;overflow-wrap:anywhere}.fah-card small{color:var(--muted)}.fah-alert{border-left:4px solid #e4b24c}.fah-points{float:right;font-size:27px;font-weight:800}.fah-empty{padding:18px;color:var(--muted)}.fah-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.fah-copy{white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere}.fah-licence-filter{max-width:260px}.fah-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fah-stats div{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.fah-stats span{display:block;font-size:12px;color:var(--muted)}.fah-stats strong{display:block;font-size:25px;margin-top:6px}#fah-dialog{width:min(850px,calc(100vw - 20px));max-height:90dvh}.fah-dialog-body{padding:20px}.fah-read-section{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}.fah-mobile-label{display:none}
@media(max-width:680px){.fah-heading{padding:20px}.fah-heading h1{font-size:32px}.fah-brand{width:240px}.fah-filters{grid-template-columns:1fr 1fr}.fah-filters label:first-child{grid-column:1/-1}.fah-summary{gap:8px}.fah-summary>div{min-width:0;flex:1;padding:12px}.fah-summary strong{font-size:23px}.fah-summary span{font-size:11px}.fah-table thead{display:none}.fah-table,.fah-table tbody,.fah-table tr,.fah-table td{display:block;width:auto}.fah-table tr{border:1px solid var(--line);border-radius:9px;margin:12px 0;background:rgba(0,0,0,.12);padding:10px}.fah-table td{border:0;padding:5px 8px;display:flex;justify-content:space-between;gap:18px}.fah-table td:first-child{font-size:18px;display:block;padding-bottom:10px}.fah-mobile-label{display:inline;color:var(--muted);font-size:12px;flex-shrink:0}.fah-stats{grid-template-columns:repeat(2,1fr)}.fah-divider{align-items:flex-start;flex-wrap:wrap}.fah-dialog-body{padding:14px}}
</style>
<script>
window.F1XLFreeAgentHub=(function(){
  const state={data:null,tab:'drivers',review:null,round:0,licenceDivision:'',epoch:0,busy:false,reviewBusy:false,roundBusy:false,inboxBusy:false,statsRequest:0,filters:{query:'',division:'',tier:'',availability:''}},cache=new Map();
  const el=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rpc=(name,arg)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](arg));
  const fmt=v=>v==null||v===''?'—':Number.isFinite(Number(String(v).replace('%','')))?Number(String(v).replace('%','')).toLocaleString('en-GB',{maximumFractionDigits:2})+(String(v).endsWith('%')?'%':''):esc(v);
  const uk=v=>{const s=String(v||''),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:esc(s);};
  const options=(values,current)=>'<option value="">All</option>'+values.map(v=>'<option'+(String(v)===String(current)?' selected':'')+' value="'+esc(v)+'">'+esc(v)+'</option>').join('');
  function status(text){el('fah-status').textContent=text;}
  function drivers(){if(!state.data)return;const all=state.data.drivers,filters=state.filters,unique=new Set(all.map(d=>d.driverId||d.name.toLowerCase())).size;
    el('fah-drivers').innerHTML='<div class="fah-summary"><div><strong>'+unique+'</strong><span>Drivers</span></div><div><strong>'+new Set(all.map(d=>d.division)).size+'</strong><span>Divisions</span></div><div><strong>'+new Set(all.filter(d=>d.availability==='Full-time').map(d=>d.driverId||d.name)).size+'</strong><span>Full-time</span></div></div><div class="panel"><div class="fah-filters"><label class="fah-search-field">Find a driver or Discord name<input id="fah-search" type="search" value="'+esc(filters.query)+'" placeholder="Search drivers"></label><details class="tph-mobile-filters" id="fah-filter-details"'+(matchMedia('(min-width:681px)').matches||filters.division||filters.tier||filters.availability?' open':'')+'><summary id="fah-filter-summary">Filters</summary><div class="fah-filter-fields"><label>Division<select id="fah-division">'+options([...new Set(all.map(d=>d.division))].sort((a,b)=>a-b),filters.division)+'</select></label><label>Tier<select id="fah-tier">'+options([...new Set(all.map(d=>d.tier))].filter(Boolean).sort(),filters.tier)+'</select></label><label>Full / part-time<select id="fah-availability">'+options(['Full-time','Part-time','Not recorded'],filters.availability)+'</select></label></div></details></div><div class="fah-list" id="fah-driver-rows"></div></div>';rows();}
  function rows(){if(!state.data)return;const summary=el('fah-filter-summary'),count=['division','tier','availability'].filter(k=>state.filters[k]).length;if(summary)summary.textContent='Filters'+(count?' ('+count+')':'');const f=state.filters,all=state.data.drivers,list=all.filter(d=>(!f.query||[d.name,d.discord].join(' ').toLowerCase().includes(f.query.toLowerCase()))&&(!f.division||String(d.division)===f.division)&&(!f.tier||d.tier===f.tier)&&(!f.availability||d.availability===f.availability)).slice().sort((a,b)=>a.division-b.division||a.tier.localeCompare(b.tier)||a.name.localeCompare(b.name));
    el('fah-driver-rows').innerHTML='<p class="fah-muted">'+list.length+' shown</p>'+(list.length?'<table class="fah-table"><thead><tr>'+['Driver','Discord','Division','Tier','Full / part-time'].map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+list.map(d=>'<tr><td>'+(d.driverId?'<button class="fah-driver" type="button" data-fah-driver="'+all.indexOf(d)+'">'+esc(d.name)+'</button>':esc(d.name)+'<small class="fah-muted"> · Profile link needs admin review</small>')+'</td>'+[['Discord',d.discord||'—'],['Division','D'+d.division],['Tier',d.tier||'—'],['Full / part-time',d.availability]].map(([label,v])=>'<td><span class="fah-mobile-label">'+label+'</span><span>'+esc(v)+'</span></td>').join('')+'</tr>').join('')+'</tbody></table>':'<p class="fah-empty">No drivers match these filters.</p>');}
  function links(values){return '<div class="fah-links">'+(values||[]).filter(Boolean).map((url,i)=>/^https?:\/\/[^\s]+$/i.test(url)?'<a class="button" target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">Evidence '+(i+1)+' ↗</a>':'<span>'+esc(url)+'</span>').join('')+'</div>';}
  function section(title,text,evidence){return '<section class="fah-read-section"><h3>'+esc(title)+'</h3><p class="fah-copy">'+esc(text||'No written statement supplied.')+'</p>'+links(evidence)+'</section>';}
  function showDialog(title,html){el('fah-dialog-title').textContent=title;el('fah-dialog-body').innerHTML=html;if(!el('fah-dialog').open)el('fah-dialog').showModal();}
  function readTicket(index,pending){const t=(pending?state.review?.pendingTickets:state.review?.tickets)?.[index];if(!t)return;showDialog(pending?(t.type||'Submission'):'Ticket #'+t.ticketNumber,'<p class="fah-muted">'+(pending?'Received '+uk(t.received):'R'+t.round+' · '+esc(t.track))+' · D'+esc(t.division)+(t.session?' · '+esc(t.session):'')+'</p><p><strong>'+esc(t.submitter)+' → '+esc(t.offender)+'</strong></p>'+section('Original submission',t.description,t.evidence)+(!pending&&(t.defenceComments||t.defenceEvidence?.some(Boolean))?section('Defence',t.defenceComments,t.defenceEvidence):'')+(!pending&&(t.appealDescription||t.appealEvidence?.some(Boolean))?section('Appeal',t.appealDescription,t.appealEvidence):''));}
  function ticketCards(items,pending){return items.length?'<div class="fah-grid">'+items.map((t,i)=>'<article class="fah-card"><small>D'+esc(t.division)+(t.session?' · '+esc(t.session):'')+'</small><h3>'+esc(t.submitter)+' → '+esc(t.offender)+'</h3><p class="fah-muted">'+esc(pending?t.type:t.state)+'</p><button class="button" type="button" data-fah-ticket="'+i+'" data-fah-pending="'+pending+'">'+(pending?'Read submission':'Read ticket #'+esc(t.ticketNumber))+'</button></article>').join('')+'</div>':'<p class="fah-empty">No '+(pending?'incoming submissions':'tickets for this round')+' involving these drivers.</p>';}
  function pending(){const mount=el('fah-pending');if(mount&&state.review)mount.innerHTML=state.review.inboxIssue?'<p role="status">'+esc(state.review.inboxIssue)+'</p>':ticketCards(state.review.pendingTickets||[],true);}
  function licenceRows(){const mount=el('fah-licences');if(!mount||!state.review)return;const division=el('fah-licence-division')?.value||'',data=state.review;if(data.licenceIssue){mount.innerHTML='<p role="status">'+esc(data.licenceIssue)+'</p>';return;}const match=d=>!division||String(d.division)===division,actions=[...data.bans.map(b=>({driver:b.driver,division:b.division,title:b.type,text:b.restriction,detail:b.scheduled?'Due: '+b.scheduled:'Round not assigned'})),...data.carryovers.map(c=>({driver:c.driver,division:c.division,title:fmt(c.seconds)+' seconds carried over',text:'Due at their next race participation.',detail:c.reference||''})),...data.reviews.map(r=>({driver:r.driver,division:r.division,title:'Admin review',text:r.type,detail:r.reason}))].filter(match);
    mount.innerHTML='<h3>Outstanding restrictions</h3>'+(actions.length?'<div class="fah-grid">'+actions.map(a=>'<article class="fah-card fah-alert"><small>D'+a.division+'</small><h3>'+esc(a.driver)+'</h3><strong>'+esc(a.title)+'</strong><p>'+esc(a.text)+'</p><small>'+esc(a.detail)+'</small></article>').join('')+'</div>':'<p class="fah-empty">No outstanding bans or time carryovers recorded for these drivers.</p>')+'<h3>Driver licences</h3><div class="fah-grid">'+data.licences.filter(match).map(d=>'<article class="fah-card"><span class="fah-points">'+(d.ready?fmt(d.points):'—')+'</span><small>D'+d.division+' · '+esc(d.tier)+'</small><h3>'+esc(d.driver)+'</h3><p class="fah-muted">'+(d.ready?'Licence points':'Licence points not available')+'</p>'+(d.servedBans?.length?'<details><summary>Served bans · '+d.servedBans.length+'</summary>'+d.servedBans.map(b=>'<p>'+esc(b.type)+(b.scheduled?' · '+esc(b.scheduled):'')+'</p>').join('')+'</details>':'')+'</article>').join('')+'</div>';}
  function review(){const d=state.review;if(!d){el('fah-review').innerHTML='<p class="fah-empty" role="status">'+(state.reviewBusy?'Loading tickets and licences…':'Tickets and licences have not loaded. Use Refresh to retry.')+'</p>';return;}el('fah-review').innerHTML='<div class="fah-divider"><h2>Incoming submissions</h2><button class="button" type="button" data-fah-review-refresh'+(state.reviewBusy?' disabled':'')+'>Refresh tickets &amp; licence</button></div><div id="fah-pending"></div><div class="fah-divider"><h2>Round tickets</h2><label>Round <select id="fah-round"'+(state.roundBusy||state.reviewBusy?' disabled':'')+'>'+d.rounds.map(r=>'<option value="'+r.round+'"'+(r.round===state.round?' selected':'')+'>R'+r.round+' · '+esc(r.track)+'</option>').join('')+'</select></label></div><div role="status">'+(state.roundBusy?'Loading round tickets…':d.ticketIssue?esc(d.ticketIssue):'')+'</div>'+(state.roundBusy?'':ticketCards(d.tickets||[],false))+'<div class="fah-divider"><h2>Licences &amp; bans</h2><label class="fah-licence-filter">Division <select id="fah-licence-division">'+options([...new Set(state.data.drivers.map(d=>d.division))].sort((a,b)=>a-b),state.licenceDivision)+'</select></label></div><div id="fah-licences"></div>';pending();licenceRows();}
  async function loadReview(force){if(!state.data||state.reviewBusy||state.review&&!force)return;const epoch=state.epoch;state.reviewBusy=true;review();try{const data=await rpc('getFreeAgentHubReview',{season:state.data.season,round:state.round});if(epoch!==state.epoch)return;state.review=data;state.round=data.selectedRound;review();}catch(e){if(epoch===state.epoch)status(e.message||'Tickets and licences could not load.');}finally{if(epoch===state.epoch){state.reviewBusy=false;review();}}}
  async function round(value){if(!state.data||state.roundBusy)return;const epoch=state.epoch;state.round=Number(value);state.roundBusy=true;review();try{const data=await rpc('getFreeAgentHubTickets',{season:state.data.season,round:state.round});if(epoch!==state.epoch)return;Object.assign(state.review,data);}catch(e){if(epoch===state.epoch)state.review.ticketIssue=e.message;}finally{if(epoch===state.epoch){state.roundBusy=false;review();}}}
  async function inbox(){if(!state.data||!state.review||state.inboxBusy||state.reviewBusy||el('fah-dialog').open)return;state.inboxBusy=true;const epoch=state.epoch;try{const data=await rpc('getFreeAgentHubInbox',{season:state.data.season});if(epoch!==state.epoch)return;state.review.pendingTickets=data.pendingTickets;state.review.inboxIssue='';pending();}catch(e){if(epoch===state.epoch){state.review.inboxIssue='Incoming submissions could not refresh. Use Refresh tickets to retry.';pending();}}finally{state.inboxBusy=false;}}
  function statsHtml(data){return (data.issues||[]).map(t=>'<p role="status">'+esc(t)+'</p>').join('')+(data.divisions.length?data.divisions.map(d=>'<section class="fah-read-section"><h3>Division '+d.division+'</h3><div class="fah-stats">'+[['Position',d.position?'P'+d.position:'—'],['Points',d.points],['Wins',d.wins],['Podiums',d.podiums],['Poles',d.poles],['Sprint wins',d.sprintWins],['Race starts',d.started],['Finishes',d.finished],['DNFs',d.dnf],['DNS',d.dns],['Disqualifications',d.dsq],['Average finish',d.averageFinish],['Average grid',d.averageGrid],['Average points',d.averagePoints],['Finish rate',d.reliability]].map(([label,value])=>'<div><span>'+label+'</span><strong>'+fmt(value)+'</strong></div>').join('')+'</div></section>').join(''):'<p>No season statistics recorded yet.</p>')+'<p class="fah-muted">Wins, podiums and poles are feature-race statistics. Starts and finishes include sprints; championship points remain separate for each division.</p>';}
  async function stats(index){const driver=state.data?.drivers[index];if(!driver?.driverId)return;const request=++state.statsRequest,epoch=state.epoch,key=state.data.season+'|'+driver.driverId+'|'+driver.division;showDialog(driver.name,'<p>Loading season statistics…</p>');const old=cache.get(key);if(old&&Date.now()-old.at<60000){el('fah-dialog-body').innerHTML=statsHtml(old.data);return;}try{const data=await rpc('getFreeAgentHubDriverStats',{season:state.data.season,driverId:driver.driverId,division:driver.division});if(request!==state.statsRequest||epoch!==state.epoch||!el('fah-dialog').open)return;if(!data.issues.length)cache.set(key,{at:Date.now(),data});el('fah-dialog-body').innerHTML=statsHtml(data);}catch(e){if(request===state.statsRequest&&epoch===state.epoch&&el('fah-dialog').open)el('fah-dialog-body').innerHTML='<p role="status">'+esc(e.message)+'</p><button class="button" type="button" data-fah-driver="'+index+'">Retry</button>';}}
  function tab(value){state.tab=value;el('fah-drivers').hidden=value!=='drivers';el('fah-review').hidden=value!=='review';document.querySelectorAll('[data-fah-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.fahTab===value);b.setAttribute('aria-pressed',String(b.dataset.fahTab===value));});if(value==='review')loadReview(false);}
  async function load(){if(state.busy)return;state.busy=true;const epoch=++state.epoch;state.reviewBusy=false;state.roundBusy=false;state.review=null;cache.clear();el('fah-refresh').disabled=true;status('Loading current drivers…');try{const data=await rpc(state.data?'getFreeAgentHub':'getFreeAgentHubInitial',state.data?{season:state.data.season}:undefined);if(epoch!==state.epoch)return;state.data=data;el('fah-season').textContent='SEASON '+data.season+' / TEAM PRINCIPAL HUB';drivers();status('Updated '+new Date(data.refreshedAt).toLocaleString('en-GB'));tab(state.tab);}catch(e){if(epoch===state.epoch)status(e.message||'The Free Agent Hub could not load.');}finally{if(epoch===state.epoch){state.busy=false;el('fah-refresh').disabled=false;}}}
  el('fah-refresh').onclick=load;el('fah-dialog-close').onclick=()=>{++state.statsRequest;el('fah-dialog').close();};el('fah-dialog').addEventListener('cancel',()=>{++state.statsRequest;});
  document.addEventListener('click',e=>{const driver=e.target.closest('[data-fah-driver]'),ticket=e.target.closest('[data-fah-ticket]'),button=e.target.closest('[data-fah-tab]');if(driver)stats(Number(driver.dataset.fahDriver));else if(ticket)readTicket(Number(ticket.dataset.fahTicket),ticket.dataset.fahPending==='true');else if(button)tab(button.dataset.fahTab);else if(e.target.closest('[data-fah-review-refresh]'))loadReview(true);});
  el('tph-free-agents').addEventListener('input',e=>{const key={'fah-search':'query','fah-division':'division','fah-tier':'tier','fah-availability':'availability'}[e.target.id];if(key){state.filters[key]=e.target.value;rows();}});el('tph-free-agents').addEventListener('change',e=>{if(e.target.id==='fah-round')round(e.target.value);if(e.target.id==='fah-licence-division'){state.licenceDivision=e.target.value;licenceRows();}});
  setInterval(()=>{if(document.hidden||el('view-team-principal-hub').hidden||el('tph-free-agents').hidden||state.tab!=='review')return;const work=()=>inbox();if(window.F1XLBackground)window.F1XLBackground.request('free-agent-inbox',work).catch(()=>{});else work();},90000);
  // Both audiences share one navigation destination; RPC permissions remain separate.
  let mode='teams';
  function selectView(next,refresh=true){
    const canTeam=!!window.F1XLAccess?.can('team_hub'),canFree=!!window.F1XLAccess?.can('free_agents');
    mode=next==='free-agents'&&canFree?'free-agents':canTeam?'teams':canFree?'free-agents':'';
    el('tph-team-content').hidden=mode!=='teams';el('tph-free-agents').hidden=mode!=='free-agents';
    el('tph-area-switch').hidden=!(canTeam&&canFree);
    document.querySelectorAll('[data-tph-area]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tphArea===mode)));
    if(mode==='free-agents')document.body.style.setProperty('--tph-page-accent','#a5dba7');
    else document.body.style.setProperty('--tph-page-accent',el('view-team-principal-hub').style.getPropertyValue('--tph-accent')||'#e4b24c');
    window.F1XLAccess?.schedulePaint();
    if(refresh){if(mode==='free-agents')load();else if(mode==='teams')window.F1XLTeamPrincipalHub.load(false);}
  }
  window.F1XLPrincipalArea={enter:()=>selectView(mode),select:selectView};
  document.addEventListener('click',e=>{const button=e.target.closest('[data-tph-area]');if(button)selectView(button.dataset.tphArea);});
  window.addEventListener('fap-access-ready',()=>{if(!el('view-team-principal-hub').hidden)selectView(mode,false);});
  return {load};
})();
</script>
