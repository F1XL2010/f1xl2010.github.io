<script>
window.F1XLPreseasonTrackDraw=(function(){
  if(window.F1XLNavigation)window.F1XLNavigation.register('preseason-track-draw',()=>state.dirty,()=> ({season:state.season}));

  const state={season:'',data:null,pool:[],races:[],source:'',previousTracks:[],drawnAt:'',dirty:false,busy:false,view:'pool'};
  const el=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function status(text){el('ptd-status').textContent=text;}
  function dirty(){state.dirty=true;status('Unsaved preparation. The website is unchanged.');}
  function busy(value){state.busy=value;el('ptd-fields').disabled=value||!state.data;el('ptd-refresh').disabled=value;el('ptd-back').disabled=value;}
  function rpc(name,input,done){if(state.busy)return;busy(true);status(name==='getPreseasonTrackDraw'?'Loading track draw…':name==='savePreseasonTrackDraw'?'Saving private preparation…':'Preparing draw…');google.script.run.withSuccessHandler(function(data){busy(false);done(data);}).withFailureHandler(function(error){busy(false);status(error.message||'Unable to complete the request. Your entries are retained.');})[name](input);}
  function apply(data){state.data=data;state.pool=data.pool;state.races=data.races;state.source=data.source;state.previousTracks=data.previousTracks;state.drawnAt=data.drawnAt;state.dirty=false;el('ptd-reviewed').checked=data.reviewed;el('ptd-fields').disabled=false;el('ptd-master').href=data.url;el('ptd-master').hidden=false;el('ptd-previous').innerHTML='<option value="">Choose the previous season…</option>'+data.previousSeasons.map(s=>'<option value="'+esc(s)+'">Season '+esc(s)+'</option>').join('');const previous=String(Number(state.season)-1);if(data.previousSeasons.includes(previous))el('ptd-previous').value=previous;render();status(data.message||'Review the pool, draw the tracks, then save the preparation. Saving does not publish.');}
  function open(season){if(state.busy)return;if(state.season!==season){if(state.dirty&&!window.confirm('Discard unsaved track-draw preparation?'))return;state.season=season;state.data=null;state.dirty=false;state.view='pool';el('ptd-master').hidden=true;}window.F1XLNavigate('preseason-track-draw');el('ptd-title').textContent='S'+season+' Track draw';el('ptd-back').textContent='← S'+season+' Pre-season';showView(state.view);if(!state.data)rpc('getPreseasonTrackDraw',season,apply);}
  function showView(view){state.view=view;['pool','order'].forEach(v=>{el('ptd-view-'+v).hidden=view!==v;const b=document.querySelector('[data-ptd-view="'+v+'"]');b.classList.toggle('active',view===v);b.setAttribute('aria-pressed',String(view===v));});}
  function counts(){const eligible=state.pool.filter(p=>p.eligible).length,guaranteed=state.pool.filter(p=>p.guaranteed).length;el('ptd-counts').textContent=state.races.length+' rounds · '+eligible+' eligible tracks · '+guaranteed+' guaranteed · '+Math.max(0,state.races.length-guaranteed)+' places drawn from the remaining pool';el('ptd-source').textContent=state.source?'Previous-season reference: '+state.source:'No previous calendar loaded. Mark the omitted tracks manually, or load a connected season above.';}
  function render(){counts();renderPool();renderOrder();showView(state.view);}
  function renderPool(){el('ptd-pool').innerHTML=state.pool.map((p,i)=>'<tr><td>'+esc(p.track)+'</td><td><input type="checkbox" data-ptd-pool="'+i+'" data-field="eligible" aria-label="Eligible: '+esc(p.track)+'"'+(p.eligible?' checked':'')+'></td><td><input type="checkbox" data-ptd-pool="'+i+'" data-field="guaranteed" aria-label="Guaranteed: '+esc(p.track)+'"'+(p.guaranteed?' checked':'')+(p.eligible?'':' disabled')+'></td></tr>').join('');}
  function renderOrder(){el('ptd-order').innerHTML=state.races.map((r,i)=>'<tr><td><strong>'+r.round+'</strong><span class="secondary-line">'+esc(r.date)+'</span></td><td><select data-ptd-round="'+i+'" data-field="track" aria-label="Round '+r.round+' track"><option value="">Not drawn yet</option>'+state.pool.filter(p=>p.eligible||p.track===r.track).map(p=>'<option'+(p.track===r.track?' selected':'')+'>'+esc(p.track)+'</option>').join('')+'</select></td><td><select data-ptd-round="'+i+'" data-field="weekend" aria-label="Round '+r.round+' weekend">'+['Standard','Modern Sprint','Legacy Sprint'].map(w=>'<option'+(w===r.weekend?' selected':'')+'>'+w+'</option>').join('')+'</select></td><td><button class="button" type="button" data-ptd-move="'+i+'" data-step="-1" aria-label="Move round '+r.round+' track earlier"'+(!i?' disabled':'')+'>↑</button> <button class="button" type="button" data-ptd-move="'+i+'" data-step="1" aria-label="Move round '+r.round+' track later"'+(i===state.races.length-1?' disabled':'')+'>↓</button></td></tr>').join('');}
  function input(){return {season:state.season,revision:state.data.revision,pool:state.pool,races:state.races,source:state.source,previousTracks:state.previousTracks,reviewed:el('ptd-reviewed').checked,drawnAt:state.drawnAt};}
  document.querySelectorAll('[data-ptd-view]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.ptdView)));
  el('ptd-pool').addEventListener('change',function(e){const t=e.target;if(!t.matches('[data-ptd-pool]'))return;const p=state.pool[Number(t.dataset.ptdPool)];p[t.dataset.field]=t.checked;if(!p.eligible)p.guaranteed=false;el('ptd-reviewed').checked=false;dirty();render();});
  el('ptd-reviewed').addEventListener('change',dirty);
  el('ptd-import').addEventListener('click',function(){if(!el('ptd-previous').value){status('Choose a previous connected season, or mark omitted tracks manually.');return;}rpc('importPreseasonTrackHistory',{season:state.season,revision:state.data.revision,previousSeason:el('ptd-previous').value,pool:state.pool},function(data){state.pool=data.pool;state.source=data.source;state.previousTracks=data.previousTracks;el('ptd-reviewed').checked=false;dirty();render();status('Previous calendar loaded. Review the eligible and guaranteed selections.'+(data.unmatched.length?' Previous tracks outside this reference list: '+data.unmatched.join(', ')+'.':''));});});
  el('ptd-draw').addEventListener('click',function(){if(state.races.some(r=>r.track)&&!window.confirm('Replace the current prepared order with a new random draw? Nothing is saved until you press Save preparation.'))return;rpc('drawPreseasonTracks',input(),function(data){state.races=data.races;state.drawnAt=data.drawnAt;dirty();render();showView('order');status('Draw ready to review. Guaranteed tracks are included; their round positions were shuffled with the other selected tracks. Save preparation to keep it.');});});
  el('ptd-order').addEventListener('change',function(e){const t=e.target;if(!t.matches('[data-ptd-round]'))return;state.races[Number(t.dataset.ptdRound)][t.dataset.field]=t.value;dirty();});
  el('ptd-order').addEventListener('click',function(e){const b=e.target.closest('[data-ptd-move]');if(!b)return;const i=Number(b.dataset.ptdMove),j=i+Number(b.dataset.step);if(j<0||j>=state.races.length)return;[state.races[i].track,state.races[j].track]=[state.races[j].track,state.races[i].track];dirty();renderOrder();});
  el('ptd-sprint-defaults').addEventListener('click',function(){state.races.forEach(r=>r.weekend=[3,9,14,19].includes(r.round)?'Modern Sprint':'Standard');dirty();renderOrder();});
  el('ptd-save').addEventListener('click',()=>rpc('savePreseasonTrackDraw',input(),apply));
  el('ptd-announcement').addEventListener('click',function(){if(state.dirty){status('Save preparation before opening the announcement statistics.');return;}window.F1XLPreseasonAnnouncement.open(state.season,state.data.revision);});
  el('ptd-refresh').addEventListener('click',function(){if(!state.dirty||window.confirm('Discard unsaved track-draw preparation and reload?'))rpc('getPreseasonTrackDraw',state.season,apply);});
  el('ptd-back').addEventListener('click',()=>window.F1XLPreseasonHub.open(state.season));
  return {open:open};
})();
</script>
