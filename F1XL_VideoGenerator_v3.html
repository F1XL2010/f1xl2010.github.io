<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1XL · Video Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Permanent+Marker&family=Boogaloo&family=Barlow+Condensed:wght@400;700;900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0806;--surface:#141210;--border:rgba(255,255,255,0.07);--accent:#cc1e1e;--text:#ede8e0;--muted:rgba(237,232,224,0.38);--yellow:#f5e642;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh;padding:2rem 1.5rem 4rem;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.007) 0,rgba(255,255,255,0.007) 1px,transparent 1px,transparent 10px);}
header{text-align:center;margin-bottom:3rem;padding-top:1rem;}
.hdr-top{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:4px;}
.hdr-a{font-family:'Permanent Marker',cursive;font-size:2rem;color:var(--accent);opacity:.7;display:inline-block;}
.hdr-t{font-family:'Permanent Marker',cursive;font-size:3rem;color:var(--yellow);transform:rotate(-1deg);display:inline-block;text-shadow:3px 3px 0 rgba(0,0,0,.6);}
.hdr-s{font-family:'Special Elite',cursive;font-size:.85rem;color:var(--muted);letter-spacing:.22em;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.5rem;margin-bottom:1.4rem;max-width:900px;margin-left:auto;margin-right:auto;}
.card-title{font-family:'Black Ops One',cursive;font-size:.72rem;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;margin-bottom:1.1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.9rem;}
.form-group{display:flex;flex-direction:column;gap:5px;}
label{font-size:.68rem;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;font-family:'Black Ops One',cursive;}
input,select{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:1rem;padding:8px 10px;transition:border-color .2s;width:100%;}
input:focus,select:focus{outline:none;border-color:var(--accent);}
select option{background:#141210;}
.div-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;}
.count-ctrl{display:flex;align-items:center;gap:10px;}
.count-btn{width:30px;height:30px;border-radius:4px;border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--text);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s;line-height:1;}
.count-btn:hover{border-color:var(--accent);background:rgba(204,30,30,.1);}
.count-num{font-family:'Permanent Marker',cursive;font-size:1.4rem;color:var(--yellow);min-width:24px;text-align:center;}
.div-block{border:1px solid var(--border);border-radius:6px;padding:1.1rem;margin-bottom:.9rem;}
.div-lbl{font-family:'Black Ops One',cursive;font-size:.95rem;margin-bottom:.9rem;display:flex;align-items:center;gap:9px;color:var(--text);}
.div-sw{width:13px;height:13px;border-radius:3px;flex-shrink:0;}
.podium-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;}
.podium-slot{display:flex;flex-direction:column;gap:5px;}
.pos-lbl{font-size:.63rem;font-weight:700;letter-spacing:.1em;padding:2px 7px;border-radius:3px;display:inline-block;margin-bottom:1px;}
.p1l{background:#d4a000;color:#1a0d00;}.p2l{background:#888;color:#111;}.p3l{background:#7a3d1a;color:#ffd0a0;}
.gen-btn{width:100%;max-width:900px;display:block;margin:0 auto;padding:1.15rem;background:var(--accent);border:none;border-radius:6px;color:#fff;font-family:'Permanent Marker',cursive;font-size:1.55rem;cursor:pointer;transform:rotate(-.4deg);transition:transform .15s,background .2s,box-shadow .2s;box-shadow:3px 3px 0 rgba(0,0,0,.45);}
.gen-btn:hover{background:#e02020;transform:rotate(-.4deg) scale(1.01);}
.gen-btn:disabled{background:#3a3a3a;cursor:not-allowed;transform:none;box-shadow:none;}
.prog-area{display:none;margin:1.4rem auto 0;max-width:900px;}
.prog-label{font-family:'Special Elite',cursive;font-size:.84rem;color:var(--muted);margin-bottom:7px;text-align:center;}
.prog-outer{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
.prog-inner{height:100%;background:linear-gradient(90deg,var(--accent),var(--yellow));border-radius:3px;width:0%;transition:width .25s;}
.note{font-family:'Special Elite',cursive;font-size:.76rem;color:var(--muted);text-align:center;margin:1rem auto 0;max-width:900px;line-height:1.7;}
.note span{color:var(--yellow);}
#renderCanvas{display:none;}
#introVid,#musicAud{display:none;}
</style>
</head>
<body>

<header>
  <div class="hdr-top">
    <span class="hdr-a" style="transform:rotate(-8deg)">Ⓐ</span>
    <span class="hdr-t">F1XL</span>
    <span class="hdr-a" style="transform:rotate(6deg)">Ⓐ</span>
  </div>
  <div class="hdr-s">Race Results · Video Generator</div>
</header>

<div class="card">
  <div class="card-title">Race Info</div>
  <div class="form-row">
    <div class="form-group"><label>Season</label><input type="number" id="season" value="28" min="1" max="99"></div>
    <div class="form-group"><label>Race No.</label><input type="number" id="raceNum" value="1" min="1" max="30"></div>
    <div class="form-group"><label>Track</label><input type="text" id="track" value="Bahrain"></div>
    <div class="form-group"><label>Race Type</label>
      <select id="raceType">
        <option value="FEATURE RACE">Feature Race</option>
        <option value="SPRINT RACE">Sprint Race</option>
        <option value="QUALIFYING">Qualifying</option>
      </select>
    </div>
  </div>
</div>

<div class="card">
  <div class="div-hdr">
    <div class="card-title" style="margin:0;border:none;padding:0;">Divisions</div>
    <div class="count-ctrl">
      <button class="count-btn" onclick="changeDivs(-1)">-</button>
      <div class="count-num" id="divNum">4</div>
      <button class="count-btn" onclick="changeDivs(1)">+</button>
    </div>
  </div>
  <div id="divsContainer"></div>
</div>

<button class="gen-btn" id="genBtn" onclick="startGenerate()">Generate Video</button>

<div class="prog-area" id="progArea">
  <div class="prog-label" id="progLabel">Starting...</div>
  <div class="prog-outer"><div class="prog-inner" id="progBar"></div></div>
</div>

<p class="note">Output: <span>.webm</span> — uploads directly to YouTube.<br>For Instagram/TikTok rename to <span>.mp4</span> or convert with free <span>HandBrake</span>.</p>

<canvas id="renderCanvas" width="720" height="1280"></canvas>
<video id="introVid" crossorigin="anonymous" playsinline muted></video>
<audio id="musicAud" crossorigin="anonymous"></audio>

<script>
'use strict';

// ─── ASSETS ────────────────────────────────────────────────────────────────
const BASE = 'https://f1xl2010.github.io/video-gen/assets/';
const INTRO_SRC = BASE + 'video/F1XL logoclip.mp4';
const MUSIC_SRC = BASE + 'music/instrumental_backing1.mp3';
const BG_SRC    = BASE + 'video/vid1background.png';

const F1_TEAMS = ['Alpine','Aston Martin','Audi','Cadillac','Ferrari','Haas','McLaren','Mercedes','Racing Bull','Red Bull','Williams','Reserve'];

const LOGO_FILES = {
  'Alpine':'logo_alpine.png','Aston Martin':'logo_aston-martin.png',
  'Audi':'logo_audi.png','Cadillac':'logo_cadillac.png',
  'Ferrari':'logo_ferrari.png','Haas':'logo_haas.png',
  'McLaren':'logo_mclaren.png','Mercedes':'logo_mercedes.png',
  'Racing Bull':'logo_racing-bulls.png','Red Bull':'logo_red-bull.png',
  'Williams':'logo_williams.png','Reserve':'logo_reserve.png',
};

const TEAM_COL = {
  'Alpine':'#479FE2','Aston Martin':'#4B9774','Audi':'#C0C0C0','Cadillac':'#AAAADD',
  'Ferrari':'#D52E37','Haas':'#CC1111','McLaren':'#EF8733','Mercedes':'#75F1D3',
  'Racing Bull':'#7091F8','Red Bull':'#4570C0','Williams':'#3267D4','Reserve':'#ffffff',
};

// Division tint colours — overlaid on the background image
const DIV_TINT = [null,
  {r:180,g:20, b:20},   // D1 red
  {r:180,g:130,b:10},   // D2 amber
  {r:100,g:160,b:10},   // D3 green
  {r:10, g:160,b:80},   // D4 emerald
  {r:10, g:140,b:180},  // D5 teal
  {r:40, g:60, b:200},  // D6 blue
  {r:120,g:20, b:180},  // D7 purple
  {r:180,g:20, b:110},  // D8 magenta
];

const FPS=30, W=720, H=1280;
// Timing
const T_TITLE=2.5;   // title card (season/race/track fades in on bg)
const T_RESULTS=7.0; // results per division

// ─── STATE ─────────────────────────────────────────────────────────────────
let divCount=4;
const imgCache={};

// ─── UI ────────────────────────────────────────────────────────────────────
function teamOpts(di){
  return F1_TEAMS.map((t,i)=>`<option value="${t}"${i===di?' selected':''}>${t}</option>`).join('');
}

function buildDivisions(){
  const c=document.getElementById('divsContainer');
  c.innerHTML='';
  for(let i=1;i<=divCount;i++){
    const t=DIV_TINT[i]||DIV_TINT[1];
    const hex=`#${t.r.toString(16).padStart(2,'0')}${t.g.toString(16).padStart(2,'0')}${t.b.toString(16).padStart(2,'0')}`;
    c.innerHTML+=`
    <div class="div-block" style="border-color:${hex}55">
      <div class="div-lbl"><div class="div-sw" style="background:${hex}"></div>Division ${i}</div>
      <div class="podium-grid">
        <div class="podium-slot"><span class="pos-lbl p1l">P1</span>
          <input type="text" id="d${i}p1n" placeholder="Driver name">
          <select id="d${i}p1t">${teamOpts(9)}</select></div>
        <div class="podium-slot"><span class="pos-lbl p2l">P2</span>
          <input type="text" id="d${i}p2n" placeholder="Driver name">
          <select id="d${i}p2t">${teamOpts(6)}</select></div>
        <div class="podium-slot"><span class="pos-lbl p3l">P3</span>
          <input type="text" id="d${i}p3n" placeholder="Driver name">
          <select id="d${i}p3t">${teamOpts(4)}</select></div>
      </div>
    </div>`;
  }
  document.getElementById('divNum').textContent=divCount;
}

function changeDivs(d){divCount=Math.max(1,Math.min(8,divCount+d));buildDivisions();}

function getFormData(){
  const divs=[];
  for(let i=1;i<=divCount;i++){
    divs.push({
      num:i,
      tint:DIV_TINT[i]||DIV_TINT[1],
      podium:[1,2,3].map(p=>({
        name:(document.getElementById(`d${i}p${p}n`).value.trim()||'TBC'),
        team:document.getElementById(`d${i}p${p}t`).value,
      }))
    });
  }
  return {
    season:document.getElementById('season').value,
    raceNum:document.getElementById('raceNum').value,
    track:document.getElementById('track').value.trim()||'TBC',
    raceType:document.getElementById('raceType').value,
    divs,
  };
}

// ─── IMAGE LOADING ─────────────────────────────────────────────────────────
function loadImg(src){
  if(imgCache[src]) return Promise.resolve(imgCache[src]);
  return new Promise(resolve=>{
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{imgCache[src]=img;resolve(img);};
    img.onerror=()=>{console.warn('Failed:',src);resolve(null);};
    img.src=src;
  });
}

async function preloadAll(divs){
  const teams=new Set();
  divs.forEach(d=>d.podium.forEach(p=>teams.add(p.team)));
  await Promise.all([
    loadImg(BG_SRC),
    ...[...teams].map(t=>{const f=LOGO_FILES[t];return f?loadImg(BASE+'logos/'+f):Promise.resolve();})
  ]);
}

// ─── HELPERS ───────────────────────────────────────────────────────────────
function easeOut3(t){return 1-Math.pow(1-Math.min(t,1),3);}
function easeOut5(t){return 1-Math.pow(1-Math.min(t,1),5);}
function easeIO2(t){t=Math.min(t,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function srand(s){return Math.abs(Math.sin(s+1)*43758.5453)%1;}

// ─── DRAW BACKGROUND ───────────────────────────────────────────────────────
function drawBg(ctx, tint, tintAlpha){
  const bg=imgCache[BG_SRC];
  if(bg){
    // Scale to fill 720x1280
    const scale=Math.max(W/bg.width, H/bg.height);
    const dw=bg.width*scale, dh=bg.height*scale;
    ctx.drawImage(bg,(W-dw)/2,(H-dh)/2,dw,dh);
  } else {
    ctx.fillStyle='#0d1210';
    ctx.fillRect(0,0,W,H);
  }
  // Division colour tint overlay
  if(tint && tintAlpha>0){
    ctx.fillStyle=`rgba(${tint.r},${tint.g},${tint.b},${tintAlpha})`;
    ctx.fillRect(0,0,W,H);
  }
}

// ─── SPRAY PAINT NUMBER ────────────────────────────────────────────────────
// Draws a rough spray-paint style position number
const SPRAY_COLS=[
  {main:'#FF3AAA',shadow:'#8B0055'}, // P1 magenta/pink
  {main:'#FFE600',shadow:'#7A6A00'}, // P2 yellow
  {main:'#FF3AAA',shadow:'#8B0055'}, // P3 pink (same as P1 in mock)
];

function drawSprayNum(ctx, num, cx, cy, size, rot){
  const c=SPRAY_COLS[num-1];
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot*Math.PI/180);

  // Spray splatter — dots around the number
  ctx.fillStyle=c.main;
  for(let i=0;i<30;i++){
    const angle=srand(i*17)*Math.PI*2;
    const dist=size*.45+srand(i*31)*size*.4;
    const r=1+srand(i*7)*3;
    ctx.globalAlpha=0.15+srand(i*13)*0.35;
    ctx.beginPath();
    ctx.arc(Math.cos(angle)*dist, Math.sin(angle)*dist, r, 0, Math.PI*2);
    ctx.fill();
  }

  // Shadow/depth layer
  ctx.globalAlpha=0.5;
  ctx.fillStyle=c.shadow;
  ctx.font=`900 ${size}px 'Black Ops One',cursive`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(num, 3, 5);

  // Main number
  ctx.globalAlpha=0.92;
  ctx.fillStyle=c.main;
  ctx.fillText(num, 0, 0);

  // Roughen edges — horizontal spray lines
  ctx.globalAlpha=0.12;
  for(let i=0;i<8;i++){
    const y=-size*.45+i*size*.13;
    const x1=-size*.5+srand(i*23)*size*.2;
    const x2=size*.5-srand(i*37)*size*.2;
    ctx.fillStyle=c.main;
    ctx.fillRect(x1,y,x2-x1,1.5);
  }

  ctx.globalAlpha=1;
  ctx.restore();
}

// ─── TAPE STRIP ────────────────────────────────────────────────────────────
function drawTape(ctx, text, cx, cy, width, rot, alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(cx,cy);
  ctx.rotate(rot*Math.PI/180);

  const hw=width/2, hh=34;

  // Tape body — slightly off-white/cream
  ctx.fillStyle='#e8e0c8';
  ctx.beginPath();
  // Slightly irregular edges
  ctx.moveTo(-hw+8,-hh);
  ctx.lineTo(hw-5,-hh+2);
  ctx.lineTo(hw,-hh+6);
  ctx.lineTo(hw+3,hh-4);
  ctx.lineTo(hw-8,hh+2);
  ctx.lineTo(-hw+6,hh);
  ctx.lineTo(-hw-2,hh-6);
  ctx.lineTo(-hw-4,-hh+8);
  ctx.closePath();
  ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=12;ctx.shadowOffsetY=4;
  ctx.fill();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;

  // Tape texture — subtle horizontal lines
  ctx.strokeStyle='rgba(180,168,140,0.4)';ctx.lineWidth=1;
  for(let l=-hh+8;l<hh;l+=7){
    ctx.beginPath();ctx.moveTo(-hw+4,l);ctx.lineTo(hw-4,l);ctx.stroke();
  }

  // Driver name
  let fs=32;
  ctx.font=`${fs}px 'Permanent Marker',cursive`;
  const maxW=width*.82;
  while(ctx.measureText(text).width>maxW&&fs>16){
    fs--;ctx.font=`${fs}px 'Permanent Marker',cursive`;
  }
  ctx.fillStyle='#1a1208';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,0,2);

  ctx.restore();
}

// ─── TEAM LOGO ─────────────────────────────────────────────────────────────
function drawLogo(ctx, team, cx, cy, size, rot, alpha){
  const f=LOGO_FILES[team];
  const img=f?imgCache[BASE+'logos/'+f]:null;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.translate(cx,cy);ctx.rotate(rot*Math.PI/180);
  if(img){
    const scale=Math.min(size/img.width,size/img.height)*.9;
    const dw=img.width*scale,dh=img.height*scale;
    ctx.shadowColor='rgba(0,0,0,0.7)';ctx.shadowBlur=16;ctx.shadowOffsetY=4;
    ctx.drawImage(img,-dw/2,-dh/2,dw,dh);
    ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  } else {
    const tc=TEAM_COL[team]||'#888';
    ctx.beginPath();ctx.arc(0,0,size*.42,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fill();
    ctx.strokeStyle=tc;ctx.lineWidth=3;ctx.stroke();
    const init=team.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,3);
    ctx.fillStyle=tc;ctx.font=`900 ${size*.32}px 'Barlow Condensed',sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(init,0,1);
  }
  ctx.restore();
}

// ─── HEADER TEXT (Season/Race/Track/Division/RaceType) ─────────────────────
function drawHeader(ctx, info, div, alpha){
  ctx.save();ctx.globalAlpha=alpha;

  // Season + Race — top right, stencil font
  ctx.textAlign='right';ctx.textBaseline='top';
  ctx.shadowColor='rgba(0,0,0,0.95)';ctx.shadowBlur=12;ctx.shadowOffsetY=2;

  ctx.font=`64px 'Black Ops One',cursive`;
  ctx.fillStyle='#d8d0b0';
  ctx.fillText(`SEASON ${info.season}`, W-44, 44);

  ctx.font=`50px 'Black Ops One',cursive`;
  ctx.fillStyle='#c0b898';
  ctx.fillText(`RACE ${info.raceNum}`, W-44, 118);

  // Track name — big brushstroke centre
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.font=`130px 'Boogaloo',cursive`;
  ctx.fillStyle='#ffffff';
  ctx.shadowBlur=20;ctx.shadowColor='rgba(0,0,0,0.9)';
  // Auto-shrink track name
  let tfs=130;
  ctx.font=`${tfs}px 'Boogaloo',cursive`;
  while(ctx.measureText(info.track.toUpperCase()).width>W-80&&tfs>60){
    tfs--;ctx.font=`${tfs}px 'Boogaloo',cursive`;
  }
  ctx.fillText(info.track.toUpperCase(), W/2, 188);

  // Division + Race Type — stencil
  ctx.shadowBlur=10;
  if(div){
    ctx.font=`46px 'Black Ops One',cursive`;
    ctx.fillStyle='#c8c0a0';
    ctx.fillText(`DIVISION ${div.num}`, W/2, 188+tfs+8);

    ctx.font=`36px 'Black Ops One',cursive`;
    ctx.fillStyle='#a09880';
    ctx.fillText(info.raceType, W/2, 188+tfs+64);
  }

  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.restore();
}

// ─── RENDER: TITLE CARD ────────────────────────────────────────────────────
function renderTitle(ctx, info, t, fi){
  drawBg(ctx, null, 0);

  const lines=[
    {fn:()=>drawHeader(ctx,info,null,easeOut5(clamp(t*T_TITLE/1.2,0,1))), delay:0},
  ];

  // Subtle fade in
  const env=easeOut3(clamp(t/0.3,0,1));
  drawHeader(ctx, info, null, env);

  // Fade out at end
  if(t>0.75){
    ctx.fillStyle=`rgba(0,0,0,${easeIO2((t-0.75)/0.25)})`;
    ctx.fillRect(0,0,W,H);
  }
}

// ─── RENDER: RESULTS CARD ──────────────────────────────────────────────────
function renderResults(ctx, div, info, t, fi){
  // Apply division colour tint to background
  const tintA=0.22;
  drawBg(ctx, div.tint, tintA);

  const dur=T_RESULTS;
  const env=easeOut3(clamp(t/0.08,0,1))*(t>0.9?easeIO2(1-(t-0.9)/0.1):1);

  // Header — always present
  drawHeader(ctx, info, div, env);

  // ── Driver entries ──
  // Layout from the mockup:
  // P1: spray num left (~x130), logo right of num (~x240), tape strip below spanning left-to-centre
  // P2: logo left-centre (~x380), spray num right of logo (~x500), tape strip below spanning centre-right
  // P3: spray num left (~x110), logo right of num (~x230), tape strip below spanning left

  const entries=[
    {
      pos:1,
      numX:110, numY:620, numSize:115, numRot:-4,
      logoX:255, logoY:600, logoSize:100, logoRot:5,
      tapeX:270, tapeY:730, tapeW:420, tapeRot:-2.5,
      delay:0.08,
    },
    {
      pos:2,
      numX:530, numY:860, numSize:105, numRot:3,
      logoX:390, logoY:845, logoSize:95, logoRot:-4,
      tapeX:430, tapeY:960, tapeW:400, tapeRot:1.8,
      delay:0.28,
    },
    {
      pos:3,
      numX:105, numY:1070, numSize:100, numRot:-5,
      logoX:240, logoY:1058, logoSize:90, logoRot:6,
      tapeX:240, tapeY:1155, tapeW:400, tapeRot:-3,
      delay:0.48,
    },
  ];

  entries.forEach(e=>{
    const rp=Math.max(0,(t*dur-e.delay)/0.4);
    const alpha=Math.min(rp*2.5,1)*env;
    const slide=(1-easeOut5(Math.min(rp,1)))*( e.pos===2 ? 350 : -350 );
    if(alpha<=0) return;

    ctx.save();
    ctx.translate(slide,0);

    // Spray number
    ctx.globalAlpha=alpha;
    drawSprayNum(ctx, e.pos, e.numX, e.numY, e.numSize, e.numRot);

    // Team logo
    drawLogo(ctx, div.podium[e.pos-1].team, e.logoX, e.logoY, e.logoSize, e.logoRot, alpha);

    // Tape with driver name
    drawTape(ctx, div.podium[e.pos-1].name, e.tapeX, e.tapeY, e.tapeW, e.tapeRot, alpha);

    ctx.restore();
  });
}

// ─── MASTER RENDERER ───────────────────────────────────────────────────────
function renderFrame(ctx, info, gT, fi){
  if(gT<T_TITLE){
    renderTitle(ctx, info, gT/T_TITLE, fi);
    return;
  }
  const divT=gT-T_TITLE;
  const divIdx=Math.floor(divT/T_RESULTS);
  const segT=(divT%T_RESULTS)/T_RESULTS;

  if(divIdx>=info.divs.length){
    // Hold last bg
    drawBg(ctx, info.divs[info.divs.length-1].tint, 0.22);
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    return;
  }
  renderResults(ctx, info.divs[divIdx], info, segT, fi);
}

// ─── GENERATE ──────────────────────────────────────────────────────────────
function setProgress(pct,label){
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progLabel').textContent=label;
}

async function loadIntroVideo(){
  return new Promise(resolve=>{
    const vid=document.getElementById('introVid');
    vid.src=INTRO_SRC;
    vid.onloadedmetadata=()=>resolve({el:vid,duration:vid.duration});
    vid.onerror=()=>{console.warn('No intro video');resolve(null);};
    vid.load();
  });
}

async function startGenerate(){
  const btn=document.getElementById('genBtn');
  const pa=document.getElementById('progArea');
  btn.disabled=true;pa.style.display='block';
  setProgress(2,'Loading assets...');

  const data=getFormData();
  await preloadAll(data.divs);
  setProgress(10,'Loading intro...');

  const intro=await loadIntroVideo();
  const introDur=intro?intro.duration:0;
  setProgress(15,'Setting up audio...');

  // Audio context
  const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  let musicSource=null;

  try{
    const resp=await fetch(MUSIC_SRC);
    const buf=await resp.arrayBuffer();
    const musicBuf=await audioCtx.decodeAudioData(buf);
    musicSource=audioCtx.createBufferSource();
    musicSource.buffer=musicBuf;
    musicSource.loop=true;
  }catch(e){console.warn('Music load failed:',e);}

  setProgress(20,'Starting render...');

  const canvas=document.getElementById('renderCanvas');
  const ctx=canvas.getContext('2d');

  const dest=audioCtx.createMediaStreamDestination();
  if(musicSource){musicSource.connect(dest);musicSource.start(0);}

  const videoStream=canvas.captureStream(FPS);
  const combined=new MediaStream([
    ...videoStream.getVideoTracks(),
    ...dest.stream.getAudioTracks(),
  ]);

  const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
    .find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';

  const chunks=[];
  const recorder=new MediaRecorder(combined,{mimeType:mime,videoBitsPerSecond:12_000_000});
  recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  recorder.start(100);

  // ── Intro frames ──
  if(intro){
    const introFrames=Math.ceil(introDur*FPS);
    intro.el.currentTime=0;

    await new Promise(resolve=>{
      let f=0;
      function nextFrame(){
        if(f>=introFrames){resolve();return;}
        const targetT=f/FPS;
        intro.el.currentTime=targetT;
        intro.el.onseeked=()=>{
          const vw=intro.el.videoWidth,vh=intro.el.videoHeight;
          const scale=Math.max(W/vw,H/vh);
          ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
          ctx.drawImage(intro.el,(W-vw*scale)/2,(H-vh*scale)/2,vw*scale,vh*scale);
          f++;
          if(f%15===0) setProgress(20+Math.round((f/introFrames)*8),`Intro · ${f}/${introFrames}`);
          requestAnimationFrame(nextFrame);
        };
      }
      nextFrame();
    });
    intro.el.pause();
  }

  // ── Generated frames ──
  const totalDur=T_TITLE+data.divs.length*T_RESULTS;
  const totalFrames=Math.ceil(totalDur*FPS);
  let frame=0;

  await new Promise(resolve=>{
    function next(){
      if(frame>=totalFrames){resolve();return;}
      renderFrame(ctx,data,frame/FPS,frame);
      frame++;
      if(frame%20===0){
        const pct=28+Math.round((frame/totalFrames)*66);
        const gT=frame/FPS;
        const dIdx=Math.max(0,Math.floor((gT-T_TITLE)/T_RESULTS));
        const stage=gT<T_TITLE?'Title card':`Division ${Math.min(dIdx+1,data.divs.length)} of ${data.divs.length}`;
        setProgress(pct,`${stage} · Frame ${frame}/${totalFrames}`);
      }
      requestAnimationFrame(next);
    }
    next();
  });

  if(musicSource) try{musicSource.stop();}catch(e){}
  audioCtx.close();
  recorder.stop();
  await new Promise(r=>recorder.onstop=r);
  setProgress(97,'Packaging...');

  const blob=new Blob(chunks,{type:mime});
  const fname=`F1XL_S${data.season}_R${data.raceNum}_${data.track.replace(/\s+/g,'_')}_Results.webm`;
  setProgress(100,'Done — downloading!');

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  setTimeout(()=>{btn.disabled=false;pa.style.display='none';setProgress(0,'');},2500);
}

buildDivisions();
</script>
