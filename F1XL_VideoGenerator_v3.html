<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1XL · Video Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Barlow+Condensed:wght@300;400;700;900&family=Special+Elite&family=Oswald:wght@400;700&display=swap');
:root{--bg:#0a0806;--surface:#141210;--border:rgba(255,255,255,0.07);--accent:#cc1e1e;--text:#ede8e0;--muted:rgba(237,232,224,0.38);--yellow:#f5e642;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh;padding:2rem 1.5rem 4rem;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.007) 0,rgba(255,255,255,0.007) 1px,transparent 1px,transparent 10px),
  repeating-linear-gradient(-45deg,rgba(255,255,255,0.005) 0,rgba(255,255,255,0.005) 1px,transparent 1px,transparent 14px);}
header{text-align:center;margin-bottom:3rem;padding-top:1rem;}
.hdr-top{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:4px;}
.hdr-a{font-family:'Permanent Marker',cursive;font-size:2rem;color:var(--accent);opacity:.7;display:inline-block;}
.hdr-t{font-family:'Permanent Marker',cursive;font-size:3rem;color:var(--yellow);transform:rotate(-1deg);display:inline-block;text-shadow:3px 3px 0 rgba(0,0,0,.6);}
.hdr-s{font-family:'Special Elite',cursive;font-size:.85rem;color:var(--muted);letter-spacing:.22em;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.5rem;margin-bottom:1.4rem;max-width:900px;margin-left:auto;margin-right:auto;}
.card-title{font-family:'Oswald',sans-serif;font-size:.72rem;letter-spacing:.28em;color:var(--accent);text-transform:uppercase;margin-bottom:1.1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.9rem;}
.form-group{display:flex;flex-direction:column;gap:5px;}
label{font-size:.68rem;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;font-family:'Oswald',sans-serif;}
input,select{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:1rem;padding:8px 10px;transition:border-color .2s;width:100%;}
input:focus,select:focus{outline:none;border-color:var(--accent);}
select option{background:#141210;}
.div-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;}
.count-ctrl{display:flex;align-items:center;gap:10px;}
.count-btn{width:30px;height:30px;border-radius:4px;border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--text);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s,background .2s;line-height:1;}
.count-btn:hover{border-color:var(--accent);background:rgba(204,30,30,.1);}
.count-num{font-family:'Permanent Marker',cursive;font-size:1.4rem;color:var(--yellow);min-width:24px;text-align:center;}
.div-block{border:1px solid var(--border);border-radius:6px;padding:1.1rem;margin-bottom:.9rem;}
.div-lbl{font-family:'Permanent Marker',cursive;font-size:1rem;margin-bottom:.9rem;display:flex;align-items:center;gap:9px;}
.div-sw{width:13px;height:13px;border-radius:3px;flex-shrink:0;}
.podium-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;}
.podium-slot{display:flex;flex-direction:column;gap:5px;}
.pos-lbl{font-size:.63rem;font-weight:700;letter-spacing:.1em;padding:2px 7px;border-radius:3px;display:inline-block;margin-bottom:1px;}
.p1l{background:#d4a000;color:#1a0d00;}.p2l{background:#888;color:#111;}.p3l{background:#7a3d1a;color:#ffd0a0;}
.gen-btn{width:100%;max-width:900px;display:block;margin:0 auto;padding:1.15rem;background:var(--accent);border:none;border-radius:6px;color:#fff;font-family:'Permanent Marker',cursive;font-size:1.55rem;cursor:pointer;transform:rotate(-.4deg);transition:transform .15s,background .2s,box-shadow .2s;box-shadow:3px 3px 0 rgba(0,0,0,.45);}
.gen-btn:hover{background:#e02020;transform:rotate(-.4deg) scale(1.01);box-shadow:5px 5px 0 rgba(0,0,0,.55);}
.gen-btn:disabled{background:#3a3a3a;cursor:not-allowed;transform:none;box-shadow:none;}
.prog-area{display:none;margin:1.4rem auto 0;max-width:900px;}
.prog-label{font-family:'Special Elite',cursive;font-size:.84rem;color:var(--muted);margin-bottom:7px;text-align:center;}
.prog-outer{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
.prog-inner{height:100%;background:linear-gradient(90deg,var(--accent),var(--yellow));border-radius:3px;width:0%;transition:width .25s;}
.note{font-family:'Special Elite',cursive;font-size:.76rem;color:var(--muted);text-align:center;margin:1rem auto 0;max-width:900px;line-height:1.7;}
.note span{color:var(--yellow);}
#renderCanvas{display:none;}
#introVid,#musicAud{display:none;}
</style>
</head>
<body>

<header>
  <div class="hdr-top">
    <span class="hdr-a" style="transform:rotate(-8deg)">Ⓐ</span>
    <span class="hdr-t">F1XL</span>
    <span class="hdr-a" style="transform:rotate(6deg)">Ⓐ</span>
  </div>
  <div class="hdr-s">Race Results · Video Generator</div>
</header>

<div class="card">
  <div class="card-title">Race Info</div>
  <div class="form-row">
    <div class="form-group"><label>Season</label><input type="number" id="season" value="28" min="1" max="99"></div>
    <div class="form-group"><label>Race Number</label><input type="number" id="raceNum" value="1" min="1" max="30"></div>
    <div class="form-group"><label>Track</label><input type="text" id="track" value="Bahrain"></div>
    <div class="form-group"><label>Race Type</label>
      <select id="raceType">
        <option value="FEATURE RACE">Feature Race</option>
        <option value="SPRINT RACE">Sprint Race</option>
        <option value="QUALIFYING">Qualifying</option>
      </select>
    </div>
  </div>
</div>

<div class="card">
  <div class="div-hdr">
    <div class="card-title" style="margin:0;border:none;padding:0;">Divisions</div>
    <div class="count-ctrl">
      <button class="count-btn" onclick="changeDivs(-1)">-</button>
      <div class="count-num" id="divNum">4</div>
      <button class="count-btn" onclick="changeDivs(1)">+</button>
    </div>
  </div>
  <div id="divsContainer"></div>
</div>

<button class="gen-btn" id="genBtn" onclick="startGenerate()">Generate Video</button>

<div class="prog-area" id="progArea">
  <div class="prog-label" id="progLabel">Starting...</div>
  <div class="prog-outer"><div class="prog-inner" id="progBar"></div></div>
</div>

<p class="note">Output: <span>.webm</span> — uploads directly to YouTube.<br>For Instagram/TikTok rename to <span>.mp4</span> or use free <span>HandBrake</span>.</p>

<canvas id="renderCanvas" width="720" height="1280"></canvas>
<video id="introVid" crossorigin="anonymous" playsinline muted></video>
<audio id="musicAud" crossorigin="anonymous"></audio>

<script>
'use strict';

// ─── ASSETS ────────────────────────────────────────────────────────────────
const ASSET_BASE = 'https://f1xl2010.github.io/video-gen/assets/';
const INTRO_SRC  = ASSET_BASE + 'video/F1XL logoclip.mp4';
const MUSIC_SRC  = ASSET_BASE + 'music/instrumental_backing1.mp3';

const F1_TEAMS = ['Alpine','Aston Martin','Audi','Cadillac','Ferrari','Haas','McLaren','Mercedes','Racing Bull','Red Bull','Williams','Reserve'];

const LOGO_FILES = {
  'Alpine':'logo_alpine.png','Aston Martin':'logo_aston-martin.png',
  'Audi':'logo_audi.png','Cadillac':'logo_cadillac.png',
  'Ferrari':'logo_ferrari.png','Haas':'logo_haas.png',
  'McLaren':'logo_mclaren.png','Mercedes':'logo_mercedes.png',
  'Racing Bull':'logo_racing-bulls.png','Red Bull':'logo_red-bull.png',
  'Williams':'logo_williams.png','Reserve':'logo_reserve.png',
};

const TEAM_COL = {
  'Alpine':'#479FE2','Aston Martin':'#4B9774','Audi':'#C0C0C0','Cadillac':'#AAAADD',
  'Ferrari':'#D52E37','Haas':'#CC1111','McLaren':'#EF8733','Mercedes':'#75F1D3',
  'Racing Bull':'#7091F8','Red Bull':'#4570C0','Williams':'#3267D4','Reserve':'#ffffff',
};

const DIV_COL = [null,
  {main:'#D44444',dark:'#8B1A1A',bg:'#1a0404'},
  {main:'#C8941A',dark:'#7A5A00',bg:'#18120a'},
  {main:'#A0C020',dark:'#5A7A00',bg:'#0e1300'},
  {main:'#20C060',dark:'#007A30',bg:'#031409'},
  {main:'#20A8C0',dark:'#006A80',bg:'#031214'},
  {main:'#3050D8',dark:'#1030A0',bg:'#030914'},
  {main:'#8830CC',dark:'#5010A0',bg:'#0c0314'},
  {main:'#CC2880',dark:'#900050',bg:'#140312'},
];

// Timing (seconds)
const FPS=30, W=720, H=1280;
const T_TITLE=2.0, T_TRANS=3.0, T_RESULTS=4.0;

// ─── STATE ─────────────────────────────────────────────────────────────────
let divCount=4;
const imgCache={};

// ─── PARTICLES ─────────────────────────────────────────────────────────────
// Each particle is a light streak
const pPools={};

function initParticles(divIdx, colour) {
  const count=50;
  pPools[divIdx]=Array.from({length:count},(_,i)=>({
    x: Math.random()*W,
    y: Math.random()*H, // pre-scatter on init
    vx:(Math.random()-.5)*1.4,
    vy:-(1.8+Math.random()*4),
    len:30+Math.random()*140,
    w:  0.4+Math.random()*2,
    a:  0.3+Math.random()*0.55,
    col:colour,
  }));
}

function stepParticles(divIdx, colour) {
  if(!pPools[divIdx]) initParticles(divIdx, colour);
  const pool=pPools[divIdx];
  pool.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.y+p.len<0){
      // reset to bottom
      p.x=Math.random()*W;
      p.y=H+20;
      p.vx=(Math.random()-.5)*1.4;
      p.vy=-(1.8+Math.random()*4);
      p.len=30+Math.random()*140;
      p.w=0.4+Math.random()*2;
      p.a=0.3+Math.random()*0.55;
      p.col=colour;
    }
  });
}

function drawParticles(ctx, divIdx) {
  const pool=pPools[divIdx];
  if(!pool) return;
  pool.forEach(p=>{
    ctx.save();
    ctx.globalAlpha=p.a;
    ctx.strokeStyle=p.col;
    ctx.lineWidth=p.w;
    ctx.lineCap='round';
    // gradient along streak
    const grd=ctx.createLinearGradient(p.x,p.y,p.x+p.vx*15,p.y-p.len);
    grd.addColorStop(0,'transparent');
    grd.addColorStop(0.5,p.col);
    grd.addColorStop(1,'transparent');
    ctx.strokeStyle=grd;
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.x+p.vx*15,p.y-p.len);
    ctx.stroke();
    ctx.restore();
  });
}

// ─── UI ────────────────────────────────────────────────────────────────────
function teamOpts(di){
  return F1_TEAMS.map((t,i)=>`<option value="${t}"${i===di?' selected':''}>${t}</option>`).join('');
}

function buildDivisions(){
  const c=document.getElementById('divsContainer');
  c.innerHTML='';
  for(let i=1;i<=divCount;i++){
    const dc=DIV_COL[i]||DIV_COL[1];
    c.innerHTML+=`
    <div class="div-block" style="border-color:${dc.main}44">
      <div class="div-lbl"><div class="div-sw" style="background:${dc.main}"></div>Division ${i}</div>
      <div class="podium-grid">
        <div class="podium-slot"><span class="pos-lbl p1l">P1</span>
          <input type="text" id="d${i}p1n" placeholder="Driver name">
          <select id="d${i}p1t">${teamOpts(9)}</select></div>
        <div class="podium-slot"><span class="pos-lbl p2l">P2</span>
          <input type="text" id="d${i}p2n" placeholder="Driver name">
          <select id="d${i}p2t">${teamOpts(6)}</select></div>
        <div class="podium-slot"><span class="pos-lbl p3l">P3</span>
          <input type="text" id="d${i}p3n" placeholder="Driver name">
          <select id="d${i}p3t">${teamOpts(4)}</select></div>
      </div>
    </div>`;
  }
  document.getElementById('divNum').textContent=divCount;
}

function changeDivs(d){divCount=Math.max(1,Math.min(8,divCount+d));buildDivisions();}

function getFormData(){
  const divs=[];
  for(let i=1;i<=divCount;i++){
    const dc=DIV_COL[i]||DIV_COL[1];
    divs.push({num:i,colour:dc.main,dark:dc.dark,bgColour:dc.bg,
      podium:[1,2,3].map(p=>({
        name:(document.getElementById(`d${i}p${p}n`).value.trim()||'TBC'),
        team:document.getElementById(`d${i}p${p}t`).value,
      }))
    });
  }
  return {
    season:document.getElementById('season').value,
    raceNum:document.getElementById('raceNum').value,
    track:document.getElementById('track').value.trim()||'TBC',
    raceType:document.getElementById('raceType').value,
    divs,
  };
}

// ─── IMAGE LOADING ─────────────────────────────────────────────────────────
function loadImg(src){
  if(imgCache[src]) return Promise.resolve(imgCache[src]);
  return new Promise(resolve=>{
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{imgCache[src]=img;resolve(img);};
    img.onerror=()=>{console.warn('Logo failed:',src);resolve(null);};
    img.src=src;
  });
}

async function preloadLogos(divs){
  const teams=new Set();
  divs.forEach(d=>d.podium.forEach(p=>teams.add(p.team)));
  await Promise.all([...teams].map(t=>{
    const f=LOGO_FILES[t];
    return f?loadImg(ASSET_BASE+'logos/'+f):Promise.resolve();
  }));
}

// Load intro video — returns {el, duration} or null
async function loadIntroVideo(){
  return new Promise(resolve=>{
    const vid=document.getElementById('introVid');
    vid.src=INTRO_SRC;
    vid.onloadedmetadata=()=>resolve({el:vid,duration:vid.duration});
    vid.onerror=()=>{console.warn('Intro video not found');resolve(null);};
    vid.load();
  });
}

// ─── HELPERS ───────────────────────────────────────────────────────────────
function hex2rgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function easeOut3(t){return 1-Math.pow(1-Math.min(t,1),3);}
function easeOut5(t){return 1-Math.pow(1-Math.min(t,1),5);}
function easeIO2(t){t=Math.min(t,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function srand(s){return Math.abs(Math.sin(s+1)*43758.5453)%1;}

// ─── BACKGROUND ────────────────────────────────────────────────────────────
function drawBg(ctx, colour, dark, bgColour, fi, divIdx){
  // Rich dark base with colour tint
  const r=parseInt(bgColour.slice(1,3),16),
        g=parseInt(bgColour.slice(3,5),16),
        b=parseInt(bgColour.slice(5,7),16);
  ctx.fillStyle=bgColour;
  ctx.fillRect(0,0,W,H);

  // Large sweeping radials — much more aggressive colour
  let grd=ctx.createRadialGradient(W*.85,H*.9,0,W*.85,H*.9,W*1.05);
  grd.addColorStop(0,hex2rgba(colour,.7));
  grd.addColorStop(0.35,hex2rgba(colour,.35));
  grd.addColorStop(0.7,hex2rgba(dark,.15));
  grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

  grd=ctx.createRadialGradient(W*.05,H*.05,0,W*.05,H*.05,W*.9);
  grd.addColorStop(0,hex2rgba(colour,.45));
  grd.addColorStop(0.5,hex2rgba(dark,.2));
  grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

  // Mid diagonal sweep
  grd=ctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,W*.65);
  grd.addColorStop(0,hex2rgba(colour,.18));
  grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

  // Animated particles
  if(divIdx>=0){
    stepParticles(divIdx,colour);
    drawParticles(ctx,divIdx);
  }

  // Vignette — darkens edges to keep text readable
  const vig=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.85);
  vig.addColorStop(0,'transparent');
  vig.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);

  // Grid lines
  ctx.strokeStyle='rgba(255,255,255,0.028)';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Scanlines
  ctx.fillStyle='rgba(0,0,0,0.04)';
  for(let y=0;y<H;y+=4) ctx.fillRect(0,y+2,W,2);

  // Film grain
  const idata=ctx.createImageData(W,H),dd=idata.data;
  for(let i=0;i<dd.length;i+=16){
    const px=(i/4)%W,py=Math.floor((i/4)/W);
    const n=srand(px*13+py*7+(fi%60)*7)*24;
    dd[i]=n;dd[i+1]=n;dd[i+2]=n;dd[i+3]=26;
  }
  ctx.putImageData(idata,0,0);

  // Top & bottom colour bars
  const bar=ctx.createLinearGradient(0,0,W,0);
  bar.addColorStop(0,'transparent');bar.addColorStop(.2,colour);
  bar.addColorStop(.8,colour);bar.addColorStop(1,'transparent');
  ctx.fillStyle=bar;
  ctx.fillRect(0,0,W,10);
  ctx.fillRect(0,H-7,W,7);
}

// ─── TITLE CARD ────────────────────────────────────────────────────────────
function renderTitleCard(ctx,info,t,fi){
  drawBg(ctx,'#888888','#444444','#111111',fi,-1);
  const env=easeOut3(clamp(t/0.2,0,1))*(t>0.8?easeIO2(1-(t-0.8)/0.2):1);
  const lines=[
    {text:`SEASON ${info.season}`,font:`900 96px 'Barlow Condensed',sans-serif`,delay:0.03},
    {text:`RACE ${info.raceNum}`, font:`700 66px 'Barlow Condensed',sans-serif`, delay:0.18},
    {text:info.track.toUpperCase(),font:`300 76px 'Barlow Condensed',sans-serif`,delay:0.33},
  ];
  const startY=H*.3;
  lines.forEach((l,i)=>{
    const p=easeOut5(clamp((t*T_TITLE-l.delay)/0.35,0,1));
    ctx.save();
    ctx.globalAlpha=env*p;
    ctx.translate(0,(1-p)*-70);
    ctx.font=l.font;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,0.95)';ctx.shadowBlur=22;ctx.shadowOffsetY=4;
    ctx.fillStyle='#ffffff';
    ctx.fillText(l.text,W/2,startY+i*108);
    ctx.restore();
  });
  ctx.save();
  ctx.globalAlpha=env*0.18;
  ctx.strokeStyle='#ffffff';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(80,startY+60);ctx.lineTo(W-80,startY+62);ctx.stroke();
  ctx.restore();
}

// ─── TRANSITION CARD ───────────────────────────────────────────────────────
function renderTransCard(ctx,div,info,t,fi){
  drawBg(ctx,div.colour,div.dark,div.bgColour,fi,div.num-1);
  const env=easeOut3(clamp(t/0.1,0,1))*(t>0.82?easeIO2(1-(t-0.82)/0.18):1);

  ctx.save();ctx.globalAlpha=env;ctx.textAlign='center';ctx.textBaseline='middle';
  const hLines=[
    {text:`SEASON ${info.season}`,font:`900 72px 'Barlow Condensed',sans-serif`},
    {text:`RACE ${info.raceNum}`, font:`700 52px 'Barlow Condensed',sans-serif`},
    {text:info.track.toUpperCase(),font:`300 60px 'Barlow Condensed',sans-serif`},
  ];
  hLines.forEach((l,i)=>{
    ctx.font=l.font;
    ctx.shadowColor='rgba(0,0,0,0.95)';ctx.shadowBlur=18;ctx.shadowOffsetY=3;
    ctx.fillStyle='#ffffff';
    ctx.fillText(l.text,W/2,100+i*88);
  });
  ctx.restore();

  // Horizontal rule
  ctx.save();ctx.globalAlpha=env*0.22;
  ctx.strokeStyle='#ffffff';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(60,372);ctx.lineTo(W-60,374);ctx.stroke();
  ctx.restore();

  // Division number slams in
  const dp=easeOut5(clamp((t*T_TRANS-0.2)/0.45,0,1));
  const ds=(1-dp)*-160;
  ctx.save();
  ctx.globalAlpha=env*Math.min(dp*3,1);
  ctx.translate(0,ds);
  ctx.textAlign='center';ctx.textBaseline='middle';

  ctx.font=`700 32px 'Oswald',sans-serif`;
  ctx.fillStyle=div.colour;
  ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=12;
  ctx.fillText('DIVISION',W/2,H*0.50);

  ctx.font=`900 210px 'Barlow Condensed',sans-serif`;
  ctx.fillStyle='#ffffff';
  ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=35;ctx.shadowOffsetY=10;
  ctx.fillText(div.num,W/2,H*0.67);
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;

  // Underline bar
  const ug=ctx.createLinearGradient(0,0,W,0);
  ug.addColorStop(0,'transparent');ug.addColorStop(0.25,div.colour);
  ug.addColorStop(0.75,div.colour);ug.addColorStop(1,'transparent');
  ctx.fillStyle=ug;ctx.fillRect(0,H*.77,W,6);
  ctx.restore();

  if(t>0.8){
    ctx.fillStyle=hex2rgba(div.bgColour,easeIO2((t-0.8)/0.2));
    ctx.fillRect(0,0,W,H);
  }
}

// ─── RESULTS CARD ──────────────────────────────────────────────────────────
function drawPosBadge(ctx,pos,cx,cy,size,rot,alpha){
  const cols=[{bg:'#D4A000',text:'#1a0d00'},{bg:'#787878',text:'#eee'},{bg:'#7A3D1A',text:'#FFD0A0'}];
  const c=cols[pos-1];
  ctx.save();ctx.globalAlpha=alpha;
  ctx.translate(cx,cy);ctx.rotate(rot*Math.PI/180);
  ctx.shadowColor='rgba(0,0,0,0.75)';ctx.shadowBlur=18;ctx.shadowOffsetX=3;ctx.shadowOffsetY=5;
  ctx.fillStyle=c.bg;
  ctx.beginPath();ctx.roundRect(-size/2,-size/2,size,size,size*.12);ctx.fill();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  ctx.strokeStyle=c.bg;ctx.lineWidth=2.5;ctx.globalAlpha=alpha*.28;
  ctx.setLineDash([7,5]);
  ctx.beginPath();ctx.roundRect(-size/2-6,-size/2-6,size+12,size+12,size*.12+4);ctx.stroke();
  ctx.setLineDash([]);ctx.globalAlpha=alpha;
  ctx.fillStyle=c.text;
  ctx.font=`900 ${size*.6}px 'Barlow Condensed',sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(pos,0,4);
  ctx.restore();
}

function drawLogo(ctx,team,cx,cy,size,rot,alpha){
  const f=LOGO_FILES[team];
  const img=f?imgCache[ASSET_BASE+'logos/'+f]:null;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.translate(cx,cy);ctx.rotate(rot*Math.PI/180);
  if(img){
    const scale=Math.min(size/img.width,size/img.height)*.9;
    const dw=img.width*scale,dh=img.height*scale;
    ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=14;ctx.shadowOffsetX=2;ctx.shadowOffsetY=3;
    ctx.drawImage(img,-dw/2,-dh/2,dw,dh);
    ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  } else {
    const tc=TEAM_COL[team]||'#888';
    ctx.beginPath();ctx.arc(0,0,size*.42,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fill();
    ctx.strokeStyle=tc;ctx.lineWidth=3;ctx.stroke();
    const init=team.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,3);
    ctx.fillStyle=tc;ctx.font=`900 ${size*.32}px 'Barlow Condensed',sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(init,0,1);
  }
  ctx.restore();
}

function drawChevron(ctx,text,cx,cy,bw,bh,bgCol,textCol,pointLeft,alpha){
  const hw=bw/2,hh=bh/2,pt=hh*.8;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,cy);
  ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=14;ctx.shadowOffsetX=2;ctx.shadowOffsetY=4;
  ctx.fillStyle=bgCol;ctx.beginPath();
  if(pointLeft){
    ctx.moveTo(-hw+pt,-hh);ctx.lineTo(hw,-hh);ctx.lineTo(hw,hh);
    ctx.lineTo(-hw+pt,hh);ctx.lineTo(-hw,0);
  } else {
    ctx.moveTo(-hw,-hh);ctx.lineTo(hw-pt,-hh);ctx.lineTo(hw,0);
    ctx.lineTo(hw-pt,hh);ctx.lineTo(-hw,hh);
  }
  ctx.closePath();ctx.fill();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  let fs=Math.floor(bh*.55);
  ctx.font=`900 ${fs}px 'Barlow Condensed',sans-serif`;
  const maxW=bw*.68;
  while(ctx.measureText(text).width>maxW&&fs>18){fs--;ctx.font=`900 ${fs}px 'Barlow Condensed',sans-serif`;}
  ctx.fillStyle=textCol;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,pointLeft?pt*.3:-pt*.3,1);
  ctx.restore();
}

// Full driver entry: badge + logo side by side above chevron banner
function drawEntry(ctx,pos,driver,cx,cy,prog,badgeRot,logoRot,bannerRot){
  const BADGE=84, LOGO=84, BW=320, BH=64;
  const alpha=Math.min(prog*2.5,1);
  if(alpha<=0) return;

  const isRight=(pos!==2);
  const slideX=(1-easeOut5(prog))*( isRight?480:-480 );

  // vertical positions
  const topY   = cy - BH*.7;    // badge + logo row
  const bannerY= cy + BH*.6;    // chevron banner row

  // Horizontal positions
  // badge and logo sit side by side, chevron fills remaining width
  const badgeX = isRight ? cx+BW*.5+14+BADGE*.5 : cx-BW*.5-14-BADGE*.5;
  const logoX  = isRight ? badgeX-BADGE*.5-10-LOGO*.5 : badgeX+BADGE*.5+10+LOGO*.5;

  ctx.save();
  ctx.translate(slideX,0);

  // Badge
  drawPosBadge(ctx,pos,badgeX,topY,BADGE,badgeRot,alpha);

  // Logo
  drawLogo(ctx,driver.team,logoX,topY,LOGO,logoRot,alpha);

  // Banner
  const bannerCols=[
    {bg:'#C8920A',text:'#1a0d00'},
    {bg:'#555555',text:'#ffffff'},
    {bg:'#6B3010',text:'#FFD0A0'},
  ];
  const bc=bannerCols[pos-1];

  ctx.save();
  ctx.translate(cx,bannerY);
  ctx.rotate(bannerRot*Math.PI/180);
  ctx.translate(-cx,-bannerY);
  drawChevron(ctx,driver.name,cx,bannerY,BW,BH,bc.bg,bc.text,!isRight,alpha);
  ctx.restore();

  ctx.restore();
}

function renderResultsCard(ctx,div,info,t,fi){
  drawBg(ctx,div.colour,div.dark,div.bgColour,fi,div.num-1);
  const env=easeOut3(clamp(t/0.07,0,1))*(t>0.93?easeIO2(1-(t-0.93)/0.07):1);

  // Header
  ctx.save();ctx.globalAlpha=env;ctx.textAlign='center';ctx.textBaseline='middle';
  const hLines=[
    {text:`SEASON ${info.season}`,font:`900 66px 'Barlow Condensed',sans-serif`},
    {text:`RACE ${info.raceNum}`, font:`700 48px 'Barlow Condensed',sans-serif`},
    {text:info.track.toUpperCase(),font:`300 54px 'Barlow Condensed',sans-serif`},
  ];
  hLines.forEach((l,i)=>{
    ctx.font=l.font;
    ctx.shadowColor='rgba(0,0,0,0.95)';ctx.shadowBlur=16;ctx.shadowOffsetY=3;
    ctx.fillStyle='#ffffff';ctx.fillText(l.text,W/2,86+i*76);
  });
  // Div label
  ctx.font=`700 22px 'Oswald',sans-serif`;
  ctx.fillStyle=div.colour;ctx.textAlign='left';
  ctx.fillText(`DIVISION ${div.num}`,W*.17,316);
  ctx.strokeStyle=hex2rgba(div.colour,.45);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W*.51,302);ctx.lineTo(W*.51,330);ctx.stroke();
  ctx.font=`italic 18px 'Special Elite',cursive`;
  ctx.fillStyle='rgba(255,255,255,.4)';
  ctx.fillText(info.raceType,W*.54,316);
  // Rule
  ctx.globalAlpha=env*.18;ctx.strokeStyle='#ffffff';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(50,344);ctx.lineTo(W-50,346);ctx.stroke();
  ctx.restore();

  // Driver entries — chaotic stagger with distinct rotations per position
  const entries=[
    {pos:1,cx:W*.58,cy:520, delay:0.08, badgeRot:-2.5, logoRot:5,  bannerRot:-1.8},
    {pos:2,cx:W*.42,cy:730, delay:0.25, badgeRot:2.0,  logoRot:-4, bannerRot:1.4},
    {pos:3,cx:W*.56,cy:940, delay:0.42, badgeRot:-3.0, logoRot:6,  bannerRot:-2.2},
  ];

  entries.forEach(e=>{
    const rp=Math.max(0,(t*T_RESULTS-e.delay)/0.45);
    ctx.save();ctx.globalAlpha=env;
    drawEntry(ctx,e.pos,div.podium[e.pos-1],e.cx,e.cy,rp,e.badgeRot,e.logoRot,e.bannerRot);
    ctx.restore();
  });

  // Footer
  ctx.save();ctx.globalAlpha=env*.2;
  ctx.font=`20px 'Permanent Marker',cursive`;ctx.fillStyle='#ffffff';
  ctx.textAlign='right';ctx.textBaseline='bottom';
  ctx.fillText('f1xl.co.uk',W-36,H-36);
  ctx.textAlign='left';ctx.fillText('Ⓐ',36,H-36);
  ctx.restore();
}

// ─── MASTER RENDERER ───────────────────────────────────────────────────────
function renderFrame(ctx,info,gT,fi){
  if(gT<T_TITLE){ renderTitleCard(ctx,info,gT/T_TITLE,fi); return; }
  const divT=gT-T_TITLE;
  const segDur=T_TRANS+T_RESULTS;
  const divIdx=Math.floor(divT/segDur);
  const segT=divT%segDur;
  if(divIdx>=info.divs.length){ ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H); return; }
  const div=info.divs[divIdx];
  if(segT<T_TRANS) renderTransCard(ctx,div,info,segT/T_TRANS,fi);
  else renderResultsCard(ctx,div,info,(segT-T_TRANS)/T_RESULTS,fi);
}

// ─── GENERATE ──────────────────────────────────────────────────────────────
function setProgress(pct,label){
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progLabel').textContent=label;
}

async function startGenerate(){
  const btn=document.getElementById('genBtn');
  const pa=document.getElementById('progArea');
  btn.disabled=true; pa.style.display='block';
  setProgress(2,'Loading assets...');

  const data=getFormData();

  // Load logos
  await preloadLogos(data.divs);
  setProgress(8,'Loading intro video...');

  // Load intro video
  const intro=await loadIntroVideo();
  const introDur=intro?intro.duration:0;
  setProgress(12,'Setting up audio...');

  // Setup audio context for music + canvas stream mixing
  const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  let musicSource=null, musicBuffer=null;

  try {
    const resp=await fetch(MUSIC_SRC);
    const arrBuf=await resp.arrayBuffer();
    musicBuffer=await audioCtx.decodeAudioData(arrBuf);
  } catch(e){ console.warn('Music not loaded:',e); }

  setProgress(16,'Starting render...');

  const canvas=document.getElementById('renderCanvas');
  const ctx=canvas.getContext('2d');

  // Create stream — mix canvas video + audio destination
  const dest=audioCtx.createMediaStreamDestination();
  const videoStream=canvas.captureStream(FPS);

  // Combine video tracks + audio track
  const combinedStream=new MediaStream([
    ...videoStream.getVideoTracks(),
    ...dest.stream.getAudioTracks(),
  ]);

  const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
    .find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';

  const chunks=[];
  const recorder=new MediaRecorder(combinedStream,{mimeType:mime,videoBitsPerSecond:12_000_000});
  recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  recorder.start(100);

  // Start music playing into audio context destination
  if(musicBuffer){
    musicSource=audioCtx.createBufferSource();
    musicSource.buffer=musicBuffer;
    musicSource.loop=true;
    musicSource.connect(dest);
    musicSource.start(0);
  }

  // ── Phase 1: Render intro video frames ──
  if(intro){
    const introFrames=Math.ceil(introDur*FPS);
    intro.el.currentTime=0;
    await intro.el.play().catch(()=>{});

    await new Promise(resolve=>{
      let f=0;
      function nextIntroFrame(){
        if(f>=introFrames){resolve();return;}
        // Draw video frame onto canvas (letterbox/fill to 720x1280)
        const vw=intro.el.videoWidth, vh=intro.el.videoHeight;
        const scale=Math.max(W/vw,H/vh);
        const dw=vw*scale,dh=vh*scale;
        ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
        ctx.drawImage(intro.el,(W-dw)/2,(H-dh)/2,dw,dh);
        f++;
        intro.el.currentTime=f/FPS;
        if(f%15===0) setProgress(16+Math.round((f/introFrames)*10),`Intro · Frame ${f}/${introFrames}`);
        requestAnimationFrame(nextIntroFrame);
      }
      nextIntroFrame();
    });
    intro.el.pause();
  }

  // ── Phase 2: Render generated content ──
  const totalDur=T_TITLE+data.divs.length*(T_TRANS+T_RESULTS);
  const totalFrames=Math.ceil(totalDur*FPS);
  let frame=0;

  await new Promise(resolve=>{
    function next(){
      if(frame>=totalFrames){resolve();return;}
      renderFrame(ctx,data,frame/FPS,frame);
      frame++;
      if(frame%20===0){
        const pct=26+Math.round((frame/totalFrames)*68);
        const gT=frame/FPS;
        const dIdx=Math.max(0,Math.floor((gT-T_TITLE)/(T_TRANS+T_RESULTS)));
        const stage=gT<T_TITLE?'Title':
          (gT-T_TITLE)%(T_TRANS+T_RESULTS)<T_TRANS?
          `Div ${dIdx+1} · Transition`:`Div ${dIdx+1} · Results`;
        setProgress(pct,`${stage} · Frame ${frame}/${totalFrames}`);
      }
      requestAnimationFrame(next);
    }
    next();
  });

  // Stop music, close audio
  if(musicSource) musicSource.stop();
  audioCtx.close();

  recorder.stop();
  await new Promise(r=>recorder.onstop=r);
  setProgress(97,'Packaging...');

  const blob=new Blob(chunks,{type:mime});
  const fname=`F1XL_S${data.season}_R${data.raceNum}_${data.track.replace(/\s+/g,'_')}_Results.webm`;
  setProgress(100,'Done — downloading!');

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  setTimeout(()=>{btn.disabled=false;pa.style.display='none';setProgress(0,'');},2500);
}

buildDivisions();
</script>
