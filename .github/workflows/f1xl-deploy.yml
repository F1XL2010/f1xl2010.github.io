name: Deploy F1XL Site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject cache version into service worker
        run: |
          COMMIT=$(echo "${{ github.sha }}" | cut -c1-8)
          sed -i "s/CACHE_VERSION/${COMMIT}/g" sw.js
          echo "Cache version set to: ${COMMIT}"

      - name: Commit updated service worker
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update sw cache version to ${{ github.sha }}"
          file_pattern: sw.js
