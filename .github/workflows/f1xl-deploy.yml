name: Deploy F1XL Site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject cache version into service worker
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.GITHUB_SHA.slice(0, 12);
          if (!/^[a-f0-9]{12}$/.test(version)) throw Error('Invalid release version');
          const file = fs.readFileSync('sw.js', 'utf8');
          if (!/^const VERSION = '[^']+';/m.test(file)) throw Error('Missing cache version');
          fs.writeFileSync('sw.js', file.replace(/^const VERSION = '[^']+';/m, `const VERSION = '${version}';`));
          console.log('Cache version set to: ' + version);
          NODE

      - name: Commit updated service worker
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update sw cache version to ${{ github.sha }}"
          file_pattern: sw.js
