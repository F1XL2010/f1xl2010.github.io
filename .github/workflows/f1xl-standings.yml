name: F1XL Standings

on:
  schedule:
    - cron: '0 12,18 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run standings bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_STANDINGS_CHANNEL_ID: ${{ secrets.DISCORD_STANDINGS_CHANNEL_ID }}
        run: node bot/standings.js
