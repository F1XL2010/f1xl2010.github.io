name: F1XL Application Alerts
run-name: Application alerts · ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: Application alert batch reference (no applicant details)
        required: true
        type: string

permissions:
  contents: write
concurrency:
  group: f1xl-application-alerts
  cancel-in-progress: false

jobs:
  application-message:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Send application alert through F1XLDataBot
        env:
          PORTAL_JOB: ${{ inputs.job }}
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node bot/application-alerts.cjs
