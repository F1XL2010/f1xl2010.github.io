<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1XL · SM Generators</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f0f0f;color:#ddd;font-family:'Barlow',sans-serif;min-height:100vh;padding:1.5rem;}
h1{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff;margin-bottom:4px;}
.subtitle{font-size:.75rem;color:#666;letter-spacing:1px;text-transform:uppercase;margin-bottom:1.5rem;}
.selector-row{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;}
.selector-row label{font-size:.8rem;color:#888;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;}
select.tool-select{background:#1a1a1a;border:1px solid #333;border-radius:4px;color:#fff;font-family:'Barlow',sans-serif;font-size:1rem;padding:8px 12px;cursor:pointer;min-width:280px;}
select.tool-select:focus{outline:none;border-color:#666;}
select option{background:#1a1a1a;}
.tool-section{display:none;}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;padding:1.2rem;margin-bottom:1rem;}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:3px;color:#888;text-transform:uppercase;margin-bottom:.9rem;padding-bottom:.5rem;border-bottom:1px solid #2a2a2a;}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin-bottom:.7rem;}
.form-group{display:flex;flex-direction:column;gap:4px;}
label.field-label{font-size:.65rem;color:#666;text-transform:uppercase;letter-spacing:1px;}
input,select.field-select{background:#111;border:1px solid #2a2a2a;border-radius:3px;color:#ddd;font-family:'Barlow',sans-serif;font-size:.9rem;padding:7px 9px;width:100%;transition:border-color .15s;}
input:focus,select.field-select:focus{outline:none;border-color:#555;}
select.field-select option{background:#111;}
.btn{display:inline-block;padding:.6rem 1.2rem;border:none;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:background .15s;}
.btn-primary{background:#e10600;color:#fff;}
.btn-primary:hover{background:#ff1a0e;}
.btn-primary:disabled{background:#333;color:#555;cursor:not-allowed;}
.btn-sec{background:#2a2a2a;color:#aaa;}
.btn-sec:hover{background:#333;color:#ddd;}
.btn-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:.8rem;}
.prog-area{display:none;margin-top:.8rem;}
.prog-label{font-size:.78rem;color:#666;margin-bottom:5px;}
.prog-outer{height:3px;background:#222;border-radius:2px;overflow:hidden;}
.prog-inner{height:100%;background:#e10600;border-radius:2px;width:0%;transition:width .2s;}
.status-msg{font-size:.78rem;padding:.4rem .7rem;border-radius:3px;margin-top:.5rem;display:none;}
.status-ok{background:#1a3a1a;color:#3DCC47;border:1px solid #2a5a2a;display:block;}
.status-err{background:#3a0a0a;color:#ff6b6b;border:1px solid #5a1a1a;display:block;}
.status-loading{background:#1a2a3a;color:#6ab0ff;border:1px solid #2a4a6a;display:block;}
.preview-canvas{max-width:320px;display:block;margin:0 auto;border:1px solid #2a2a2a;border-radius:4px;}
#renderCanvas{display:none;}
#renderCanvas2{display:none;}
</style>
</head>
<body>

<h1>F1XL · SM Generators</h1>
<p class="subtitle">Staff tools — not for public use</p>

<div class="selector-row">
  <label>What are you making?</label>
  <select class="tool-select" onchange="switchTool(this.value)">
    <option value="">— Select a generator —</option>
    <option value="race">Race Results &amp; Driver Standings</option>
    <option value="constructors">Constructors &amp; Overall Table</option>
  </select>
</div>

<!-- ══════════════════════════════════════════════════════════════════ -->
<!-- TOOL 1: RACE RESULTS & DRIVER STANDINGS                          -->
<!-- ══════════════════════════════════════════════════════════════════ -->
<div class="tool-section" id="section-race">
  <div class="card">
    <div class="card-title">Race Info</div>
    <div class="form-row">
      <div class="form-group"><label class="field-label">Season</label><input type="number" id="rc-season" value="28"></div>
      <div class="form-group"><label class="field-label">Grand Prix</label><input type="text" id="rc-gp" placeholder="e.g. Bahrain"></div>
      <div class="form-group"><label class="field-label">Round</label><input type="text" id="rc-round" placeholder="e.g. 1"></div>
      <div class="form-group"><label class="field-label">Total Rounds</label><input type="number" id="rc-totalRounds" value="21"></div>
      <div class="form-group"><label class="field-label">Race Date</label><input type="date" id="rc-dateRaw" onchange="rcFormatDate()"></div>
      <input type="hidden" id="rc-date" value="">
    </div>
    <div class="form-row">
      <div class="form-group"><label class="field-label">Division</label>
        <select id="rc-division" class="field-select">
          <option value="1">Division 1</option>
          <option value="2">Division 2</option>
          <option value="3">Division 3</option>
          <option value="4">Division 4</option>
        </select>
      </div>
      <div class="form-group"><label class="field-label">Show</label>
        <select id="rc-view" class="field-select">

  <div class="card" id="rc-output" style="display:none;">

    <canvas id="rc-preview" class="preview-canvas" width="720" height="1280"></canvas>
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn btn-primary" id="rc-genBtn" onclick="rcGenerate()">Generate Video</button>
      <button class="btn btn-sec" onclick="rcDownloadImage()">Download Image</button>
    </div>
    <div class="prog-area" id="rc-prog">
      <div class="prog-label" id="rc-prog-label">Rendering...</div>
      <div class="prog-outer"><div class="prog-inner" id="rc-prog-bar"></div></div>
    </div>
    <div class="status-msg" id="rc-gen-status"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════ -->
<!-- TOOL 2: CONSTRUCTORS & OVERALL TABLE                             -->
<!-- ══════════════════════════════════════════════════════════════════ -->
<div class="tool-section" id="section-constructors">
  <div class="card">
    <div class="card-title">Race Info</div>
    <div class="form-row">
      <div class="form-group"><label class="field-label">Season</label><input type="number" id="co-season" value="28"></div>
      <div class="form-group"><label class="field-label">Grand Prix</label><input type="text" id="co-gp" placeholder="e.g. Bahrain"></div>
      <div class="form-group"><label class="field-label">Round</label><input type="text" id="co-round" placeholder="e.g. 1"></div>
      <div class="form-group"><label class="field-label">Total Rounds</label><input type="number" id="co-totalRounds" value="21"></div>
      <div class="form-group"><label class="field-label">Race Date</label><input type="date" id="co-dateRaw" onchange="coFormatDate()"></div>
      <input type="hidden" id="co-date" value="">
    </div>
    <div class="form-row">
      <div class="form-group"><label class="field-label">View</label>
        <select id="co-view" class="field-select">
          <option value="1">Division 1 Constructors</option>
          <option value="2">Division 2 Constructors</option>
          <option value="3">Division 3 Constructors</option>

  <div class="card" id="co-output" style="display:none;">
    <div class="card-title">Output</div>
    <canvas id="co-preview" class="preview-canvas" width="720" height="1280"></canvas>
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn btn-primary" id="co-genBtn" onclick="coGenerate()">Generate Video</button>
      <button class="btn btn-sec" onclick="coDownloadImage()">Download Image</button>

    <div class="prog-area" id="co-prog">

</div>

<!-- Hidden canvases for rendering -->
<canvas id="renderCanvas" width="720" height="1280"></canvas>
<canvas id="renderCanvas2" width="1440" height="2560"></canvas>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
const CONFIG_SHEET_ID = '1ThIh7aKlGOuv83v9IJVSGpuspZLl0c9ajE0GJBpuCtk';
const CONFIG_GID      = '0';

// ── HELPERS ────────────────────────────────────────────────────────────────
function switchTool(val) {
  document.querySelectorAll('.tool-section').forEach(s => s.style.display = 'none');
  if (val) document.getElementById('section-' + val).style.display = 'block';
}

function showStatus(id, msg, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.className = 'status-msg status-' + type;
}

function setProgress(barId, labelId, pct, label) {
  const bar = document.getElementById(barId);
  const lbl = document.getElementById(labelId);
  if (bar) bar.style.width = pct + '%';
  if (lbl) lbl.textContent = label;
}

function parseCSV(text) {
  return text.split(/\r?\n/).filter(l => l.trim()).map(line => {
    const cells = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c==='"'&&!inQ){inQ=true;}
      else if(c==='"'&&inQ){if(line[i+1]==='"'){cur+='"';i++;}else{inQ=false;}}
      else if(c===','&&!inQ){cells.push(cur.trim());cur='';}
      else cur+=c;
    }
    cells.push(cur.trim());
    return cells;
  });
}

async function fetchCSV(sheetId, gid) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;
  const r = await fetch(url);
  const text = await r.text();
  if (text.includes('<!DOCTYPE')) throw new Error('Sheet not published or wrong GID');
  return text;
}

async function loadConfig() {
  const text = await fetchCSV(CONFIG_SHEET_ID, CONFIG_GID);
  const rows = parseCSV(text);
  const map = {};
  let extraHeaders = [];
  for (const r of rows) {
    const k = (r[0]||'').trim().toLowerCase().replace(/^"|"$/g,'');
    const v = (r[1]||'').trim().replace(/^"|"$/g,'');
    if (['tab gid from this document','new seasons','past seasons','key'].includes(k)) {
      extraHeaders = r.slice(2).map(h => (h||'').replace(/^"|"$/g,'').trim().toLowerCase()).filter(h => h);
      continue;
    }
    if (!k || !v || k === 'value' || k === 'hardcoded - dont touch') continue;
    map[k] = v;
    extraHeaders.forEach((hdr, i) => {
      const extra = (r[2+i]||'').replace(/^"|"$/g,'').trim();
      if (extra) map[k+'__'+hdr] = extra;
    });
  }
  return map;
}

async function getSeasonConfig(cfg) {
  let latest = 0, latestGid = null, latestKey = null;
  for (const k of Object.keys(cfg)) {
    const m = k.match(/^s(\d+)_gid$/);
    if (m) { const n = parseInt(m[1]); if (n > latest) { latest = n; latestGid = cfg[k]; latestKey = k; } }
  }
  if (!latestGid) return { season: latest, sc: {} };
  const text = await fetchCSV(CONFIG_SHEET_ID, latestGid);
  const rows = parseCSV(text);
  const sc = {};
  for (const r of rows) {
    const k = (r[0]||'').trim().toLowerCase().replace(/^"|"$/g,'');
    const v = (r[1]||'').trim().replace(/^"|"$/g,'');
    if (k && v) sc[k] = v;
  }
  // overall_gid / w_totals_gid live in the extra columns tied to this
  // season's row on the main config sheet, not inside the season tab itself.
  if (latestKey) {
    if (cfg[latestKey+'__overall_gid'])  sc['overall_gid']  = cfg[latestKey+'__overall_gid'];
    if (cfg[latestKey+'__w_totals_gid']) sc['w_totals_gid'] = cfg[latestKey+'__w_totals_gid'];
  }
  return { season: latest, sc };
}

function formatDate(dateStr) {
  // dateStr = dd/mm/yyyy
  const [d,m,y] = dateStr.split('/');
  if (!d||!m||!y) return dateStr;
  const dt = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[dt.getDay()]} ${parseInt(d)} ${months[dt.getMonth()]}`;
}

function rcFormatDate() {
  const raw = document.getElementById('rc-dateRaw').value;
  if (!raw) return;
  const [y,m,d] = raw.split('-');
  document.getElementById('rc-date').value = formatDate(`${d}/${m}/${y}`);
}

function coFormatDate() {
  const raw = document.getElementById('co-dateRaw').value;
  if (!raw) return;
  const [y,m,d] = raw.split('-');
  document.getElementById('co-date').value = formatDate(`${d}/${m}/${y}`);
}

async function findLatestRound(sheetId, calGid) {
  const text = await fetchCSV(sheetId, calGid);
  const rows = parseCSV(text);
  const now = new Date();
  let latestRound = null, latestTrack = '', latestDate = '';
  for (let i = 1; i < rows.length; i++) {
    const round   = (rows[i][0]||'').trim();
    const track   = (rows[i][3]||'').trim();
    const dateStr = (rows[i][2]||'').trim();
    if (!round || !track || !dateStr) continue;
    const [d,m,y] = dateStr.split('/');
    if (!d||!m||!y) continue;
    const raceDate = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
    if (raceDate <= now) { latestRound = round; latestTrack = track; latestDate = dateStr; }
  }
  return { latestRound, latestTrack, latestDate };
}

// ── RACE RESULTS POPULATE ─────────────────────────────────────────────────
async function rcPopulate() {
  showStatus('rc-status', 'Loading...', 'loading');
  try {
    const cfg = await loadConfig();
    const { season, sc } = await getSeasonConfig(cfg);
    document.getElementById('rc-season').value = season;

    const div     = document.getElementById('rc-division').value;
    const sheetId = sc[`d${div}_sheet_id`];
    const resGid  = sc[`d${div}_driver_results_gid`];
    const round   = document.getElementById('rc-round').value.trim();

    if (!sheetId) throw new Error(`No sheet ID for Division ${div}`);
    if (!round)   throw new Error('Please enter a round number first');

    // Fetch race results from R{round} tab
    window._rcRaceRows = [];
    window._rcSprintRows = [];
    const rTabGid = sc[`d${div}_r${round}_gid`];
    const SPRINT_ROUNDS = ['3','9','14','19'];
    const isSprintRound = SPRINT_ROUNDS.includes(String(round));

    if (rTabGid) {
      const rText = await fetchCSV(sheetId, rTabGid);
      const rRows = parseCSV(rText);

      // Find main race header — "Pos" where row above says "Race" or after row 20
      let raceHdr = -1;
      for (let i = 20; i < rRows.length; i++) {
        if ((rRows[i][0]||'').trim().toLowerCase() === 'pos') { raceHdr = i; break; }
      }
      if (raceHdr >= 0) {
        for (let i = raceHdr + 1; i < Math.min(raceHdr + 11, rRows.length); i++) {
          const pos    = (rRows[i][0]||'').trim();
          const driver = (rRows[i][3]||'').trim();
          const team   = (rRows[i][4]||'').trim();
          const pts    = parseFloat((rRows[i][7]||'0').replace(/,/g,'')) || 0;
          if (!driver || !pos || isNaN(parseInt(pos))) break;
          window._rcRaceRows.push({ pos: parseInt(pos), driver, team, pts });
        }
      }

      // For sprint rounds, also find sprint race section (header before row 20)
      if (isSprintRound) {
        let sprintHdr = -1;
        for (let i = 0; i < 20; i++) {
          if ((rRows[i][0]||'').trim().toLowerCase() === 'pos') { sprintHdr = i; break; }
        }
        if (sprintHdr >= 0) {
          for (let i = sprintHdr + 1; i < Math.min(sprintHdr + 11, rRows.length); i++) {
            const pos    = (rRows[i][0]||'').trim();
            const driver = (rRows[i][3]||'').trim();
            const team   = (rRows[i][4]||'').trim();
            const pts    = parseFloat((rRows[i][7]||'0').replace(/,/g,'')) || 0;
            if (!driver || !pos || isNaN(parseInt(pos))) break;
            window._rcSprintRows.push({ pos: parseInt(pos), driver, team, pts });
          }
        }
      }
    }

    // Fetch driver standings
    window._rcStandingsRows = [];
    if (resGid) {
      const sText = await fetchCSV(sheetId, resGid);
      const sRows = parseCSV(sText);
      let hRow = -1;
      for (let i = 0; i < sRows.length; i++) {
        if ((sRows[i][0]||'').trim().toLowerCase() === 'pos') { hRow = i; break; }
      }
      if (hRow >= 0) {
        const hd = sRows[hRow];
        let ptsCol = hd.findIndex(v => (v||'').toLowerCase().trim() === 'points');
        if (ptsCol < 0) {
          for (let c = hd.length-1; c >= 4; c--) { if ((hd[c]||'').trim()) { ptsCol = c; break; } }
        }
        const gapCol = hd.findIndex(v => (v||'').toLowerCase().trim() === 'gap');
        for (let i = hRow + 1; i < sRows.length; i++) {
          const driver = (sRows[i][2]||'').trim();
          const team   = (sRows[i][3]||'').trim();
          const pts    = parseFloat((sRows[i][ptsCol]||'0').replace(/,/g,'')) || 0;
          const gap    = gapCol >= 0 ? (sRows[i][gapCol]||'').trim() : '';
          if (!driver) break;
          window._rcStandingsRows.push({ driver, team, pts, gap });
        }
        // Sort by points descending and limit to top 10
        window._rcStandingsRows.sort((a,b) => b.pts - a.pts);
        window._rcStandingsRows = window._rcStandingsRows.slice(0, 10);
      }
    }

    showStatus('rc-status', `✓ R${round} — ${window._rcRaceRows.length} race results, ${window._rcStandingsRows.length} standings`, 'ok');
    document.getElementById('rc-output').style.display = 'block';

    const renderCanvas = document.getElementById('renderCanvas2');
    const previewCanvas = document.getElementById('rc-preview');
    const data = rcGetData();
    await loadF1Font();
    tbRenderFrame(renderCanvas.getContext('2d'), data, 0);
    // Scale down to preview canvas
    const pCtx = previewCanvas.getContext('2d');
    pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    pCtx.drawImage(renderCanvas, 0, 0, previewCanvas.width, previewCanvas.height);

  } catch(e) {
    showStatus('rc-status', `Error: ${e.message}`, 'err');
    console.error(e);
  }
}

function rcGetData() {
  const view = (document.getElementById('rc-view')||{}).value || 'standings';
  const isResults = view === 'results';
  const isSprint  = view === 'sprint';
  const div = document.getElementById('rc-division').value;

  const rows = isSprint
    ? (window._rcSprintRows || []).map(r => ({ team: r.team, driver: r.driver, pts: r.pts, pos: r.pos }))
    : isResults
      ? (window._rcRaceRows || []).map(r => ({ team: r.team, driver: r.driver, pts: r.pts, pos: r.pos }))
      : (window._rcStandingsRows || []).map(r => ({ team: r.team, driver: r.driver, pts: r.pts, gap: r.gap }));

  const mode = (isResults || isSprint) ? 'race' : 'standings';
  const divLabel = isSprint
    ? `Division ${div} — Sprint Results Top 10`
    : isResults
      ? `Division ${div} — Race Results Top 10`
      : `Division ${div} — Driver Standings Top 10`;

  return {
    season:      document.getElementById('rc-season').value,
    gp:          document.getElementById('rc-gp').value.trim(),
    round:       document.getElementById('rc-round').value.trim(),
    totalRounds: document.getElementById('rc-totalRounds').value,
    date:        document.getElementById('rc-date').value.trim(),
    time:        '21:00 BST',
    rows,
    nextGP: '', nextRound: '', nextDate: '', nextTime: '',
    divLeaders: [],
    trackInfo: null,
    mode,
    isRaceResults: isResults || isSprint,
    divLabel,
  };
}

// ── STATIC TABLE IMAGE RENDERER (no header, no animation) ──────────────────
function renderStaticTable(ctx, data) {
  const S = 2;
  const F1 = f1FontLoaded ? "'Formula1',sans-serif" : "'Barlow Condensed',sans-serif";
  const RW = 720*S, RH_PER_ROW = 64*S;
  const ML = 40*S, MR = 40*S;
  const CW = RW - ML - MR;
  const posColW = 56*S;
  const LOGO_MAX_W = 90*S;
  const LOGO_COL_W = LOGO_MAX_W + 16*S;
  const headerH = 56*S;
  const rows = data.rows || [];
  const numRows = rows.length;
  const RH = headerH * 2 + numRows * RH_PER_ROW + 24*S; // div label + col header + rows + padding

  // Resize canvas to fit content exactly
  ctx.canvas.width = RW;
  ctx.canvas.height = RH;

  // Background
  ctx.fillStyle = '#111816';
  ctx.fillRect(0, 0, RW, RH);

  let y = 16*S;

  // Division label row
  if (data.divLabel) {
    ctx.font = `400 ${20*S}px ${F1}`;
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText((data.divLabel||'').toUpperCase(), ML + 8*S, y + headerH/2);
  }
  y += headerH;

  // Column header bar
  ctx.fillStyle = '#e10600';
  ctx.fillRect(ML, y, CW, headerH - 8*S);
  ctx.font = `400 ${13*S}px ${F1}`;
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const hdrMidY = y + (headerH-8*S)/2;
  const mode = data.mode || 'overall';

  if (mode === 'race') {
    ctx.fillText('POS', ML+8*S, hdrMidY);
    ctx.fillText('DRIVER', ML+posColW+8*S, hdrMidY);
    ctx.fillText('TEAM', ML+posColW+LOGO_COL_W+8*S, hdrMidY);
    ctx.textAlign='right'; ctx.fillText('POINTS', RW-MR-8*S, hdrMidY);
  } else if (mode === 'standings') {
    ctx.fillText('POS', ML+8*S, hdrMidY);
    ctx.fillText('DRIVER', ML+posColW+8*S, hdrMidY);
    ctx.fillText('TEAM', ML+posColW+LOGO_COL_W+8*S, hdrMidY);
    ctx.textAlign='right'; ctx.fillText('PTS', RW-MR-8*S, hdrMidY);
  } else if (mode === 'constructors') {
    ctx.fillText('POS', ML+8*S, hdrMidY);
    ctx.fillText('TEAM', ML+posColW+8*S, hdrMidY);
    ctx.textAlign='right'; ctx.fillText('PTS', RW-MR-8*S, hdrMidY);
  } else {
    ctx.fillText('POS', ML+8*S, hdrMidY);
    ctx.fillText('TEAM', ML+posColW+8*S, hdrMidY);
    ctx.fillText('TEAM PRINCIPAL', ML+posColW+LOGO_COL_W+8*S, hdrMidY);
    ctx.textAlign='right'; ctx.fillText('PTS', RW-MR-8*S, hdrMidY);
  }
  y += headerH - 8*S + 8*S;

  // Rows
  rows.forEach((row, idx) => {
    const rowY = y + idx * RH_PER_ROW;
    const rowH = RH_PER_ROW - 4*S;
    const midY = rowY + rowH/2;
    const color = TEAM_COL[row.team] || '#555';
    const rr=parseInt(color.slice(1,3),16)||85, gg=parseInt(color.slice(3,5),16)||85, bb=parseInt(color.slice(5,7),16)||85;

    // Row background
    ctx.fillStyle = idx % 2 === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.01)';
    ctx.fillRect(ML, rowY, CW, rowH);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = S;
    ctx.beginPath(); ctx.moveTo(ML, rowY+rowH); ctx.lineTo(RW-MR, rowY+rowH); ctx.stroke();

    // Position
    const pos = (mode === 'race' && row.pos) ? row.pos : idx+1;
    ctx.font = `400 ${20*S}px ${F1}`;
    ctx.fillStyle = idx===0?'#FFD700':idx===1?'#C0C0C0':idx===2?'#CD7F32':'rgba(255,255,255,0.6)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(pos, ML+posColW/2, midY);

    // Team colour bar
    ctx.fillStyle = color;
    ctx.fillRect(ML+posColW, rowY+4*S, 4*S, rowH-8*S);

    // Driver / Team / TP text
    const textX = ML+posColW+LOGO_COL_W+8*S;
    ctx.textAlign = 'left';
    if (mode === 'race' || mode === 'standings') {
      ctx.font = `400 ${15*S}px ${F1}`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(row.driver || '', ML+posColW+16*S, midY-8*S);
      ctx.font = `400 ${11*S}px ${F1}`;
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillText(row.team || '', ML+posColW+16*S, midY+9*S);
    } else if (mode === 'constructors') {
      ctx.font = `400 ${16*S}px ${F1}`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(row.team || '', ML+posColW+16*S, midY);
    } else {
      ctx.font = `400 ${15*S}px ${F1}`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(row.team || '', ML+posColW+16*S, midY-8*S);
      ctx.font = `400 ${11*S}px ${F1}`;
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText(row.driver || '', ML+posColW+16*S, midY+9*S);
    }

    // Points
    ctx.font = `400 ${22*S}px ${F1}`;
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'right';
    ctx.fillText(Math.floor(row.pts), RW-MR-8*S, midY);
  });
}

// ── CONSTRUCTORS POPULATE ──────────────────────────────────────────────────
async function coPopulate() {
  showStatus('co-status', 'Loading...', 'loading');
  try {
    const cfg = await loadConfig();
    const { season, sc } = await getSeasonConfig(cfg);
    document.getElementById('co-season').value = season;

    const view      = document.getElementById('co-view').value;
    const isOverall = view === 'overall';

    const round   = document.getElementById('co-round').value.trim();
    if (!round) throw new Error('Please enter a round number first');

    window._coRows = [];

    if (isOverall) {
      // Fetch overall constructors
      const overallUrl = sc['overall_gid'] || cfg['overall_gid'];
      if (!overallUrl) throw new Error('No overall_gid in config');
      const idM  = overallUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
      const gidM = overallUrl.match(/gid=(\d+)/);
      if (!idM) throw new Error('Invalid overall URL');
      const text = await fetchCSV(idM[1], gidM?.[1]||'0');
      const rows = parseCSV(text);
      let hi = -1;
      for (let i = 0; i < rows.length; i++) {
        if (rows[i].some(c => (c||'').toLowerCase().trim() === 'pos')) { hi = i; break; }
      }
      if (hi >= 0) {
        const hd = rows[hi];
        // This sheet's headers (Pos/Team/Points/Gap/team principal) sit in
        // columns D/F/H/J/L, not A/B — find each by its actual header text
        // rather than assuming a fixed position.
        let teamCol = hd.findIndex(v => (v||'').toLowerCase().trim() === 'team');
        let ptsCol = hd.findIndex(v => (v||'').toLowerCase().trim() === 'points');
        if (ptsCol < 0) ptsCol = 3;
        let tpCol  = hd.findIndex(v => (v||'').toLowerCase().includes('principal') || (v||'').toLowerCase() === 'owner');
        let gapCol = hd.findIndex(v => (v||'').toLowerCase().trim() === 'gap');
        // The clean "team" column next to team principal is a SEPARATE,
        // independently-ordered static reference table — not row-aligned
        // with the ranked Pos/Team/Points rows. Find its own column via the
        // LAST 'team' header match (the ranked table's own is the first).
        let principalTeamCol = -1;
        hd.forEach((v,ci) => { if ((v||'').toLowerCase().trim() === 'team') principalTeamCol = ci; });
        const principalMap = {};
        if (tpCol >= 0 && principalTeamCol >= 0) {
          for (let i = hi + 1; i < rows.length; i++) {
            const refTeam = (rows[i][principalTeamCol]||'').trim();
            const refTp   = (rows[i][tpCol]||'').trim();
            if (refTeam && refTp) principalMap[refTeam.toLowerCase()] = refTp;
          }
        }
        for (let i = hi + 1; i < rows.length; i++) {
          const team = teamCol >= 0 ? (rows[i][teamCol]||'').trim() : '';
          const pts  = parseFloat((rows[i][ptsCol]||'0').replace(/,/g,'')) || 0;
          const gap  = gapCol >= 0 ? (rows[i][gapCol]||'').trim() : '';
          if (!team) break;
          const tKey = team.toLowerCase();
          const matchedName = Object.keys(principalMap).find(name => tKey.includes(name) || name.includes(tKey));
          const tp = matchedName ? principalMap[matchedName] : '';
          window._coRows.push({ team, pts, tp, gap, isOverall: true });
        }
      }
    } else {
      // Fetch per-division constructors
      const sheetId = sc[`d${view}_sheet_id`];
      const consGid = sc[`d${view}_constructors_gid`];
      if (!sheetId || !consGid) throw new Error(`No constructors GID for Division ${view}`);
      const text = await fetchCSV(sheetId, consGid);
      const rows = parseCSV(text);
      let hi = -1;
      for (let i = 0; i < rows.length; i++) {
        if ((rows[i][0]||'').trim().toLowerCase() === 'pos') { hi = i; break; }
      }
      if (hi >= 0) {
        const hd = rows[hi];
        let ptsCol = hd.findIndex(v => (v||'').toLowerCase().trim() === 'points');
        if (ptsCol < 0) ptsCol = 2;
        let gapCol = hd.findIndex(v => (v||'').toLowerCase().trim() === 'gap');
        for (let i = hi + 1; i < rows.length; i++) {
          const team = (rows[i][1]||'').trim();
          const pts  = parseFloat((rows[i][ptsCol]||'0').replace(/,/g,'')) || 0;
          const gap  = gapCol >= 0 ? (rows[i][gapCol]||'').trim() : '';
          if (!team) break;
          window._coRows.push({ team, pts, gap, isOverall: false });
        }
      }
    }

    // Sort by points descending — neither branch above sorts the sheet's
    // own row order, so without this it just renders in whatever order
    // the sheet happens to list teams (e.g. alphabetical), not by standing.
    window._coRows.sort((a,b) => b.pts - a.pts);

    const label = isOverall ? 'Overall Constructors' : `Division ${view} Constructors`;
    showStatus('co-status', `✓ Loaded ${label} — ${window._coRows.length} teams`, 'ok');
    document.getElementById('co-output').style.display = 'block';

    // Render preview
    const renderCanvas = document.getElementById('renderCanvas2');
    const previewCanvas = document.getElementById('co-preview');
    const data = coGetData();
    await loadF1Font();
    tbRenderFrame(renderCanvas.getContext('2d'), data, 0);
    const pCtx = previewCanvas.getContext('2d');
    pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    pCtx.drawImage(renderCanvas, 0, 0, previewCanvas.width, previewCanvas.height);

  } catch(e) {
    showStatus('co-status', `Error: ${e.message}`, 'err');
    console.error(e);
  }
}

// ── SHARED GENERATE RUNNER ─────────────────────────────────────────────────
async function runGenerate(data, canvas, filename, barId, labelId, statusId) {
  showStatus(statusId, 'Preparing...', 'loading');
  try {
    await Promise.all([loadF1Font(), tbPreloadLogos(data.rows)]);
  } catch(e) {}

  const mime = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']
    .find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';

  const stream  = canvas.captureStream(FPS);
  const chunks  = [];
  const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 20_000_000 });
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.start(100);

  const numRows        = (data.rows || []).length;
  const flipStart      = T_EXIT_START_OFFSET + (numRows + 1) * T_EXIT_GAP + T_EXIT_DUR + T_FLIP_OFFSET;
  const boxStart       = flipStart + T_FLIP_GAP + T_FLIP_DUR + T_BOX_OFFSET;
  // End after last row fully exits (stagger + exit duration) + hold
  const lastRowExitEnd = T_EXIT_START_OFFSET + (numRows * T_EXIT_GAP) + T_EXIT_DUR;
  const TOTAL_DUR      = lastRowExitEnd + T_HOLD_END;
  const totalFrames    = Math.ceil(TOTAL_DUR * FPS);
  const msPerFrame     = 1000 / FPS;
  let frame = 0;

  setProgress(barId, labelId, 2, 'Rendering frames...');

  await new Promise(resolve => {
    function next() {
      if (frame >= totalFrames) { resolve(); return; }
      const start = performance.now();
      tbRenderFrame(canvas.getContext('2d'), data, frame / FPS);
      frame++;
      if (frame % 20 === 0) {
        const pct = Math.round((frame / totalFrames) * 94) + 2;
        setProgress(barId, labelId, pct, `Frame ${frame} / ${totalFrames}`);
      }
      const elapsed = performance.now() - start;
      setTimeout(next, Math.max(0, msPerFrame - elapsed));
    }
    next();
  });

  recorder.stop();
  await new Promise(r => recorder.onstop = r);
  setProgress(barId, labelId, 99, 'Packaging...');

  const blob = new Blob(chunks, { type: mime });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);

  setProgress(barId, labelId, 100, 'Done!');
  showStatus(statusId, '✓ Video downloaded!', 'ok');
}

// ── Render ────────────────────────────────────────────────────────
const FPS=30, W=1440, H=2560;
const T_HEADER=1.2, T_ROW_START=4.1, T_ROW_GAP=0.18, T_HOLD=4.5;
const T_EXIT_START_OFFSET = T_ROW_START + (12 * T_ROW_GAP) + 0.6 + T_HOLD;
const T_EXIT_GAP  = 0.15;
const T_EXIT_DUR  = 0.9;
const T_FLIP_OFFSET = 1.2;
const T_FLIP_DUR  = 1.4;
const T_FLIP_GAP  = 0.45;
const T_HOLD_END  = 2.0;  // hold after last row has fully exited
const T_BOX_OFFSET = 1.0;
const T_BOX_DUR    = 3.0;
const T_BOX_DUR2   = 4.0;
const T_BOX_GAP    = 1.0;
const TOTAL_DUR = T_EXIT_START_OFFSET + (14 * T_EXIT_GAP) + T_EXIT_DUR + T_FLIP_OFFSET + T_FLIP_GAP + T_FLIP_DUR + T_BOX_OFFSET + (4 * T_BOX_GAP) + T_BOX_DUR + T_HOLD_END;

function easeOut3(t){return 1-Math.pow(1-Math.min(t,1),3);}
function easeOut5(t){return 1-Math.pow(1-Math.min(t,1),5);}
function easeIO2(t){t=Math.min(t,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function tbSetProgress(pct,label){
  document.getElementById('tb-progBar').style.width=pct+'%';
  document.getElementById('tb-progLabel').textContent=label;
}

function tbRenderFrame(ctx, data, t) {
  const S=2;
  const RW=720*S, RH=1280*S;
  const ML=130, MR=160, MT=220, MB=760;
  const CW=RW-ML-MR;
  const F1=f1FontLoaded?"'Formula1',sans-serif":"'Barlow Condensed',sans-serif";

  const numRows = data.rows.length;

  // Available row space — table starts lower
  const headerBottom = MT + 195*S;
  const contentBottom = RH - MB;
  const availForRows = contentBottom - headerBottom - 50*S;
  const ROW_SPACING = Math.floor(availForRows / Math.max(numRows, 1));
  const ROW_START_Y = headerBottom + 50*S + 40*S; // extra offset to push table down

  const LOGO_H = Math.floor(ROW_SPACING * 0.68);
  const LOGO_MAX_W = LOGO_H * 2;
  const LOGO_COL_W = LOGO_MAX_W + 16*S;

  ctx.fillStyle='#0d1117';
  ctx.fillRect(0,0,RW,RH);

  // Scanlines
  ctx.fillStyle='rgba(255,255,255,0.012)';
  for(let y=0;y<RH;y+=3*S) ctx.fillRect(0,y,RW,S);

  // Top bar
  ctx.fillStyle='#e10600';
  ctx.fillRect(0,0,RW,4*S);

  // ── Header — staggered animation, slower slide ──
  // Lines 2+3 fade out when flip phase starts (flip takes over rendering them)
  const flipPhaseStart2 = T_EXIT_START_OFFSET + (data.rows.length + 1) * T_EXIT_GAP + T_EXIT_DUR + T_FLIP_OFFSET;
  const headerLines = [
    { text:`SEASON ${data.season}`,             size:56*S, dir:1,  delay:0.05, color:'#ffffff', permanent:true },
    { text:`${data.gp.toUpperCase()} GRAND PRIX`, size:36*S, dir:-1, delay:0.30, color:'#ffffff', permanent:false },
    { text:`ROUND ${data.round} / ${data.totalRounds}  |  ${data.date}  |  ${data.time}`, size:22*S, dir:1, delay:0.55, color:'#ffffff', permanent:false },
  ];

  let lineY = MT + 22*S;
  headerLines.forEach((line, i) => {
    const p = easeOut5(clamp((t - line.delay) / 2.7, 0, 1));
    if(p <= 0){ lineY += line.size + 10*S; return; }
    // Lines 2 and 3 are handled by flip animation once flip starts — stop drawing them
    if(i > 0 && t >= flipPhaseStart2) { lineY += line.size + 10*S; return; }
    const alpha = Math.min(p*2, 1);
    const slideX = (1-p) * line.dir * -180*S;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(slideX, 0);
    ctx.font=`400 ${line.size}px ${F1}`;
    ctx.textAlign='left'; ctx.textBaseline='top';
    if(i === 2) {
      // Line 3: white text with red pipes
      const parts = line.text.split('|');
      let cx = ML;
      parts.forEach((part, pi) => {
        ctx.fillStyle='#ffffff';
        ctx.fillText(part, cx, lineY);
        cx += ctx.measureText(part).width;
        if(pi < parts.length - 1) {
          ctx.fillStyle='#e10600';
          ctx.fillText('|', cx, lineY);
          cx += ctx.measureText('|').width;
        }
      });
    } else {
      ctx.fillStyle = line.color;
      ctx.fillText(line.text, ML, lineY);
    }
    ctx.restore();
    lineY += line.size + 10*S;
  });

  // Divider — appears after header settles
  const divP = easeOut3(clamp((t - 0.85) / 0.4, 0, 1));
  if(divP > 0){
    ctx.save(); ctx.globalAlpha=divP*0.2;
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=S;
    ctx.beginPath(); ctx.moveTo(ML, MT+170*S); ctx.lineTo(RW-MR, MT+170*S); ctx.stroke();
    ctx.restore();
  }

  // ── Table rows + exit — single draw per row ──
  const maxPts = Math.max(...data.rows.map(r=>r.pts), 1);
  const posColW = 56*S;
  const exitPhaseStart = T_EXIT_START_OFFSET;

  // Division label — top row of table, no background, same slide animation as col header
  const divLabelY = ROW_START_Y - ROW_SPACING*1.5;
  const colExitDelay0 = exitPhaseStart + data.rows.length * T_EXIT_GAP;
  const divExitP = easeOut3(clamp((t - colExitDelay0) / T_EXIT_DUR, 0, 1));
  const divEntryP = easeOut3(clamp((t - (T_ROW_START-0.5)) / 0.4, 0, 1));
  if (divEntryP > 0 && data.divLabel) {
    const divSlideX = divExitP > 0 ? -divExitP * (RW + 200*S) : 0;
    const divAlpha  = divExitP > 0 ? Math.max(1 - divExitP * 1.5, 0) : divEntryP;
    ctx.save();
    ctx.globalAlpha = divAlpha;
    ctx.translate(divSlideX, 0);
    ctx.font = `400 ${22*S}px ${F1}`;
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText((data.divLabel || '').toUpperCase(), ML + 8*S, divLabelY);
    ctx.restore();
  }

  // Col header — drawn here so it participates in same logic
  const colY2 = ROW_START_Y - ROW_SPACING/2;
  const colH2 = ROW_SPACING - 4*S;
  const colExitDelay = exitPhaseStart + data.rows.length * T_EXIT_GAP;
  const colExitP = easeOut3(clamp((t - colExitDelay) / T_EXIT_DUR, 0, 1));
  const colEntryP = easeOut3(clamp((t - (T_ROW_START-0.3)) / 0.35, 0, 1));
  if(colEntryP > 0) {
    const colSlideX = colExitP > 0 ? -colExitP * (RW + 200*S) : 0;
    const colAlpha = colExitP > 0 ? 1 - Math.min(colExitP * 1.5, 1) : colEntryP;
    ctx.save();
    ctx.globalAlpha = colAlpha;
    ctx.translate(colSlideX, 0);
    ctx.fillStyle='#e10600';
    ctx.fillRect(ML, colY2-colH2/2, CW, colH2);
    ctx.font=`400 ${11*S}px ${F1}`;
    ctx.fillStyle='#ffffff';
    ctx.textAlign='left'; ctx.textBaseline='middle';

    // Dynamic column headers based on mode
    const mode = data.mode || 'overall';
    if (mode === 'race') {
      ctx.fillText('POS', ML+8*S, colY2);
      ctx.fillText('DRIVER', ML+posColW+8*S, colY2);
      ctx.fillText('TEAM', ML+posColW+LOGO_COL_W+8*S, colY2);
      ctx.textAlign='right';
      ctx.fillText('POINTS', RW-MR, colY2);
    } else if (mode === 'standings') {
      ctx.fillText('POS', ML+8*S, colY2);
      ctx.fillText('DRIVER', ML+posColW+8*S, colY2);
      ctx.fillText('TEAM', ML+posColW+LOGO_COL_W+8*S, colY2);
      ctx.textAlign='right';
      ctx.fillText('PTS', RW-MR, colY2);
    } else if (mode === 'constructors') {
      ctx.fillText('POS', ML+8*S, colY2);
      ctx.fillText('TEAM', ML+posColW+8*S, colY2);
      ctx.textAlign='right';
      ctx.fillText('PTS', RW-MR, colY2);
    } else {
      // overall — with TP
      ctx.fillText('POS', ML+8*S, colY2);
      ctx.fillText('TEAM', ML+posColW+8*S, colY2);
      ctx.fillText('TEAM PRINCIPAL', ML+posColW+LOGO_COL_W+8*S, colY2);
      ctx.textAlign='right';
      ctx.fillText('PTS', RW-MR, colY2);
    }
    ctx.restore();
  }

  data.rows.forEach((row, idx) => {
    const rowDelay = T_ROW_START + idx * T_ROW_GAP;
    const entryP = easeOut5(clamp((t - rowDelay) / 1.35, 0, 1));
    if(entryP <= 0) return; // not yet visible at all

    // Exit — bottom rows exit first
    const exitIdx = data.rows.length - 1 - idx;
    const exitDelay = exitPhaseStart + exitIdx * T_EXIT_GAP;
    const exitP = easeOut3(clamp((t - exitDelay) / T_EXIT_DUR, 0, 1));

    const rowY = ROW_START_Y + idx * ROW_SPACING;
    const rowH = ROW_SPACING - 4*S;
    const midY = rowY + rowH/2;

    // Single translation — exit takes priority over entry once it starts
    const slideX = exitP > 0
      ? -exitP * (RW + 200*S)
      : (1-entryP) * -320*S;
    const alpha = exitP > 0
      ? 1 - Math.min(exitP * 1.5, 1)
      : Math.min(entryP * 2, 1);

    if(alpha <= 0) return;

    const color = TEAM_COL[row.team] || '#555';
    const r2=parseInt(color.slice(1,3),16)||85,
          g2=parseInt(color.slice(3,5),16)||85,
          b2=parseInt(color.slice(5,7),16)||85;
    const pos = (data.mode === 'race' && row.pos) ? row.pos : idx+1;
    const posColor = pos===1?'#FFD700':pos===2?'#C0C0C0':pos===3?'#CD7F32':'rgba(255,255,255,0.45)';

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(slideX, 0);

    ctx.fillStyle=`rgba(${r2},${g2},${b2},0.08)`;
    ctx.fillRect(ML, rowY, CW, rowH);
    ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=S;
    ctx.beginPath(); ctx.moveTo(ML,rowY+rowH); ctx.lineTo(RW-MR,rowY+rowH); ctx.stroke();

    ctx.font=`400 ${24*S}px ${F1}`;
    ctx.fillStyle=posColor; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(pos, ML+posColW/2, midY);

    const logoX = ML+posColW+8*S;
    const logoAreaW = LOGO_COL_W - 16*S;
    const f = LOGO_FILES[row.team];
    const img = f ? tbImgCache[LOGO_BASE+f] : null;
    if(img){
      const scale = Math.min(LOGO_H/img.height, LOGO_MAX_W/img.width);
      const dw=img.width*scale, dh=img.height*scale;
      ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=8*S;
      ctx.drawImage(img, logoX+(logoAreaW-dw)/2, midY-dh/2, dw, dh);
      ctx.shadowColor='transparent'; ctx.shadowBlur=0;
    }

    const nameX = ML+posColW+LOGO_COL_W;
    const nameW = RW-MR-nameX-180*S;
    let fs = 20*S;
    ctx.font=`400 ${fs}px ${F1}`;
    while(ctx.measureText(row.driver).width > nameW && fs > 12*S){ fs-=S; ctx.font=`400 ${fs}px ${F1}`; }
    ctx.fillStyle='#ffffff'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(row.driver, nameX+8*S, midY);

    ctx.font=`400 ${24*S}px ${F1}`;
    ctx.fillStyle='#ffffff'; ctx.textAlign='right';
    ctx.fillText(Math.floor(row.pts), RW-MR, midY-6*S);

    if (data.mode !== 'race') {
      const barStart = RW-MR+16*S;
      const barMaxW  = RW - barStart - 8*S;
      const barW     = maxPts>0 ? (row.pts/maxPts)*barMaxW : 0;
      ctx.fillStyle=`rgba(${r2},${g2},${b2},0.15)`;
      ctx.fillRect(barStart, rowY, barMaxW, ROW_SPACING);
      ctx.fillStyle=`rgba(${r2},${g2},${b2},0.45)`;
      ctx.fillRect(barStart, rowY, barW, ROW_SPACING);
      if(idx > 0){
        const gap = data.rows[0].pts - row.pts;
        ctx.font=`400 ${11*S}px ${F1}`;
        ctx.fillStyle='rgba(255,255,255,0.75)'; ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.fillText(`-${gap}`, barStart+8*S, midY);
      }
    }
    ctx.restore();
  });

  // ── FLIP PHASE — GP name and Round/Date/Time flip to next race ──
  const flipPhaseStart = T_EXIT_START_OFFSET + (data.rows.length + 1) * T_EXIT_GAP + T_EXIT_DUR + T_FLIP_OFFSET;
  const hasNextRace = data.nextGP && data.nextRound;

  // Calculate actual header Y positions to match flip positions
  const hLine1H = 56*S, hLine2H = 36*S, hLine3H = 22*S;
  const hStartY = MT + 22*S;
  const hLine1Y = hStartY;
  const hLine2Y = hLine1Y + hLine1H + 10*S;
  const hLine3Y = hLine2Y + hLine2H + 10*S;

  if(hasNextRace && t > flipPhaseStart - T_FLIP_DUR) {
    const gpH  = hLine2H;
    const rdH  = hLine3H;

    // GP flip — positioned exactly where line 2 is
    const flip1P = easeOut5(clamp((t - flipPhaseStart) / T_FLIP_DUR, 0, 1));
    ctx.save();
    ctx.beginPath(); ctx.rect(ML, hLine2Y - gpH, CW, gpH * 3); ctx.clip();
    if(flip1P < 1){
      ctx.font=`400 ${hLine2H}px ${F1}`; ctx.fillStyle='#ffffff';
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.globalAlpha = 1 - flip1P;
      ctx.fillText(`${data.gp.toUpperCase()} GRAND PRIX`, ML, hLine2Y - flip1P * gpH * 2);
    }
    if(flip1P > 0){
      ctx.font=`400 ${hLine2H}px ${F1}`; ctx.fillStyle='#ffffff';
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.globalAlpha = flip1P;
      ctx.fillText(`${data.nextGP.toUpperCase()} GRAND PRIX`, ML, hLine2Y + (1-flip1P) * gpH * 2);
    }
    ctx.restore(); ctx.globalAlpha=1;

    // Round/Date/Time flip — positioned exactly where line 3 is
    const flip2P = easeOut5(clamp((t - flipPhaseStart - T_FLIP_GAP) / T_FLIP_DUR, 0, 1));
    ctx.save();
    ctx.beginPath(); ctx.rect(ML, hLine3Y - rdH, CW, rdH * 3); ctx.clip();
    const currentRD = `ROUND ${data.round} / ${data.totalRounds}  |  ${data.date}  |  ${data.time}`;
    const nextRD    = `ROUND ${data.nextRound} / ${data.totalRounds}  |  ${data.nextDate}  |  ${data.nextTime}`;
    function drawRdLine(text, x, y, alpha) {
      if(alpha <= 0) return;
      ctx.globalAlpha = alpha;
      ctx.font=`400 ${hLine3H}px ${F1}`;
      ctx.textAlign='left'; ctx.textBaseline='top';
      // Split by | and draw white/red alternating
      const parts = text.split('|');
      let cx = x;
      parts.forEach((part, pi) => {
        ctx.fillStyle='#ffffff';
        ctx.fillText(part, cx, y);
        cx += ctx.measureText(part).width;
        if(pi < parts.length - 1) {
          ctx.fillStyle='#e10600';
          ctx.fillText('|', cx, y);
          cx += ctx.measureText('|').width;
        }
      });
    }
    if(flip2P < 1) drawRdLine(currentRD, ML, hLine3Y - flip2P * rdH * 2, 1 - flip2P);
    if(flip2P > 0) drawRdLine(nextRD, ML, hLine3Y + (1-flip2P) * rdH * 2, flip2P);
    ctx.restore(); ctx.globalAlpha=1;
  }

  // ── BOX PHASE — new layout: small top row + large bottom track box ──
  const boxPhaseStart = flipPhaseStart + T_FLIP_GAP + T_FLIP_DUR + T_BOX_OFFSET;

  if(hasNextRace && t > boxPhaseStart - T_BOX_DUR) {
    const boxAreaTop    = MT + 200*S;
    const boxAreaBottom = RH - MB;
    const boxAreaH      = boxAreaBottom - boxAreaTop;
    const boxAreaLeft   = ML;
    const boxAreaRight  = RW - MR;
    const boxAreaW      = boxAreaRight - boxAreaLeft;
    const GAP           = 16*S;

    // Top row: two small boxes side by side
    const smallH  = boxAreaH * 0.35;
    const smallW  = (boxAreaW - GAP) / 2;
    // Bottom: one large box full width
    const largeH  = boxAreaH - smallH - GAP;
    const largeY  = boxAreaTop + smallH + GAP;

    const DIV_COLS = ['#8B3A3A','#8B6B2E','#7A8B2E','#2E8B57'];

    // ── Box 1 — Next Race (top left) — wipes DOWN ──────────────────────────
    const b1Delay = boxPhaseStart;
    const b1P = easeOut5(clamp((t - b1Delay) / T_BOX_DUR, 0, 1));
    if(b1P > 0) {
      const bx = boxAreaLeft, by = boxAreaTop, bw = smallW, bh = smallH;
      const revealH = b1P * bh;
      ctx.save();
      ctx.beginPath(); ctx.rect(bx, by, bw, revealH); ctx.clip();
      ctx.fillStyle='#161b22'; ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle='#e10600'; ctx.fillRect(bx,by,bw,4*S);
      ctx.font=`400 ${10*S}px ${F1}`; ctx.fillStyle='#e10600';
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText('NEXT RACE', bx+14*S, by+14*S);

      const flagSrc2 = getFlag(data.nextGP||'');
      const flagImg  = flagCache[flagSrc2];
      if(flagImg){
        const fScale=Math.max(bw/flagImg.width, bh/flagImg.height);
        const fdw=flagImg.width*fScale, fdh=flagImg.height*fScale;
        ctx.globalAlpha=0.12;
        ctx.drawImage(flagImg, bx+(bw-fdw)/2, by+(bh-fdh)/2, fdw, fdh);
        ctx.globalAlpha=1;
      }
      const cx=bx+bw/2, midY=by+bh/2+8*S;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font=`400 ${28*S}px ${F1}`; ctx.fillStyle='#ffffff';
      ctx.shadowColor='rgba(0,0,0,0.8)'; ctx.shadowBlur=10*S;
      ctx.fillText((data.nextGP||'').toUpperCase(), cx, midY-28*S);
      ctx.shadowColor='transparent'; ctx.shadowBlur=0;
      ctx.font=`400 ${12*S}px ${F1}`; ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.fillText(`ROUND ${data.nextRound}`, cx, midY+2*S);
      ctx.font=`400 ${15*S}px ${F1}`; ctx.fillStyle='#ffffff';
      ctx.fillText(data.nextDate||'', cx, midY+22*S);
      ctx.fillStyle='#e10600';
      ctx.fillText(data.nextTime||'', cx, midY+42*S);
      ctx.restore();
      ctx.save(); ctx.globalAlpha=b1P;
      ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=S;
      ctx.strokeRect(bx,by,bw,bh); ctx.restore();
    }

    // ── Box 2 — Track Info (bottom large) — wipes from LEFT ───────────────
    const b2Delay = boxPhaseStart + T_BOX_GAP;
    const b2P = easeOut5(clamp((t - b2Delay) / T_BOX_DUR2, 0, 1));
    if(b2P > 0) {
      const bx=boxAreaLeft, by=largeY, bw=boxAreaW, bh=largeH;
      const revealW = b2P * bw;
      ctx.save();
      ctx.beginPath(); ctx.rect(bx, by, revealW, bh); ctx.clip();
      ctx.fillStyle='#161b22'; ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle='#e10600'; ctx.fillRect(bx,by,bw,4*S);
      ctx.font=`400 ${10*S}px ${F1}`; ctx.fillStyle='#e10600';
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText('TRACK INFO', bx+14*S, by+14*S);

      const ti = data.trackInfo;
      if(ti) {
        // Circuit name — full width across top, auto-scale if too long
        let circuitNameH = 28*S;
        const circuitY = by + 26*S;
        const circuitText = ti.circuit || '—';
        const maxCircuitW = bw - 28*S;
        ctx.font=`400 ${circuitNameH}px ${F1}`; ctx.fillStyle='#ffffff';
        ctx.textAlign='left'; ctx.textBaseline='top';
        while(ctx.measureText(circuitText).width > maxCircuitW && circuitNameH > 14*S) {
          circuitNameH -= S;
          ctx.font=`400 ${circuitNameH}px ${F1}`;
        }
        ctx.fillText(circuitText, bx+14*S, circuitY);

        // Divider line under circuit name
        const splitY = circuitY + circuitNameH + 10*S;
        ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=S;
        ctx.beginPath(); ctx.moveTo(bx+14*S, splitY); ctx.lineTo(bx+bw-14*S, splitY); ctx.stroke();

        // Image and stats below divider
        const contentY = splitY + 8*S;
        const contentH = by + bh - contentY - 14*S;
        const imgAreaW = bw * 0.45;
        const imgX = bx + 14*S;
        if(ti._img) {
          const iScale = Math.min((imgAreaW-14*S)/ti._img.width, contentH/ti._img.height);
          const idw=ti._img.width*iScale, idh=ti._img.height*iScale;
          ctx.drawImage(ti._img, imgX+(imgAreaW-14*S-idw)/2, contentY+(contentH-idh)/2, idw, idh);
        }
        // Stats — right side, bigger text
        const statsX = bx + imgAreaW + 28*S;
        const statRows = [
          { label:'LENGTH',     val: ti.length     || '—' },
          { label:'LAPS',       val: ti.laps       ? String(ti.laps) : '—' },
          { label:'SPRINT LAPS',val: ti.sprintLaps ? String(ti.sprintLaps) : '—' },
          { label:'FIRST RACED',val: ti.firstRaced || '—' },
        ];
        const rowH3 = contentH / statRows.length;
        statRows.forEach((row, si) => {
          const ry = contentY + si * rowH3;
          ctx.font=`400 ${11*S}px ${F1}`; ctx.fillStyle='rgba(255,255,255,0.4)';
          ctx.textAlign='left'; ctx.textBaseline='top';
          ctx.fillText(row.label, statsX, ry);
          ctx.font=`400 ${22*S}px ${F1}`; ctx.fillStyle='#ffffff';
          ctx.textBaseline='top';
          ctx.fillText(row.val, statsX, ry+14*S);
        });
      } else {
        ctx.font=`400 ${11*S}px ${F1}`; ctx.fillStyle='rgba(255,255,255,0.12)';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('TRACK DATA LOADING...', bx+bw/2, by+bh/2);
      }
      ctx.restore();
      ctx.save(); ctx.globalAlpha=b2P;
      ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=S;
      ctx.strokeRect(bx,by,bw,bh); ctx.restore();
    }

    // ── Box 3 — Division Leaders (top right) — wipes UP ───────────────────
    const b3Delay = boxPhaseStart + T_BOX_GAP * 2;
    const b3P = easeOut5(clamp((t - b3Delay) / T_BOX_DUR, 0, 1));
    if(b3P > 0) {
      const bx=boxAreaLeft+smallW+GAP, by=boxAreaTop, bw=smallW, bh=smallH;
      const revealH = b3P * bh;
      // Wipe up — clip from bottom edge upward
      ctx.save();
      ctx.beginPath(); ctx.rect(bx, by+bh-revealH, bw, revealH); ctx.clip();
      ctx.fillStyle='#161b22'; ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle='#e10600'; ctx.fillRect(bx,by,bw,4*S);
      ctx.font=`400 ${10*S}px ${F1}`; ctx.fillStyle='#e10600';
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText('DIVISION LEADERS', bx+14*S, by+14*S);

      const leaders = data.divLeaders || [];
      const rowH2 = (bh - 36*S) / 4;
      for(let d=0;d<4;d++){
        const leader=leaders[d];
        const ry=by+34*S+d*rowH2, rm=ry+rowH2/2;
        const divCol=DIV_COLS[d]||'#555';
        ctx.fillStyle=divCol; ctx.fillRect(bx,ry,6*S,rowH2-2*S);
        ctx.font=`400 ${9*S}px ${F1}`; ctx.fillStyle=divCol;
        ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.fillText(`D${d+1}`, bx+14*S, rm);
        ctx.font=`400 ${12*S}px ${F1}`; ctx.fillStyle='#ffffff';
        ctx.fillText(leader?.driver||'—', bx+38*S, rm-7*S);
        ctx.font=`400 ${9*S}px ${F1}`; ctx.fillStyle='rgba(255,255,255,0.45)';
        ctx.fillText(leader?.team||'', bx+38*S, rm+8*S);
        ctx.font=`400 ${13*S}px ${F1}`; ctx.fillStyle='#ffffff';
        ctx.textAlign='right';
        ctx.fillText(leader?.pts||'', bx+bw-14*S, rm);
        if(d<3){
          ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=S;
          ctx.beginPath(); ctx.moveTo(bx,ry+rowH2-S); ctx.lineTo(bx+bw,ry+rowH2-S); ctx.stroke();
        }
      }
      ctx.restore();
      ctx.save(); ctx.globalAlpha=b3P;
      ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=S;
      ctx.strokeRect(bx,by,bw,bh); ctx.restore();
    }
  }

  // Bottom + top bars always on top
  ctx.fillStyle='#e10600';
  ctx.fillRect(0,0,RW,4*S);
  ctx.fillRect(0,RH-4*S,RW,4*S);
}

</script>
